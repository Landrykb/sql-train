# StackHawk DAST configuration for Bleepx / Next.js frontend
# Set HAWK_API_KEY and HAWK_APP_ID as repository secrets before enabling.
app:
  applicationId: ${HAWK_APP_ID}
  env: ${HAWK_ENV:dev}
  host: ${HAWK_HOST}
  # Wait until the target is reachable before scanning.
  waitForAppTarget:
    timeoutMinutes: 2
    # Skip non-essential paths to reduce scan time and noise.
  excludePaths:
    - /_next/*
    - /static/*
    - /favicon.ico
    - /manifest.json
    - /api/auth/*
    - /auth/*

hawk:
  spider:
    maxDurationMinutes: 10
    # Use the ajax spider if the app is heavy on client-side navigation.
    ajax: false
