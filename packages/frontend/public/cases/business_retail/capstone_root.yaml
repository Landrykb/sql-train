id: capstone_root
name: Retail Capstone
tier: 5
domain: Business Retail
description: Build a comprehensive retail dashboard
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
  - joins_returns
  - window_cumsum
  - cte_profit
seedQuery: |-
  -- TODO: write query for capstone_root
  SELECT 1;
solutionQuery: |-
  WITH Sales AS (
   SELECT branch, product_line, SUM(total) AS total_sales
   FROM business_retail
   GROUP BY branch, product_line
  ),
  Returns AS (
   SELECT b.branch, b.product_line, COUNT(r.invoice_id) AS return_count
   FROM business_retail b
   JOIN returns r ON b.invoice_id = r.invoice_id
   GROUP BY b.branch, b.product_line
  )
  SELECT s.branch, s.product_line, s.total_sales, COALESCE(r.return_count, 0) AS return_count
  FROM Sales s
  LEFT JOIN Returns r ON s.branch = r.branch AND s.product_line = r.product_line
  ORDER BY s.total_sales DESC;
instructions: Summarize sales, returns, and profit by branch and product line
hints:
  - Review all SQL concepts in the GuideBook
  - Use multiple CTEs for clarity
  - Join sales and returns
  - Group by branch and product_line
