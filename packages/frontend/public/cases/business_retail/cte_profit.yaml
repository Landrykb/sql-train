id: cte_profit
name: Profit Analysis
tier: 4
domain: Business Retail
description: Analyze profit margins using CTEs
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
  - joins_returns
seedQuery: |-
  -- TODO: write query for cte_profit
  SELECT 1;
solutionQuery: |-
  WITH ReturnTotals AS (
   SELECT b.branch, SUM(b.total) AS return_total
   FROM business_retail b
   JOIN returns r ON b.invoice_id = r.invoice_id
   GROUP BY b.branch
  )
  SELECT b.branch, SUM(b.total) - COALESCE(r.return_total, 0) AS net_profit
  FROM business_retail b
  LEFT JOIN ReturnTotals r ON b.branch = r.branch
  GROUP BY b.branch
  ORDER BY net_profit DESC;
instructions: Calculate net profit by branch after accounting for returns, using a
  CTE
hints:
  - Review CTEs in the GuideBook
  - Use a CTE to compute returns
  - Subtract return totals from sales
  - Group by branch
