solutionQuery: |-
  SELECT des, close_approach_date, dist_km
  FROM space_neo
  WHERE dist_km < 500000
  ORDER BY close_approach_date DESC
  LIMIT 5;
instructions: Select top 5 NEOs with distance < 500000 km, order by date
