id: cte_soil
name: Soil Health Analysis
tier: 4
domain: Farming Ndvi
description: Summarize soil and yield metrics using CTEs
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: farming_yield
    file: farming_yield.csv
  - name: soil_data
    file: soil_data.csv
prereq_cases:
  - ndvi_overview
  - yield_by_crop
  - soil_joins
seedQuery: |-
  -- TODO: write query for cte_soil
  SELECT 1;
solutionQuery: |-
  WITH SoilBuckets AS (
   SELECT f.id, f.yield, f.ndvi, ROUND(s.soil_ph, 1) AS ph_bucket
   FROM farming_yield f
   JOIN soil_data s ON f.id = s.id
  )
  SELECT ph_bucket, AVG(ndvi) AS avg_ndvi, AVG(yield) AS avg_yield
  FROM SoilBuckets
  GROUP BY ph_bucket
  ORDER BY avg_yield DESC;
instructions: Calculate average NDVI and yield by soil pH range, using a CTE
hints:
  - Review CTEs in the GuideBook
  - Use a CTE to bucket soil pH
  - Join yield and soil data
  - Group by pH range
schema:
  - name: farming_yield
    columns:
      - name: id
        type: INTEGER
      - name: region
        type: TEXT
      - name: ndvi
        type: FLOAT
      - name: yield
        type: FLOAT
      - name: year
        type: INTEGER
      - name: month
        type: INTEGER
      - name: soil_type
        type: TEXT
  - name: soil_data
    columns:
      - name: id
        type: INTEGER
      - name: soil_ph
        type: FLOAT
      - name: soil_type
        type: TEXT
