id: capstone_social
name: Social Media Capstone
tier: 5
domain: Social Twitter
description: Build a comprehensive social media dashboard
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: tweets
    file: tweets.csv
  - name: users
    file: users.csv
prereq_cases:
  - post_select
  - engagement_by_type
  - user_joins
  - likes_trend
  - cte_engagement
seedQuery: |-
  -- TODO: write query for capstone_social
  SELECT 1;
solutionQuery: |-
  WITH TweetStats AS (
   SELECT user_id, COUNT(*) AS tweet_count
   FROM tweets
   GROUP BY user_id
  ),
  UserStats AS (
   SELECT user_id, user_name
   FROM users
  )
  SELECT u.user_name, t.tweet_count
  FROM TweetStats t
  JOIN UserStats u ON t.user_id = u.user_id
  ORDER BY t.tweet_count DESC;
instructions: Summarize tweet engagement and user activity
hints:
  - Review all SQL concepts in the GuideBook
  - Use multiple CTEs for clarity
  - Join tweets and users
  - Group by user
schema:
  - name: tweets
    columns:
      - name: tweet_id
        type: TEXT
      - name: user_id
        type: TEXT
      - name: created_at
        type: DATE
      - name: text
        type: TEXT
  - name: users
    columns:
      - name: user_id
        type: TEXT
      - name: user_name
        type: TEXT
      - name: signup_date
        type: DATE
