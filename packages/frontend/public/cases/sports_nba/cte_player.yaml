id: cte_player
name: Player Efficiency Analysis
tier: 4
domain: Sports Nba
description: Summarize player efficiency using CTEs
skills:
  - ctes
  - aggregation
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases:
  - match_select
  - score_by_team
  - player_joins
seedQuery: |-
  -- TODO: write query for cte_player
  SELECT 1;
solutionQuery: |-
  WITH Efficiency AS (
   SELECT player_id, (points + assists + rebounds) AS efficiency
   FROM nba_games
  )
  SELECT player_id, AVG(efficiency) AS avg_efficiency
  FROM Efficiency
  GROUP BY player_id
  ORDER BY avg_efficiency DESC;
instructions: Calculate average efficiency by player, using a CTE
hints:
  - Review CTEs in the GuideBook
  - Use a CTE to compute efficiency
  - Group by player_id
  - Order by efficiency
schema:
  - name: nba_games
    columns:
      - name: game_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: points
        type: INTEGER
      - name: assists
        type: INTEGER
      - name: rebounds
        type: INTEGER
      - name: game_date
        type: DATE
  - name: shot_zones
    columns:
      - name: shot_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: shot_zone
        type: TEXT
      - name: made
        type: BOOLEAN
