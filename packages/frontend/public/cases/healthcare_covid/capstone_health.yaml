seedQuery: |-
  -- TODO: write query for capstone_health
  SELECT 1;
solutionQuery: |-
  WITH PatientTreatments AS (
   SELECT p.patient_id, p.age, t.diagnosis
   FROM patients p
   JOIN treatments t ON p.patient_id = t.patient_id
  ),
  Admissions AS (
   SELECT patient_id, COUNT(*) AS admission_count
   FROM admissions
   GROUP BY patient_id
  )
  SELECT pt.diagnosis, ROUND(AVG(pt.age), 1) AS avg_age, SUM(COALESCE(a.admission_count, 0)) AS total_admissions
  FROM PatientTreatments pt
  LEFT JOIN Admissions a ON pt.patient_id = a.patient_id
  GROUP BY pt.diagnosis
  ORDER BY total_admissions DESC;
instructions: Summarize patient admissions, treatments, and outcomes
