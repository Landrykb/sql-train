id: window_cumsum
name: Cumulative Sales
tier: 3
domain: Business Retail
description: Calculate cumulative sales by branch
skills:
  - window_functions
  - aggregation
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
seedQuery: |-
  -- TODO: write query for window_cumsum
  SELECT 1;
solutionQuery: |-
  SELECT branch, date, total,
   SUM(total) OVER (PARTITION BY branch ORDER BY date) AS cumulative_sales
  FROM business_retail
  ORDER BY branch, date;
instructions: Compute running total of sales per branch, ordered by date
hints:
  - Review window functions in the GuideBook
  - Use SUM OVER to calculate cumulative total
  - PARTITION BY branch
  - Order by date
thoughtProcess:
  - "The question says 'running total of sales per branch'. A running total means each row shows the sum of all rows up to that point — this is a window function pattern."
  - "Window functions use the OVER() clause. Unlike GROUP BY which collapses rows, OVER() keeps every row and computes across a 'window' of related rows."
  - "PARTITION BY branch means 'restart the calculation for each branch'. Without it, you'd get one running total across all branches mixed together."
  - "ORDER BY date inside the OVER() tells SQL the order to accumulate: SUM(total) OVER (PARTITION BY branch ORDER BY date) adds up totals chronologically within each branch."
  - "Your SELECT needs the raw columns too: branch, date, total — plus the window calculation AS cumulative_sales. This shows both the individual sale and the running total side by side."
  - "The outer ORDER BY branch, date sorts the final output. Pattern: SELECT col, AGG(col) OVER (PARTITION BY group_col ORDER BY sort_col) FROM table ORDER BY group_col, sort_col."
schema:
  - name: business_retail
    columns:
      - name: invoice_id
        type: TEXT
      - name: branch
        type: TEXT
      - name: city
        type: TEXT
      - name: customer_type
        type: TEXT
      - name: gender
        type: TEXT
      - name: product_line
        type: TEXT
      - name: unit_price
        type: FLOAT
      - name: quantity
        type: INTEGER
      - name: tax_5
        type: FLOAT
      - name: total
        type: FLOAT
      - name: date
        type: DATE
      - name: time
        type: TEXT
      - name: payment
        type: TEXT
      - name: cogs
        type: FLOAT
      - name: gross_margin_percentage
        type: FLOAT
      - name: gross_income
        type: FLOAT
      - name: rating
        type: FLOAT
  - name: returns
    columns:
      - name: invoice_id
        type: TEXT
      - name: return_date
        type: DATE
      - name: return_reason
        type: TEXT
