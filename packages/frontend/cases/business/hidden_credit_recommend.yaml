id: hidden_credit_recommend
name: "Find High-Value Customers for Loyalty Program"
tier: 7
domain: Business Retail
description: A real-world business scenario — the marketing team needs you to identify high-spending, high-satisfaction customers to invite into a premium loyalty program.
hidden: true
