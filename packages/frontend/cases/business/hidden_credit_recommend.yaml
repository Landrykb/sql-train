  - capstone_root
  - hidden_sales_boost
seedQuery: |-
  -- BUSINESS SCENARIO: The Head of Marketing asks:
  -- "We're launching a Premium Loyalty Program.
  --  Find customers who spend a lot, rate us highly,
  --  and rarely return items. Rank them so we can
  --  send invitations to the top candidates first."
  --
  -- Write a query to identify and rank these customers!
  SELECT 1;
solutionQuery: |-
  WITH CustomerMetrics AS (
    SELECT
      b.customer_type,
      b.gender,
      b.branch,
      COUNT(DISTINCT b.invoice_id) AS total_purchases,
      ROUND(SUM(b.total), 2) AS total_spent,
      ROUND(AVG(b.rating), 2) AS avg_rating,
      COUNT(DISTINCT r.invoice_id) AS return_count
    FROM business_retail b
    LEFT JOIN returns r ON b.invoice_id = r.invoice_id
    GROUP BY b.customer_type, b.gender, b.branch
  ),
  Scored AS (
    SELECT *,
      CASE
        WHEN total_spent > 30000 AND avg_rating >= 7.0 AND return_count < 30 THEN 'Platinum Invite'
        WHEN total_spent > 20000 AND avg_rating >= 6.5 THEN 'Gold Invite'
        WHEN total_spent > 10000 THEN 'Silver Invite'
        ELSE 'Not Eligible'
      END AS program_tier,
      ROW_NUMBER() OVER (ORDER BY total_spent DESC) AS spend_rank
    FROM CustomerMetrics
  )
  SELECT
    branch,
    customer_type,
    gender,
    total_purchases,
    total_spent,
    avg_rating,
    return_count,
    program_tier,
    spend_rank
  FROM Scored
  ORDER BY spend_rank;
instructions: |-
  The marketing team is launching a Premium Loyalty Program. They need you to:

  1. Calculate per-segment metrics (by customer_type, gender, branch):
     total_purchases, total_spent, avg_rating, return_count
  2. Classify each segment into a program_tier:
     - Platinum Invite: spent > 30000, avg_rating >= 7.0, returns < 30
     - Gold Invite: spent > 20000, avg_rating >= 6.5
     - Silver Invite: spent > 10000
     - Not Eligible: everyone else
  3. Rank by total_spent descending using ROW_NUMBER()

  Return: branch, customer_type, gender, total_purchases, total_spent,
  avg_rating, return_count, program_tier, spend_rank
hints:
  - Use a CTE to compute per-segment metrics with GROUP BY
  - LEFT JOIN returns to count returned items per segment
  - Use CASE with multiple conditions for the program_tier
  - Use ROW_NUMBER() OVER (ORDER BY total_spent DESC) for ranking
  - Review the window concept in the GuideBook
thoughtProcess:
  - "Marketing wants customer segments ranked for a loyalty program. Break it down: (1) compute metrics per segment, (2) classify tiers, (3) rank by spending."
  - "CTE 1 — CustomerMetrics: GROUP BY customer_type, gender, branch. Compute COUNT(DISTINCT invoice_id) AS total_purchases, SUM(total) AS total_spent, AVG(rating), and COUNT returns via LEFT JOIN."
  - "Why LEFT JOIN returns? Because not every customer has returns. LEFT JOIN keeps all customers; COUNT(DISTINCT r.invoice_id) gives 0 for those with no returns."
  - "CTE 2 — Scored: SELECT * from CustomerMetrics plus a CASE for program_tier. Put the strictest tier first: Platinum needs spent > 30000 AND rating >= 7.0 AND returns < 30."
  - "Add ROW_NUMBER() OVER (ORDER BY total_spent DESC) AS spend_rank in the same CTE. ROW_NUMBER gives unique ranks (1, 2, 3...) — no ties. This is a window function that doesn't need PARTITION BY since you want a global rank."
  - "Final SELECT picks the columns marketing needs. The pattern: CTE for metrics → CTE for classification + ranking → clean SELECT. Each layer is independently testable."
  - "Pro tip: when combining CASE and window functions in the same SELECT, they both work on the same row set. CASE classifies, ROW_NUMBER ranks — they don't interfere with each other."
