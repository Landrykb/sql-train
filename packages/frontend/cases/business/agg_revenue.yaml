id: agg_revenue
name: Total Revenue by Product
tier: 1
domain: Business Retail
description: Calculate total revenue by product line
skills:
  - group
  - aggregation
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
seedQuery: |-
  -- TODO: write query for agg_revenue
  SELECT *;
solutionQuery: |-
  SELECT product_line, SUM(total) AS total_revenue
  FROM business_retail
  GROUP BY product_line
  ORDER BY total_revenue DESC;
instructions: Write a query to sum the total revenue for each product line, ordered
  by revenue
hints:
  - Review the group concept in the GuideBook
  - Use SUM to aggregate totals
  - Use GROUP BY to group by product_line
  - Use ORDER BY to sort results
thoughtProcess:
  - "The question says 'total revenue for each product line'. The words 'for each' are the key — they tell you to GROUP BY that column."
  - "What are you summing? The total column holds each transaction's amount. SUM(total) adds them all up within each group."
  - "Give your sum a clear name with AS: SUM(total) AS total_revenue. This alias makes results readable and lets you reference it in ORDER BY."
  - "SELECT product_line, SUM(total) AS total_revenue FROM business_retail GROUP BY product_line — every non-aggregated column in SELECT must appear in GROUP BY."
  - "Finally, 'ordered by revenue' means ORDER BY total_revenue DESC. The general pattern for aggregation: SELECT group_col, AGG(value_col) FROM table GROUP BY group_col ORDER BY AGG(value_col)."
