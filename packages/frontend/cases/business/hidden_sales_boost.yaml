id: hidden_sales_boost
name: "How to Increase Sales"
tier: 6
domain: Business Retail
description: A real-world business scenario — identify which product lines, branches, and customer segments to target for a sales growth campaign.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
  - joins_returns
  - window_cumsum
  - cte_profit
  - capstone_root
seedQuery: |-
  -- BUSINESS SCENARIO: The VP of Sales asks you:
  -- "Which product lines at which branches have the
  --  highest revenue but lowest customer satisfaction?
  --  Those are our growth opportunities — fix the
  --  experience and sales will climb."
  --
  -- Write a query to find the answer!
  SELECT 1;
solutionQuery: |-
  WITH BranchProduct AS (
    SELECT
      branch,
      product_line,
      SUM(total) AS total_revenue,
      ROUND(AVG(rating), 2) AS avg_rating,
      COUNT(*) AS transaction_count
    FROM business_retail
    GROUP BY branch, product_line
  )
  SELECT
    branch,
    product_line,
    total_revenue,
    avg_rating,
    transaction_count,
    CASE
      WHEN total_revenue > 18000 AND avg_rating < 7.0 THEN 'High Priority'
      WHEN total_revenue > 15000 AND avg_rating < 7.0 THEN 'Medium Priority'
      ELSE 'Monitor'
    END AS growth_opportunity
  FROM BranchProduct
  ORDER BY total_revenue DESC;
instructions: |-
  The VP of Sales wants to know: Which product lines at which branches generate
  high revenue but have low customer satisfaction (avg rating < 7)?

  Write a query that returns branch, product_line, total_revenue, avg_rating,
  transaction_count, and a growth_opportunity label (High/Medium Priority or Monitor).

  Order by total_revenue descending.
hints:
  - Use a CTE to pre-aggregate by branch and product_line
  - Use CASE to classify growth opportunities
  - AVG(rating) gives customer satisfaction
  - SUM(total) gives revenue per segment
  - Review the case concept in the GuideBook
