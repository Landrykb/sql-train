  - capstone_root
seedQuery: |-
  -- BUSINESS SCENARIO: The VP of Sales asks you:
  -- "Which product lines at which branches have the
  --  highest revenue but lowest customer satisfaction?
  --  Those are our growth opportunities — fix the
  --  experience and sales will climb."
  --
  -- Write a query to find the answer!
  SELECT 1;
solutionQuery: |-
  WITH BranchProduct AS (
    SELECT
      branch,
      product_line,
      SUM(total) AS total_revenue,
      ROUND(AVG(rating), 2) AS avg_rating,
      COUNT(*) AS transaction_count
    FROM business_retail
    GROUP BY branch, product_line
  )
  SELECT
    branch,
    product_line,
    total_revenue,
    avg_rating,
    transaction_count,
    CASE
      WHEN total_revenue > 18000 AND avg_rating < 7.0 THEN 'High Priority'
      WHEN total_revenue > 15000 AND avg_rating < 7.0 THEN 'Medium Priority'
      ELSE 'Monitor'
    END AS growth_opportunity
  FROM BranchProduct
  ORDER BY total_revenue DESC;
instructions: |-
  The VP of Sales wants to know: Which product lines at which branches generate
  high revenue but have low customer satisfaction (avg rating < 7)?

  Write a query that returns branch, product_line, total_revenue, avg_rating,
  transaction_count, and a growth_opportunity label (High/Medium Priority or Monitor).

  Order by total_revenue descending.
hints:
  - Use a CTE to pre-aggregate by branch and product_line
  - Use CASE to classify growth opportunities
  - AVG(rating) gives customer satisfaction
  - SUM(total) gives revenue per segment
  - Review the case concept in the GuideBook
thoughtProcess:
  - "Real-world scenario! The VP asks 'high revenue but low satisfaction'. Translate business language to SQL: high revenue = SUM(total), low satisfaction = AVG(rating) < 7."
  - "You need metrics grouped by branch AND product_line. Build a CTE first: WITH BranchProduct AS (SELECT branch, product_line, SUM(total) AS total_revenue, ROUND(AVG(rating), 2) AS avg_rating, COUNT(*) AS transaction_count FROM business_retail GROUP BY branch, product_line)."
  - "Now classify with CASE WHEN: this is SQL's if/else. CASE WHEN total_revenue > 18000 AND avg_rating < 7.0 THEN 'High Priority' WHEN total_revenue > 15000 AND avg_rating < 7.0 THEN 'Medium Priority' ELSE 'Monitor' END AS growth_opportunity."
  - "CASE conditions are checked top-to-bottom — put the strictest condition first. If revenue > 18000 AND low rating, that's high priority. The ELSE catches everything that doesn't match."
  - "ROUND(AVG(rating), 2) rounds to 2 decimal places for clean output. Always round aggregates in business reports."
  - "The final SELECT pulls from the CTE and adds the CASE classification. ORDER BY total_revenue DESC shows the biggest revenue segments first — exactly what a VP wants to see."
  - "Real-world pattern: CTE for metrics → CASE for business classification → ORDER BY for prioritization. This is how analysts build executive dashboards."
