id: joins_returns
name: Returns vs Sales
tier: 2
domain: Business Retail
description: Analyze sales with return reasons
skills:
  - join
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
seedQuery: |-
  -- TODO: write query for joins_returns
  SELECT 1;
solutionQuery: |-
  SELECT b.invoice_id, b.total, r.return_reason
  FROM business_retail b
  LEFT JOIN returns r ON b.invoice_id = r.invoice_id
  WHERE r.return_reason IS NOT NULL
  ORDER BY b.total DESC
  LIMIT 5;
instructions: Join sales and returns to show sales with return reasons, ordered by
  total
hints:
  - Review the join concept in the GuideBook
  - Use LEFT JOIN to include return data
  - Filter for non-null return reasons with WHERE
  - Use LIMIT to get top 5
thoughtProcess:
  - "You need data from TWO tables (business_retail and returns). Whenever you need columns from multiple tables, think JOIN."
  - "Which column connects them? Both tables have invoice_id. That's your join key: ON b.invoice_id = r.invoice_id."
  - "Use LEFT JOIN so you keep all sales rows even if they have no matching return. This preserves the full sales picture."
  - "The question asks for 'sales with return reasons' — that means you only want rows WHERE r.return_reason IS NOT NULL. This filters to only returned items."
  - "Use table aliases (b for business_retail, r for returns) to keep your query short: SELECT b.invoice_id, b.total, r.return_reason."
  - "Finally, ORDER BY b.total DESC LIMIT 5 gives the top 5 highest-value returned sales. Pattern: SELECT → FROM → JOIN ON → WHERE → ORDER BY → LIMIT."
