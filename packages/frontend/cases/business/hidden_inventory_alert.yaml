      - { name: quantity, type: INTEGER }
      - { name: tax_5, type: FLOAT }
      - { name: total, type: FLOAT }
      - { name: date, type: DATE }
      - { name: time, type: TEXT }
      - { name: payment, type: TEXT }
      - { name: cogs, type: FLOAT }
      - { name: gross_margin_percentage, type: FLOAT }
      - { name: gross_income, type: FLOAT }
      - { name: rating, type: FLOAT }
