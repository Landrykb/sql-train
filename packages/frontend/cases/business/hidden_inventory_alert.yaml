id: hidden_inventory_alert
name: "Product Quality Crisis Detection"
tier: 8
domain: Business Retail
description: "The Operations Director suspects certain product lines have quality issues. Find products with high sales volume but disproportionately high return rates — these need urgent quality audits."
hidden: true
skills:
  - select
  - join
  - group
  - order
  - case
  - cte
  - window
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases:
  - basics_select
  - agg_revenue
  - joins_returns
  - window_cumsum
  - cte_profit
  - capstone_root
  - hidden_sales_boost
  - hidden_credit_recommend
seedQuery: |-
  -- OPERATIONS CRISIS: The Operations Director says:
  -- "We're getting complaints about product quality.
  --  I need you to find which product lines have high
  --  sales but abnormally high return rates. Compare
  --  each product line's return rate to the overall
  --  average and flag the worst offenders."
  --
  -- Write a query to detect the quality crisis!
  SELECT 1;
solutionQuery: |-
  WITH ProductSales AS (
    SELECT
      product_line,
      COUNT(DISTINCT b.invoice_id) AS total_sales,
      ROUND(SUM(b.total), 2) AS total_revenue,
      ROUND(AVG(b.rating), 2) AS avg_rating
    FROM business_retail b
    GROUP BY product_line
  ),
  ProductReturns AS (
    SELECT
      b.product_line,
      COUNT(DISTINCT r.invoice_id) AS total_returns
    FROM returns r
    JOIN business_retail b ON r.invoice_id = b.invoice_id
    GROUP BY b.product_line
  ),
  Combined AS (
    SELECT
      ps.product_line,
      ps.total_sales,
      ps.total_revenue,
      ps.avg_rating,
      COALESCE(pr.total_returns, 0) AS total_returns,
      ROUND(COALESCE(pr.total_returns, 0) * 100.0 / ps.total_sales, 2) AS return_rate_pct
    FROM ProductSales ps
    LEFT JOIN ProductReturns pr ON ps.product_line = pr.product_line
  )
  SELECT
    product_line,
    total_sales,
    total_revenue,
    avg_rating,
    total_returns,
    return_rate_pct,
    CASE
      WHEN return_rate_pct > (SELECT AVG(return_rate_pct) FROM Combined) * 1.2 THEN 'URGENT AUDIT'
      WHEN return_rate_pct > (SELECT AVG(return_rate_pct) FROM Combined) THEN 'REVIEW'
      ELSE 'OK'
    END AS quality_status
  FROM Combined
  ORDER BY return_rate_pct DESC;
instructions: |-
  The Operations Director needs a product quality audit report. Write a query that:

  1. Calculates per product_line: total_sales (distinct invoices), total_revenue, avg_rating
  2. Counts returns per product_line by joining with returns table
  3. Computes return_rate_pct = (total_returns / total_sales) * 100
  4. Flags products as:
     - URGENT AUDIT: return rate > 120% of the overall average return rate
     - REVIEW: return rate > overall average return rate
     - OK: everything else
  5. Order by return_rate_pct descending

  Return: product_line, total_sales, total_revenue, avg_rating, total_returns, return_rate_pct, quality_status
hints:
  - Use multiple CTEs to build up the analysis step by step
  - LEFT JOIN returns through business_retail to get product_line for each return
  - A subquery inside CASE can compare against the overall average
  - COALESCE handles product lines with zero returns
thoughtProcess:
  - "The Operations Director wants a quality audit. Break the request into layers: (1) sales metrics per product, (2) return metrics per product, (3) combine them, (4) classify quality status."
  - "CTE 1 — ProductSales: GROUP BY product_line to get COUNT(DISTINCT invoice_id) AS total_sales, SUM(total) AS total_revenue, AVG(rating). Use DISTINCT because one invoice = one sale."
  - "CTE 2 — ProductReturns: JOIN returns to business_retail (to get product_line), then COUNT(DISTINCT r.invoice_id) GROUP BY product_line. Returns don't have product_line directly — you must join through sales."
  - "CTE 3 — Combined: LEFT JOIN ProductSales with ProductReturns on product_line. Compute return_rate_pct = (total_returns * 100.0 / total_sales). Use COALESCE for products with zero returns."
  - "The CASE classification compares each product's return rate against the overall average. Use a subquery: WHEN return_rate_pct > 1.2 * (SELECT AVG(return_rate_pct) FROM Combined) THEN 'URGENT AUDIT'."
  - "Layered CTEs pattern: each CTE solves one piece, and the final SELECT combines and classifies. This is how real data analysts build audit reports — one verifiable step at a time."
