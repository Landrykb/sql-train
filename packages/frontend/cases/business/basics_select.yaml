id: basics_select
name: Inspect Sales Rows
tier: 1
domain: Business Retail
description: Retrieve top sales rows for a specific branch
skills:
  - select
  - filter
datasets:
  - name: business_retail
    file: business_retail.csv
  - name: returns
    file: returns.csv
prereq_cases: []
seedQuery: |-
  -- TODO: write query for basics_select
  SELECT 1;
solutionQuery: |-
  SELECT invoice_id, branch, total
  FROM business_retail
  WHERE branch = 'A'
  ORDER BY total DESC
  LIMIT 5;
instructions: |-
  Write a query to select the top 5 sales rows for branch A, ordered by total
  amount
hints:
  - Review the select concept in the GuideBook
  - Use WHERE to filter by branch
  - Use ORDER BY to sort by total
  - Use LIMIT to get 5 rows
