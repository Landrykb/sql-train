id: hidden_mission_risk
name: "Assess Near-Earth Object Threat Levels"
tier: 6
domain: Space NEO
description: NASA's Planetary Defense team needs you to classify near-earth objects by threat level based on velocity, size, and orbital proximity to prioritize deflection missions.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
datasets:
  - name: space_neo
    file: space_neo.csv
prereq_cases:
  - orbit_select
  - velocity_by_type
  - mission_joins
  - orbit_trend
  - cte_payload
  - capstone_space
seedQuery: |-
  -- SCENARIO: NASA's Planetary Defense asks:
  -- "Classify all near-earth objects by threat
  --  level. We need to know which ones to watch
  --  closely and which might need a deflection
  --  mission."
  SELECT 1;
solutionQuery: |-
  WITH NeoStats AS (
    SELECT
      des,
      close_approach_date,
      dist_km,
      relative_velocity_km_s,
      is_potentially_hazardous
    FROM space_neo
  )
  SELECT
    des,
    close_approach_date,
    ROUND(dist_km, 2) AS dist_km,
    ROUND(relative_velocity_km_s, 2) AS velocity_km_s,
    is_potentially_hazardous,
    CASE
      WHEN is_potentially_hazardous = 'True' AND dist_km < 50000 THEN 'CRITICAL'
      WHEN is_potentially_hazardous = 'True' THEN 'HIGH'
      WHEN dist_km < 100000 THEN 'MODERATE'
      ELSE 'LOW'
    END AS threat_level
  FROM NeoStats
  ORDER BY dist_km ASC
  LIMIT 20;
instructions: |-
  NASA needs a threat assessment of near-earth objects.

  1. Select des, close_approach_date, dist_km, relative_velocity_km_s, is_potentially_hazardous
  2. Classify threat_level:
     - CRITICAL: hazardous AND dist_km < 50,000
     - HIGH: hazardous
     - MODERATE: dist_km < 100,000
     - LOW: everything else
  3. Order by dist_km ascending, LIMIT 20
hints:
  - Check the is_potentially_hazardous column
  - Use CASE with compound conditions
  - Smaller dist_km = closer = more dangerous
  - ROUND for clean output
thoughtProcess:
  - "Mission risk assessment = classify NEOs by size, speed, and proximity. You need to combine multiple metrics into a risk rating using CASE."
  - "CTE — NeoStats: SELECT the key columns — des, close_approach_date, dist_km, relative_velocity_km_s, is_potentially_hazardous. This organizes the raw data."
  - "ROUND for clean output: ROUND(dist_km, 2), ROUND(relative_velocity_km_s, 2). Precision matters in space calculations."
  - "CASE for risk classification: combine is_potentially_hazardous = 'True' with dist_km thresholds. Smaller dist_km = closer = more dangerous."
  - "Use compound conditions: WHEN is_potentially_hazardous = 'True' AND dist_km < threshold THEN 'CRITICAL'. Layer from most severe to least severe."
  - "Pattern: organize raw data in CTE → classify with multi-condition CASE → ORDER BY dist_km ASC. This mirrors real planetary defense risk matrices."
