id: hidden_mission_risk
name: "Assess Near-Earth Object Threat Levels"
tier: 6
domain: Space NEO
description: NASA's Planetary Defense team needs you to classify near-earth objects by threat level based on velocity, size, and orbital proximity to prioritize deflection missions.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
datasets:
  - name: space_neo
    file: space_neo.csv
prereq_cases:
  - orbit_select
  - velocity_by_type
  - mission_joins
  - orbit_trend
  - cte_payload
  - capstone_space
seedQuery: |-
  -- SCENARIO: NASA's Planetary Defense asks:
  -- "Classify all near-earth objects by threat
  --  level. We need to know which ones to watch
  --  closely and which might need a deflection
  --  mission."
  SELECT 1;
solutionQuery: |-
  WITH NeoStats AS (
    SELECT
      neo_id,
      name,
      estimated_diameter_max_km,
      relative_velocity_kmh,
      miss_distance_km,
      is_potentially_hazardous
    FROM space_neo
  )
  SELECT
    name,
    ROUND(estimated_diameter_max_km, 4) AS diameter_km,
    ROUND(relative_velocity_kmh, 2) AS velocity_kmh,
    ROUND(miss_distance_km, 2) AS miss_distance_km,
    is_potentially_hazardous,
    CASE
      WHEN is_potentially_hazardous = 'True' AND miss_distance_km < 5000000 THEN 'CRITICAL'
      WHEN is_potentially_hazardous = 'True' THEN 'HIGH'
      WHEN miss_distance_km < 10000000 THEN 'MODERATE'
      ELSE 'LOW'
    END AS threat_level
  FROM NeoStats
  ORDER BY miss_distance_km ASC
  LIMIT 20;
instructions: |-
  NASA needs a threat assessment of near-earth objects.

  1. Select name, diameter, velocity, miss_distance, is_potentially_hazardous
  2. Classify threat_level:
     - CRITICAL: hazardous AND miss_distance < 5,000,000 km
     - HIGH: hazardous
     - MODERATE: miss_distance < 10,000,000 km
     - LOW: everything else
  3. Order by miss_distance ascending, LIMIT 20
hints:
  - Check the is_potentially_hazardous column
  - Use CASE with compound conditions
  - Smaller miss_distance = closer = more dangerous
  - ROUND for clean output
expected:
