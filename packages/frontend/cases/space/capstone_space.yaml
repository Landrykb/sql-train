id: capstone_space
name: Space Capstone
tier: 5
domain: Space Neo
description: Build a comprehensive NEO dashboard
skills:
  - ctes
  - aggregation
  - date_functions
datasets:
  - name: space_neo
    file: space_neo.csv
prereq_cases:
  - orbit_select
  - velocity_by_type
  - mission_joins
  - orbit_trend
  - cte_payload
seedQuery: |-
  -- TODO: write query for capstone_space
  SELECT 1;
solutionQuery: "WITH NeoStats AS (\n SELECT strftime('%Y', close_approach_date) AS
  year, \n is_potentially_hazardous, \n COUNT(*) AS neo_count\n FROM space_neo\n GROUP
  BY strftime('%Y', close_approach_date), is_potentially_hazardous\n)\nSELECT year,
  is_potentially_hazardous, neo_count\nFROM NeoStats\nORDER BY year, neo_count DESC;"
instructions: Summarize NEO approaches and risks
hints:
  - Review all SQL concepts in the GuideBook
  - Use multiple CTEs for clarity
  - Group by year and hazard status
  - Order by count
thoughtProcess:
  - "Capstone: summarize NEO approaches by year and hazard status. You need a time dimension (year) crossed with a category (hazardous or not)."
  - "CTE — NeoStats: strftime('%Y', close_approach_date) AS year gives the year. GROUP BY year, is_potentially_hazardous creates year-hazard buckets."
  - "COUNT(*) AS neo_count — counts approaches in each year-hazard combination. This creates a pivot-like view of NEO trends."
  - "Main query: SELECT year, is_potentially_hazardous, neo_count FROM NeoStats ORDER BY year, neo_count DESC."
  - "The dual GROUP BY reveals whether hazardous NEO detections are increasing over time — critical for planetary defense planning."
  - "Capstone approach: identify the dimensions (year + category) → aggregate within those dimensions → order to reveal trends."
schema:
  - name: space_neo
    columns:
      - name: des
        type: TEXT
      - name: close_approach_date
        type: DATE
      - name: dist_km
        type: INTEGER
      - name: relative_velocity_km_s
        type: FLOAT
      - name: is_potentially_hazardous
        type: BOOLEAN
expected:
  - is_potentially_hazardous: "False"
    neo_count: 2500
    year: '2025'
  - is_potentially_hazardous: "True"
    neo_count: 2492
    year: '2025'
  - is_potentially_hazardous: "True"
    neo_count: 5
    year: '2026'
  - is_potentially_hazardous: "False"
    neo_count: 3
    year: '2026'
type: standard
tags:
  - space_neo
  - ctes
  - aggregation
  - date_functions
category: Space Neo
