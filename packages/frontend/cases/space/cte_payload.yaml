id: cte_payload
name: NEO Risk Analysis
tier: 4
domain: Space Neo
description: Summarize NEO risks using CTEs
skills:
  - ctes
  - aggregation
datasets:
  - name: space_neo
    file: space_neo.csv
prereq_cases:
  - orbit_select
  - velocity_by_type
  - mission_joins
seedQuery: |-
  -- TODO: write query for cte_payload
  SELECT 1;
solutionQuery: |-
  WITH RiskScores AS (
   SELECT des, (dist_km * relative_velocity_km_s) AS risk_score
   FROM space_neo
  )
  SELECT des, risk_score
  FROM RiskScores
  ORDER BY risk_score DESC
  LIMIT 10;
instructions: Calculate risk scores by NEO, using a CTE
hints:
  - Review CTEs in the GuideBook
  - Use a CTE to compute risk scores
  - Calculate risk as dist_km * relative_velocity_km_s
  - Order by risk score
thoughtProcess:
  - "Risk score = distance × velocity. A CTE keeps the computation separate from the final selection and ordering."
  - "CTE — RiskScores: SELECT des, (dist_km * relative_velocity_km_s) AS risk_score FROM space_neo. This computes a derived metric for every NEO."
  - "Main query: SELECT des, risk_score FROM RiskScores ORDER BY risk_score DESC LIMIT 10. The CTE made the computed column available by name."
  - "Why a CTE here? You could do this in a single query, but the CTE makes the formula explicit and reusable. If you needed risk_score in multiple places, the CTE computes it once."
  - "CTE pattern: compute derived values in WITH → use them cleanly in SELECT. Start simple — even one-CTE queries build good habits for complex multi-CTE problems later."
schema:
  - name: space_neo
    columns:
      - name: des
        type: TEXT
      - name: close_approach_date
        type: DATE
      - name: dist_km
        type: INTEGER
      - name: relative_velocity_km_s
        type: FLOAT
      - name: is_potentially_hazardous
        type: BOOLEAN
