id: diagnosis_count
name: Diagnosis Distribution
tier: 2
domain: Healthcare Covid
description: Count diagnoses from treatments
skills:
  - aggregation
datasets:
  - name: healthcare_covid
    file: healthcare_covid.csv
  - name: patients
    file: patients.csv
  - name: treatments
    file: treatments.csv
  - name: admissions
    file: admissions.csv
prereq_cases:
  - patient_select
seedQuery: |-
  -- TODO: write query for diagnosis_count
  SELECT 1;
solutionQuery: |-
  SELECT diagnosis, COUNT(*) as diagnosis_count
  FROM treatments
  GROUP BY diagnosis
  ORDER BY diagnosis_count DESC;
instructions: Count occurrences of each diagnosis, order by count
hints:
  - Review aggregation in the GuideBook
  - Use GROUP BY for diagnosis
  - Use COUNT for occurrences
  - Order by count
thoughtProcess:
  - "'Count occurrences of each diagnosis' — 'each diagnosis' = GROUP BY diagnosis. 'Count occurrences' = COUNT(*)."
  - "SELECT diagnosis, COUNT(*) AS diagnosis_count — name the aggregate with AS for clarity and so you can ORDER BY it."
  - "FROM treatments GROUP BY diagnosis — every non-aggregated column in SELECT must be in GROUP BY."
  - "ORDER BY diagnosis_count DESC — most common diagnoses first. No LIMIT means you see all diagnoses."
  - "Aggregation pattern: SELECT category, COUNT/SUM/AVG(metric) FROM table GROUP BY category ORDER BY aggregate. This is the bread-and-butter of data analysis."
