id: admission_trend
name: Admission Trends
tier: 3
domain: Healthcare Covid
description: Analyze admission trends over time
skills:
  - aggregation
  - date_functions
datasets:
  - name: healthcare_covid
    file: healthcare_covid.csv
  - name: patients
    file: patients.csv
  - name: treatments
    file: treatments.csv
  - name: admissions
    file: admissions.csv
prereq_cases:
  - patient_select
  - diagnosis_count
seedQuery: |-
  -- TODO: write query for admission_trend
  SELECT 1;
solutionQuery: |-
  SELECT strftime('%Y-%m', admission_date) AS month, COUNT(*) AS admission_count
  FROM admissions
  GROUP BY strftime('%Y-%m', admission_date)
  ORDER BY month;
instructions: Count admissions by month, order by month
hints:
  - Review date functions in the GuideBook
  - Use strftime to group by month
  - Use COUNT for admissions
  - Order by month
thoughtProcess:
  - "'Count admissions by month' — you need to extract the month from admission_date, then count how many admissions fall in each month."
  - "strftime('%Y-%m', admission_date) AS month — converts full dates into year-month format like '2020-03'. This groups all days in March 2020 together."
  - "COUNT(*) AS admission_count — counts rows per group. GROUP BY strftime('%Y-%m', admission_date) — must match the SELECT expression exactly."
  - "ORDER BY month — YYYY-MM format sorts chronologically by default. This creates a time series showing admission trends."
  - "Time-series pattern: strftime for period extraction → COUNT/SUM/AVG → GROUP BY period → ORDER BY period. Use this for any trend analysis across dates."
