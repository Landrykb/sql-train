id: hidden_readmission_risk
name: "Identify Patients at Risk of Readmission"
tier: 6
domain: Healthcare Covid
description: The hospital director needs to reduce readmission rates — identify patient segments with high readmission risk so the care team can provide targeted follow-up.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - join
datasets:
  - name: patients
    file: patients.csv
  - name: admissions
    file: admissions.csv
  - name: treatments
    file: treatments.csv
prereq_cases:
  - patient_select
  - diagnosis_count
  - treatment_joins
  - admission_trend
  - cte_treatment
  - capstone_health
seedQuery: |-
  -- SCENARIO: The Hospital Director asks:
  -- "Which patient groups are most likely to be
  --  readmitted? We need to set up proactive
  --  care follow-ups for high-risk segments."
  SELECT 1;
solutionQuery: |-
  WITH PatientAdmissions AS (
    SELECT
      p.diagnosis,
      p.gender,
      COUNT(DISTINCT a.admission_id) AS total_admissions,
      COUNT(DISTINCT p.patient_id) AS unique_patients,
      ROUND(1.0 * COUNT(DISTINCT a.admission_id) / COUNT(DISTINCT p.patient_id), 2) AS avg_admissions_per_patient
    FROM patients p
    INNER JOIN admissions a ON p.patient_id = a.patient_id
    GROUP BY p.diagnosis, p.gender
  )
  SELECT
    diagnosis,
    gender,
    total_admissions,
    unique_patients,
    avg_admissions_per_patient,
    CASE
      WHEN avg_admissions_per_patient > 2.0 THEN 'High Risk'
      WHEN avg_admissions_per_patient > 1.5 THEN 'Medium Risk'
      ELSE 'Low Risk'
    END AS readmission_risk
  FROM PatientAdmissions
  ORDER BY avg_admissions_per_patient DESC;
instructions: |-
  The hospital director wants to reduce readmissions.

  1. JOIN patients with admissions on patient_id
  2. Group by diagnosis and gender
  3. Calculate: total_admissions, unique_patients, avg_admissions_per_patient
  4. Classify readmission_risk:
     - High Risk: avg > 2.0 admissions per patient
     - Medium Risk: avg > 1.5
     - Low Risk: everything else
  5. Order by avg_admissions_per_patient DESC
hints:
  - COUNT(DISTINCT admission_id) for total admissions
  - COUNT(DISTINCT patient_id) for unique patients
  - Divide total by unique for the ratio
  - Use CASE for risk classification
thoughtProcess:
  - "Readmission risk = patients being admitted multiple times. You need admissions per patient per diagnosis, then classify risk levels."
  - "CTE — PatientAdmissions: JOIN patients with admissions on patient_id. GROUP BY diagnosis, gender. Compute COUNT(DISTINCT admission_id) AS total_admissions and COUNT(DISTINCT patient_id) AS unique_patients."
  - "The ratio total_admissions / unique_patients tells you how often each patient is readmitted on average. Use 1.0 * to force decimal division: ROUND(1.0 * COUNT(DISTINCT a.admission_id) / COUNT(DISTINCT p.patient_id), 2)."
  - "CASE for risk_level: ratio > 2 = 'High Readmission Risk', ratio > 1.5 = 'Moderate Risk', else 'Low Risk'. Higher ratios mean more repeat admissions per patient."
  - "ORDER BY avg_admissions_per_patient DESC highlights the highest-risk diagnosis-gender segments. This is how hospitals prioritize follow-up care programs."
  - "Pattern: aggregate with DISTINCT counts → compute ratios → classify with CASE. The DISTINCT keyword is crucial — without it, you'd count duplicate rows."
expected:
