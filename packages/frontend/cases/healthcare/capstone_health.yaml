id: capstone_health
name: Healthcare Capstone
tier: 5
domain: Healthcare Covid
description: Build a comprehensive healthcare dashboard
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: healthcare_covid
    file: healthcare_covid.csv
  - name: patients
    file: patients.csv
  - name: treatments
    file: treatments.csv
  - name: admissions
    file: admissions.csv
prereq_cases:
  - patient_select
  - diagnosis_count
  - treatment_joins
  - admission_trend
  - cte_treatment
seedQuery: |-
  -- TODO: write query for capstone_health
  SELECT 1;
solutionQuery: |-
  WITH PatientTreatments AS (
    SELECT
      p.patient_id,
      p.age,
      t.diagnosis
    FROM patients p
    INNER JOIN treatments t
      ON p.patient_id = t.patient_id
  ),
  AdmissionsStats AS (
    SELECT
      patient_id,
      COUNT(*)          AS admission_count
    FROM admissions
    GROUP BY patient_id
  )
  SELECT
    pt.diagnosis,
    ROUND(AVG(pt.age), 1)                 AS avg_age,
    SUM(COALESCE(a.admission_count, 0))   AS total_admissions
  FROM PatientTreatments pt
  LEFT JOIN AdmissionsStats a
    ON pt.patient_id = a.patient_id
  GROUP BY pt.diagnosis
  ORDER BY total_admissions DESC;
instructions: Summarize patient admissions, treatments, and outcomes
hints:
  - Review all SQL concepts in the GuideBook
  - Use multiple CTEs for clarity
  - Join patients, treatments, and admissions
  - Group by diagnosis
thoughtProcess:
  - "Capstone: combine patients, treatments, and admissions into one report by diagnosis. Break into sub-problems — each CTE handles one join."
  - "CTE 1 — PatientTreatments: JOIN patients with treatments on patient_id. This gives you age + diagnosis per patient."
  - "CTE 2 — AdmissionsStats: COUNT admissions per patient_id from the admissions table. This gives admission frequency per patient."
  - "Main query: combine the CTEs to show diagnosis-level stats — count of patients, average age, total admissions per diagnosis."
  - "ORDER BY a meaningful metric (e.g., admission count or patient count) to highlight the most impactful diagnoses first."
  - "Capstone approach: identify the tables you need → build one CTE per table relationship → join CTEs in the final SELECT. Each CTE should be testable on its own."
