id: patient_select
name: Patient Overview
tier: 1
domain: Healthcare Covid
description: Retrieve recent elderly patients
skills:
  - select
  - filter
datasets:
  - name: healthcare_covid
    file: healthcare_covid.csv
  - name: patients
    file: patients.csv
  - name: treatments
    file: treatments.csv
  - name: admissions
    file: admissions.csv
prereq_cases: []
seedQuery: |-
  -- TODO: write query for patient_select
  SELECT 1;
solutionQuery: |-
  SELECT patient_id, age, birthdate
  FROM patients
  WHERE age > 50
  ORDER BY birthdate DESC
  LIMIT 5;
instructions: Select top 5 patients over 50, ordered by admission date
hints:
  - Review the select concept in the GuideBook
  - Use WHERE to filter age
  - Use ORDER BY to sort by admission_date
  - Use LIMIT to get 5 rows
thoughtProcess:
  - "Read the goal: 'top 5 patients over 50, ordered by birthdate'. Identify — columns to show, filter condition, sort order, row limit."
  - "SELECT patient_id, age, birthdate — the columns the output needs. FROM patients is the data source."
  - "WHERE age > 50 — filters to patients older than 50. Numeric comparison, no quotes."
  - "ORDER BY birthdate DESC — most recent birthdates first. LIMIT 5 — cap at 5 rows."
  - "This is the foundational query pattern: SELECT → FROM → WHERE → ORDER BY → LIMIT. Every SQL query you write builds on this structure."
