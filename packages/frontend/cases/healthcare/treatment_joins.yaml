id: treatment_joins
name: Patient Treatments
tier: 3
domain: Healthcare Covid
description: Join patient and treatment data
skills:
  - join
datasets:
  - name: healthcare_covid
    file: healthcare_covid.csv
  - name: patients
    file: patients.csv
  - name: treatments
    file: treatments.csv
  - name: admissions
    file: admissions.csv
prereq_cases:
  - patient_select
  - diagnosis_count
seedQuery: |-
  -- TODO: write query for treatment_joins
  SELECT 1;
solutionQuery: |-
  SELECT
    p.patient_id,
    p.age,
    t.diagnosis,
    strftime('%Y-%m-%d', t.treatment_date) AS treatment_date
  FROM patients p
  JOIN treatments t
    ON p.patient_id = t.patient_id
  WHERE t.diagnosis IS NOT NULL
    AND t.treatment_date >= '2020-04-01'
  ORDER BY t.treatment_date
  LIMIT 100;
instructions: Join patients to treatments on the patient_id column, keeping only non-null diagnoses from 2020-04-01 onward. 
    Then sort by treatment_date and return the first 100 rows.
hints:
  - Review the join concept in the GuideBook
  - Use JOIN to combine patients and treatments on patient_id
  - Filter with WHERE for non-null diagnoses and treatment dates after 2020-04-01
  - Use ORDER BY to sort by treatment_date and LIMIT for the first 100 records
thoughtProcess:
  - "You need patient info (age) AND treatment info (diagnosis, date) together. They live in separate tables linked by patient_id — so you need a JOIN."
  - "JOIN treatments t ON p.patient_id = t.patient_id — INNER JOIN keeps only patients who have treatments. Use aliases p and t for clarity."
  - "WHERE t.diagnosis IS NOT NULL AND t.treatment_date >= '2020-04-01' — two filters combined with AND. Date comparisons use string format 'YYYY-MM-DD'."
  - "strftime('%Y-%m-%d', t.treatment_date) AS treatment_date — formats the date cleanly. Use strftime when you want consistent date output."
  - "ORDER BY t.treatment_date LIMIT 100 — chronological order, capped at 100 rows. The JOIN pattern: FROM table1 alias JOIN table2 alias ON key = key WHERE filters."
