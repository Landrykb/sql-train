      - name: population
        type: INTEGER
  - name: patients
    columns:
      - name: patient_id
        type: TEXT
      - name: age
        type: INTEGER
      - name: gender
        type: TEXT
      - name: birthdate
        type: DATE
  - name: treatments
    columns:
      - name: treatment_id
        type: TEXT
      - name: patient_id
        type: TEXT
      - name: diagnosis
        type: TEXT
      - name: treatment_date
        type: DATE
  - name: admissions
    columns:
      - name: admission_id
        type: TEXT
      - name: patient_id
        type: TEXT
      - name: admission_date
        type: DATE
      - name: discharge_date
        type: DATE
