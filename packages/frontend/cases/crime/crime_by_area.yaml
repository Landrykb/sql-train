id: crime_by_area
name: Crime Types by Location
tier: 2
domain: Crime Chicago
description: Summarize crime types by location
skills:
  - aggregation
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
seedQuery: |-
  -- TODO: write query for crime_by_area
  SELECT 1;
solutionQuery: |-
  SELECT primary_type, COUNT(*) as crime_count
  FROM crime_chicago
  GROUP BY primary_type
  ORDER BY crime_count DESC
  LIMIT 10;
instructions: Count crimes by primary_type, order by count
hints:
  - Review aggregation in the GuideBook
  - Use GROUP BY for primary_type
  - Use COUNT for crime counts
  - Order by count
thoughtProcess:
  - "The goal is 'count crimes by type'. Whenever you see 'count by' or 'total per', that's aggregation with GROUP BY."
  - "COUNT(*) counts all rows in each group. Pair it with GROUP BY primary_type to get one count per crime type."
  - "Give the count a name: COUNT(*) AS crime_count. This alias lets you reference it in ORDER BY."
  - "ORDER BY crime_count DESC shows the most frequent crime types first. LIMIT 10 keeps just the top 10."
  - "Rule: every column in SELECT that isn't inside an aggregate function (COUNT, SUM, AVG, etc.) MUST appear in GROUP BY. Here, primary_type is in SELECT and GROUP BY — that's correct."
schema:
  - name: crime_chicago
    columns:
      - name: id
        type: TEXT
      - name: date
        type: DATE
      - name: primary_type
        type: TEXT
      - name: location_description
        type: TEXT
      - name: latitude
        type: FLOAT
      - name: longitude
        type: FLOAT
  - name: suspects
    columns:
      - name: suspect_id
        type: TEXT
      - name: crime_id
        type: TEXT
      - name: suspect_name
        type: TEXT
expected:
  - crime_count: 100216
    primary_type: ASSAULT
  - crime_count: 100085
    primary_type: THEFT
  - crime_count: 100068
    primary_type: BATTERY
  - crime_count: 99945
    primary_type: ROBBERY
  - crime_count: 99686
    primary_type: NARCOTICS
type: standard
tags:
  - crime_chicago
  - aggregation
category: Crime Chicago
