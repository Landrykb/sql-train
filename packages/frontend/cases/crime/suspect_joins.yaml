id: suspect_joins
name: Crime Suspects
tier: 3
domain: Crime Chicago
description: Join crime and suspect data
skills:
  - join
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
  - crime_by_area
seedQuery: |-
  -- TODO: write query for suspect_joins
  SELECT 1;
solutionQuery: |-
  SELECT c.id, c.date, s.suspect_name
  FROM crime_chicago c
  LEFT JOIN suspects s ON c.id = s.crime_id
  WHERE s.suspect_name IS NOT NULL
  ORDER BY c.date DESC
  LIMIT 5;
instructions: Join crime and suspect data, show incidents with suspects, order by
  date
hints:
  - Review the join concept in the GuideBook
  - Use LEFT JOIN to include suspect data
  - Filter with WHERE for non-null suspects
  - Use LIMIT to get 5 rows
thoughtProcess:
  - "You need crime details AND suspect names together. Data lives in two tables — crime_chicago and suspects — so you need a JOIN."
  - "Find the linking column: crime_chicago has id, suspects has crime_id. These represent the same crime. JOIN ON c.id = s.crime_id."
  - "LEFT JOIN keeps all crime rows even if no suspect exists. Then WHERE s.suspect_name IS NOT NULL filters to only crimes that have a known suspect."
  - "Use aliases: c for crime_chicago, s for suspects. SELECT c.id, c.date, s.suspect_name — pick columns from both tables using their alias prefix."
  - "ORDER BY c.date DESC LIMIT 5 — most recent incidents with suspects first. This is the same SELECT → FROM → JOIN → WHERE → ORDER → LIMIT pattern from earlier, just with a JOIN added."
schema:
  - name: crime_chicago
    columns:
      - name: id
        type: TEXT
      - name: date
        type: DATE
      - name: primary_type
        type: TEXT
      - name: location_description
        type: TEXT
      - name: latitude
        type: FLOAT
      - name: longitude
        type: FLOAT
  - name: suspects
    columns:
      - name: suspect_id
        type: TEXT
      - name: crime_id
        type: TEXT
      - name: suspect_name
        type: TEXT
