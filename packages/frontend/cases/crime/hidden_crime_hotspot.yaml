id: hidden_crime_hotspot
name: "Predict Crime Hotspots for Patrol Deployment"
tier: 6
domain: Crime Chicago
description: The police chief needs data-driven patrol deployment — identify the highest-crime areas, peak times, and arrest rates to optimize officer scheduling.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - window
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
  - crime_by_area
  - suspect_joins
  - crime_trend
  - cte_crime
  - capstone_crime
seedQuery: |-
  -- SCENARIO: The Police Chief asks:
  -- "Where should we deploy extra patrols?
  --  Show me the top crime hotspots with their
  --  arrest rates so we can prioritize areas
  --  that need the most attention."
  SELECT 1;
solutionQuery: |-
  WITH AreaStats AS (
    SELECT
      c.location_description,
      COUNT(*) AS total_crimes,
      COUNT(DISTINCT s.suspect_id) AS total_suspects,
      ROUND(100.0 * COUNT(DISTINCT s.suspect_id) / COUNT(*), 2) AS suspect_rate
    FROM crime_chicago c
    LEFT JOIN suspects s ON c.id = s.crime_id
    GROUP BY c.location_description
  )
  SELECT
    location_description,
    total_crimes,
    total_suspects,
    suspect_rate,
    CASE
      WHEN total_crimes > 200 AND suspect_rate < 30 THEN 'Critical — Deploy Now'
      WHEN total_crimes > 100 THEN 'High Priority'
      WHEN total_crimes > 50 THEN 'Monitor'
      ELSE 'Low Risk'
    END AS deployment_priority,
    RANK() OVER (ORDER BY total_crimes DESC) AS crime_rank
  FROM AreaStats
  ORDER BY total_crimes DESC
  LIMIT 10;
instructions: |-
  The Police Chief wants to know where to deploy extra patrols.

  1. JOIN crime_chicago with suspects to get suspect identification rate per location
  2. Calculate per location_description: total_crimes, total_suspects, suspect_rate (%)
  3. Classify each location with a deployment_priority:
     - Critical: > 200 crimes AND suspect_rate < 30%
     - High Priority: > 100 crimes
     - Monitor: > 50 crimes
     - Low Risk: everything else
  4. Rank by total_crimes descending and show top 10
hints:
  - LEFT JOIN suspects to count identified suspects per crime location
  - "suspect_rate: 100.0 * COUNT(DISTINCT suspect_id) / COUNT(*)"
  - Use RANK() OVER for ranking
  - LIMIT 10 for top locations
thoughtProcess:
  - "The Police Chief wants patrol deployment priorities. Translate to SQL: count crimes per area, compute arrest rates, classify priority, and rank."
  - "CTE — AreaStats: LEFT JOIN crime_chicago with suspects ON id = crime_id. GROUP BY location_description. COUNT(*) for total_crimes, COUNT(DISTINCT suspect_id) for identified suspects."
  - "Suspect rate = suspects / total crimes × 100. Write: ROUND(100.0 * COUNT(DISTINCT s.suspect_id) / COUNT(*), 2). The 100.0 forces decimal division."
  - "Main query uses CASE for deployment_priority: strictest first (Critical = high crime AND low arrest rate), then High Priority, Monitor, Low Risk. This mirrors how police chiefs actually prioritize."
  - "RANK() OVER (ORDER BY total_crimes DESC) assigns rank 1 to the highest-crime area. RANK allows ties (two areas with same count get same rank). Compare: ROW_NUMBER never ties."
  - "LIMIT 10 gives the top 10 areas. The pattern: CTE for metrics → CASE for classification → RANK for ordering → LIMIT for focus. Real-world analysts use this exact pattern for priority dashboards."
