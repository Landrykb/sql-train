id: hidden_crime_hotspot
name: "Predict Crime Hotspots for Patrol Deployment"
tier: 6
domain: Crime Chicago
description: The police chief needs data-driven patrol deployment — identify the highest-crime areas, peak times, and arrest rates to optimize officer scheduling.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - window
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
  - crime_by_area
  - suspect_joins
  - crime_trend
  - cte_crime
  - capstone_crime
seedQuery: |-
  -- SCENARIO: The Police Chief asks:
  -- "Where should we deploy extra patrols?
  --  Show me the top crime hotspots with their
  --  arrest rates so we can prioritize areas
  --  that need the most attention."
  SELECT 1;
solutionQuery: |-
  WITH AreaStats AS (
    SELECT
      area_name,
      COUNT(*) AS total_crimes,
      SUM(CASE WHEN arrest = 'true' THEN 1 ELSE 0 END) AS total_arrests,
      ROUND(100.0 * SUM(CASE WHEN arrest = 'true' THEN 1 ELSE 0 END) / COUNT(*), 2) AS arrest_rate
    FROM crime_chicago
    GROUP BY area_name
  )
  SELECT
    area_name,
    total_crimes,
    total_arrests,
    arrest_rate,
    CASE
      WHEN total_crimes > 500 AND arrest_rate < 20 THEN 'Critical — Deploy Now'
      WHEN total_crimes > 300 THEN 'High Priority'
      WHEN total_crimes > 100 THEN 'Monitor'
      ELSE 'Low Risk'
    END AS deployment_priority,
    RANK() OVER (ORDER BY total_crimes DESC) AS crime_rank
  FROM AreaStats
  ORDER BY total_crimes DESC
  LIMIT 10;
instructions: |-
  The Police Chief wants to know where to deploy extra patrols.

  1. Calculate per-area: total_crimes, total_arrests, arrest_rate (percentage)
  2. Classify each area with a deployment_priority:
     - Critical: > 500 crimes AND arrest_rate < 20%
     - High Priority: > 300 crimes
     - Monitor: > 100 crimes
     - Low Risk: everything else
  3. Rank by total_crimes descending and show top 10
hints:
  - Use SUM(CASE WHEN arrest = 'true' THEN 1 ELSE 0 END) for arrest counts
  - Divide arrests by total to get arrest_rate
  - Use RANK() OVER for ranking
  - LIMIT 10 for top areas
thoughtProcess:
  - "The Police Chief wants patrol deployment priorities. Translate to SQL: count crimes per area, compute arrest rates, classify priority, and rank."
  - "CTE — AreaStats: GROUP BY area_name. Use COUNT(*) for total_crimes. For arrests, use SUM(CASE WHEN arrest = 'true' THEN 1 ELSE 0 END) — this conditional sum counts only rows where an arrest was made."
  - "Arrest rate = arrests / total crimes × 100. Write: ROUND(100.0 * SUM(CASE...) / COUNT(*), 2) AS arrest_rate. The 100.0 (not 100) forces decimal division — integer division would truncate."
  - "Main query uses CASE for deployment_priority: strictest first (Critical = high crime AND low arrest rate), then High Priority, Monitor, Low Risk. This mirrors how police chiefs actually prioritize."
  - "RANK() OVER (ORDER BY total_crimes DESC) assigns rank 1 to the highest-crime area. RANK allows ties (two areas with same count get same rank). Compare: ROW_NUMBER never ties."
  - "LIMIT 10 gives the top 10 areas. The pattern: CTE for metrics → CASE for classification → RANK for ordering → LIMIT for focus. Real-world analysts use this exact pattern for priority dashboards."
expected:
