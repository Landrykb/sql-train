id: capstone_crime
name: Crime Capstone
tier: 5
domain: Crime Chicago
description: Build a comprehensive crime dashboard
skills:
  - ctes
  - joins
  - aggregation
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
  - crime_by_area
  - suspect_joins
  - crime_trend
  - cte_crime
seedQuery: |-
  -- TODO: write query for capstone_crime
  SELECT 1;
solutionQuery: |-
  WITH CrimeStats AS (
   SELECT primary_type, location_description, COUNT(*) AS crime_count
   FROM crime_chicago
   GROUP BY primary_type, location_description
  ),
  SuspectStats AS (
   SELECT c.location_description, COUNT(s.suspect_name) AS suspect_count
   FROM crime_chicago c
   LEFT JOIN suspects s ON c.id = s.crime_id
   GROUP BY c.location_description
  )
  SELECT cs.primary_type, cs.location_description, cs.crime_count, s.suspect_count
  FROM CrimeStats cs
  JOIN SuspectStats s ON cs.location_description = s.location_description
  ORDER BY cs.crime_count DESC;
instructions: Summarize crimes, suspects, and trends by location and type
hints:
  - Review all SQL concepts in the GuideBook
  - Use multiple CTEs for clarity
  - Join crimes and suspects
  - Group by location and type
