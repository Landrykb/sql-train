id: crime_trend
name: Crime Trends
tier: 3
domain: Crime Chicago
description: Analyze weekly crime trends
skills:
  - aggregation
  - date_functions
datasets:
  - name: crime_chicago
    file: crime_chicago.csv
  - name: suspects
    file: suspects.csv
prereq_cases:
  - crime_select
  - crime_by_area
seedQuery: |-
  -- TODO: write query for crime_trend
  SELECT 1;
solutionQuery: |-
  SELECT strftime('%Y-%W', date) AS week, primary_type, COUNT(*) AS crime_count
  FROM crime_chicago
  GROUP BY strftime('%Y-%W', date), primary_type
  ORDER BY week, crime_count DESC
  LIMIT 20;
instructions: Count weekly crimes by primary_type, order by week
hints:
  - Review date functions in the GuideBook
  - Use strftime to group by week
  - Use COUNT for crime counts
  - Order by week
schema:
  - name: crime_chicago
    columns:
      - name: id
        type: TEXT
      - name: date
        type: DATE
      - name: primary_type
        type: TEXT
      - name: location_description
        type: TEXT
      - name: latitude
        type: FLOAT
      - name: longitude
        type: FLOAT
  - name: suspects
    columns:
      - name: suspect_id
        type: TEXT
      - name: crime_id
        type: TEXT
      - name: suspect_name
        type: TEXT
