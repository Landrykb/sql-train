id: trial_between
name: "Trial 15: BETWEEN Ranges"
tier: 2
domain: trials
description: "Filter data within a range using BETWEEN — a classic interview question."
instructions: |-
  *bleep* Range filtering, human.
  Using the patients dataset, find all patients whose age is BETWEEN 30 AND 50 (inclusive).
  Show patient_id, age, gender, birthdate.
  Order by age descending, then patient_id ascending.
  LIMIT 15.
skills:
  - select
  - where
  - between
  - order
  - limit
datasets:
  - name: patients
    file: patients.csv
prereq_cases: []
seedQuery: |-
  -- Find patients aged 30-50
  SELECT 1;
solutionQuery: |-
  SELECT patient_id, age, gender, birthdate
  FROM patients
  WHERE age BETWEEN 30 AND 50
  ORDER BY age DESC, patient_id ASC
  LIMIT 15;
hints:
  - "BETWEEN 30 AND 50 includes both endpoints (30 and 50)"
  - "You can ORDER BY multiple columns separated by commas"
  - "DESC for age (oldest first), ASC for patient_id (tiebreaker)"
thoughtProcess:
  - "BETWEEN is inclusive on both ends — equivalent to age >= 30 AND age <= 50."
  - "ORDER BY age DESC puts oldest patients first. patient_id ASC breaks ties deterministically."
  - "LIMIT 15 caps the output."
