id: trial_lag_lead
name: "Trial 37: LAG & LEAD"
tier: 3
domain: trials
description: "Compare rows to their neighbors using LAG/LEAD window functions — a key analytics skill."
instructions: |-
  *bleep* Time-series comparison, human.
  Using the market_index dataset, for each date show:
  - date
  - index_close (rounded to 2)
  - prev_close: the previous day's index_close using LAG (rounded to 2)
  - daily_change: index_close - prev_close (rounded to 2)
  Filter out rows where prev_close IS NULL (first row).
  Order by daily_change ASC (worst days first), LIMIT 10.
skills:
  - select
  - window
  - lag
  - order
  - limit
datasets:
  - name: market_index
    file: market_index.csv
prereq_cases: []
seedQuery: |-
  -- Day-over-day market index change
  SELECT 1;
solutionQuery: |-
  WITH DailyChange AS (
    SELECT
      date,
      ROUND(index_close, 2) AS index_close,
      ROUND(LAG(index_close) OVER (ORDER BY date), 2) AS prev_close
    FROM market_index
  )
  SELECT
    date,
    index_close,
    prev_close,
    ROUND(index_close - prev_close, 2) AS daily_change
  FROM DailyChange
  WHERE prev_close IS NOT NULL
  ORDER BY daily_change ASC
  LIMIT 10;
hints:
  - "LAG(column) OVER (ORDER BY date) gets the previous row's value"
  - "Window functions can't be filtered in the same SELECT — use a CTE"
  - "The first row has no previous value, so LAG returns NULL"
thoughtProcess:
  - "LAG(index_close) OVER (ORDER BY date) looks at the previous row when sorted by date."
  - "Window functions produce NULLs for the first row (no previous). Filter with WHERE in the outer query."
  - "CTE pattern: compute window function in CTE, filter on it in outer query. This is required because WHERE can't reference window functions directly."
  - "ORDER BY daily_change ASC shows the biggest market drops first."
