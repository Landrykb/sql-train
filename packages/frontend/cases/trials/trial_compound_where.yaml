id: trial_compound_where
name: "Trial 41: Compound WHERE Clauses"
tier: 2
domain: trials
description: "Combine multiple conditions with AND, OR, and parentheses — fundamental for precise filtering."
instructions: |-
  *bleep* Logical precision, human.
  Using the business_retail dataset, find all transactions where:
  - branch is 'A' AND (payment is 'Ewallet' OR payment is 'Credit card')
  - AND total > 200
  Show invoice_id, branch, payment, product_line, total, rating.
  Order by total descending, LIMIT 10.
skills:
  - select
  - where
  - and
  - or
  - order
  - limit
datasets:
  - name: business_retail
    file: business_retail.csv
prereq_cases: []
seedQuery: |-
  -- Complex WHERE with AND and OR
  SELECT 1;
solutionQuery: |-
  SELECT invoice_id, branch, payment, product_line, total, rating
  FROM business_retail
  WHERE branch = 'A'
    AND (payment = 'Ewallet' OR payment = 'Credit card')
    AND total > 200
  ORDER BY total DESC
  LIMIT 10;
hints:
  - "Use parentheses around the OR condition to group it correctly"
  - "Without parentheses, AND binds tighter than OR — results would be wrong"
  - "AND + OR + parentheses = precise filtering"
thoughtProcess:
  - "AND has higher precedence than OR. Without parentheses, 'A AND B OR C' means '(A AND B) OR C' — not what we want."
  - "Parentheses force the OR to be evaluated first: branch = 'A' AND (Ewallet OR Credit card) AND total > 200."
  - "This is a classic interview pitfall — always use parentheses when mixing AND and OR."
