id: trial_dense_rank
name: "Trial: DENSE_RANK vs RANK"
tier: 4
domain: trials
description: "Understand the difference between RANK, DENSE_RANK, and ROW_NUMBER — a classic interview distinction."
instructions: |-
  *bleep* Ranking nuances, human.
  Using the nba_games dataset, rank players by their total points scored.
  Show player_id, SUM(points) AS total_points,
  RANK() as rank_pos, DENSE_RANK() as dense_rank_pos, ROW_NUMBER() as row_num.
  All three should be ordered by total_points descending.
  Order by total_points descending, LIMIT 15.
skills:
  - select
  - group
  - window
  - rank
  - order
  - limit
datasets:
  - name: nba_games
    file: nba_games.csv
prereq_cases:
  - trial_window
seedQuery: |-
  -- Compare RANK, DENSE_RANK, ROW_NUMBER
  SELECT 1;
solutionQuery: |-
  SELECT
    player_id,
    SUM(points) AS total_points,
    RANK() OVER (ORDER BY SUM(points) DESC) AS rank_pos,
    DENSE_RANK() OVER (ORDER BY SUM(points) DESC) AS dense_rank_pos,
    ROW_NUMBER() OVER (ORDER BY SUM(points) DESC) AS row_num
  FROM nba_games
  GROUP BY player_id
  ORDER BY total_points DESC
  LIMIT 15;
hints:
  - "RANK() skips numbers after ties (1,1,3). DENSE_RANK() doesn't (1,1,2)"
  - "ROW_NUMBER() never ties — each row gets a unique number"
  - "You can use aggregate expressions inside OVER (ORDER BY ...)"
thoughtProcess:
  - "RANK: ties get same rank, next rank skips. E.g., two players tied at 1st → next is 3rd."
  - "DENSE_RANK: ties get same rank, next rank is consecutive. E.g., two at 1st → next is 2nd."
  - "ROW_NUMBER: no ties ever. Arbitrary tiebreaking. Every row gets a unique number."
  - "Interviewers love asking this distinction. Seeing all three side-by-side makes it crystal clear."
