id: trial_not_in
name: "Trial 36: NOT IN Exclusion"
tier: 2
domain: trials
description: "Exclude rows matching a list using NOT IN — the inverse of IN filtering."
instructions: |-
  *bleep* Exclusion filtering, human.
  Using the business_retail dataset, find all transactions where the payment method
  is NOT IN ('Cash', 'Credit card').
  Show invoice_id, product_line, payment, total.
  Order by total descending, LIMIT 10.
skills:
  - select
  - where
  - not_in
  - order
  - limit
datasets:
  - name: business_retail
    file: business_retail.csv
prereq_cases: []
seedQuery: |-
  -- Find non-cash, non-credit-card transactions
  SELECT 1;
solutionQuery: |-
  SELECT invoice_id, product_line, payment, total
  FROM business_retail
  WHERE payment NOT IN ('Cash', 'Credit card')
  ORDER BY total DESC
  LIMIT 10;
hints:
  - "NOT IN excludes rows matching any value in the list"
  - "It's the opposite of IN — same syntax, just add NOT"
  - "Be careful: NOT IN with NULLs in the list can give unexpected results"
thoughtProcess:
  - "NOT IN ('Cash', 'Credit card') keeps only rows where payment is neither Cash nor Credit card."
  - "This is equivalent to: WHERE payment != 'Cash' AND payment != 'Credit card'."
  - "Important gotcha: if the list contains NULL, NOT IN returns no rows. Always exclude NULLs from NOT IN lists."
