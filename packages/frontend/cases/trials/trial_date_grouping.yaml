id: trial_date_grouping
name: "Trial 9: Temporal Analysis"
tier: 3
domain: trials
description: "Cross-domain date trial — group and analyze data by time periods under pressure."
instructions: |-
  *bleep* Trial 9, human. Time-based analysis.
  Using the finance_stocks dataset, find the average closing price and total volume
  per date. Show date, avg_close (rounded to 2), and total_volume.
  Only include dates where total_volume exceeds 500,000,000.
  Order by total_volume descending, LIMIT 10.
skills:
  - select
  - group
  - avg
  - sum
  - having
  - order
  - limit
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
prereq_cases: []
  - trial_aggregation
seedQuery: |-
  -- TRIAL 9: Temporal Analysis
  -- Find high-volume trading dates
  SELECT 1;
solutionQuery: |-
  SELECT date,
         ROUND(AVG(close), 2) AS avg_close,
         SUM(volume) AS total_volume
  FROM finance_stocks
  GROUP BY date
  HAVING total_volume > 500000000
  ORDER BY total_volume DESC
  LIMIT 10;
hints:
  - "GROUP BY date to aggregate per trading day"
  - "Use HAVING (not WHERE) to filter on aggregated values"
  - "SUM(volume) gives total market volume per date"
thoughtProcess:
  - "You need per-date aggregates — GROUP BY date."
  - "AVG(close) and SUM(volume) compute the daily averages and totals."
  - "HAVING filters AFTER grouping. WHERE filters BEFORE. Since total_volume is an aggregate, use HAVING."
  - "ORDER BY total_volume DESC LIMIT 10 shows the busiest trading days."
