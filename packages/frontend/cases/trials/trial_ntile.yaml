id: trial_ntile
name: "Trial: NTILE Buckets"
tier: 3
domain: trials
description: "Divide rows into equal buckets using NTILE — perfect for percentile and quartile analysis."
instructions: |-
  *bleep* Bucketing data, human.
  Using the nba_games dataset, divide all player performances into 4 quartiles by points scored.
  Show player_id, points, game_date, and NTILE(4) OVER (ORDER BY points DESC) AS quartile.
  Quartile 1 = top 25%, quartile 4 = bottom 25%.
  Order by points descending, LIMIT 15.
skills:
  - select
  - window
  - ntile
  - order
  - limit
datasets:
  - name: nba_games
    file: nba_games.csv
prereq_cases: []
  - trial_window
seedQuery: |-
  -- Divide players into scoring quartiles
  SELECT 1;
solutionQuery: |-
  SELECT
    player_id,
    points,
    game_date,
    NTILE(4) OVER (ORDER BY points DESC) AS quartile
  FROM nba_games
  ORDER BY points DESC
  LIMIT 15;
hints:
  - "NTILE(4) divides rows into 4 roughly equal groups"
  - "NTILE(4) OVER (ORDER BY points DESC) means group 1 = highest scorers"
  - "NTILE is useful for percentile analysis — NTILE(100) gives percentiles"
thoughtProcess:
  - "NTILE(N) splits the result set into N approximately equal groups, numbered 1 through N."
  - "With ORDER BY points DESC, group 1 contains the top 25% of scorers."
  - "NTILE handles uneven splits automatically — if 100 rows / 4 groups = 25 each."
  - "Real-world use: customer segmentation, performance tiers, percentile rankings."
