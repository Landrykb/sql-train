id: trial_running_total
name: "Trial 38: Running Totals"
tier: 3
domain: trials
description: "Calculate cumulative sums with window functions — essential for dashboards and reports."
instructions: |-
  *bleep* Cumulative analysis, human.
  Using the business_retail dataset, calculate a running total of revenue ordered by date.
  Show date, daily_revenue (SUM of total per date, rounded to 2),
  and running_total (cumulative SUM of daily_revenue, rounded to 2).
  Order by date ascending, LIMIT 15.
skills:
  - select
  - group
  - cte
  - window
  - sum
  - order
  - limit
datasets:
  - name: business_retail
    file: business_retail.csv
prereq_cases: []
seedQuery: |-
  -- Running total of daily revenue
  SELECT 1;
solutionQuery: |-
  WITH DailyRevenue AS (
    SELECT date, ROUND(SUM(total), 2) AS daily_revenue
    FROM business_retail
    GROUP BY date
  )
  SELECT
    date,
    daily_revenue,
    ROUND(SUM(daily_revenue) OVER (ORDER BY date), 2) AS running_total
  FROM DailyRevenue
  ORDER BY date ASC
  LIMIT 15;
hints:
  - "First GROUP BY date to get daily totals in a CTE"
  - "SUM(...) OVER (ORDER BY date) computes a running total"
  - "Window SUM without PARTITION BY accumulates across all rows"
thoughtProcess:
  - "Step 1: CTE to compute daily_revenue = SUM(total) GROUP BY date."
  - "Step 2: SUM(daily_revenue) OVER (ORDER BY date) creates a cumulative sum — each row adds its value to all previous rows."
  - "Without PARTITION BY, the running total spans the entire dataset. With PARTITION BY, it resets per group."
  - "This running total pattern is used in financial reports, dashboards, and growth metrics."
