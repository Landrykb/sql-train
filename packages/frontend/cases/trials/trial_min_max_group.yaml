id: trial_min_max_group
name: "Trial 26: Daily Price Range"
tier: 2
domain: trials
description: "Combine MIN, MAX, and AVG in a single GROUP BY to analyze daily stock ranges."
instructions: |-
  *bleep* Market analysis, human.
  Using the finance_stocks dataset, calculate per date:
  - avg_close (AVG of close, rounded to 2)
  - highest_volume (MAX of volume)
  - lowest_volume (MIN of volume)
  - ticker_count (COUNT of DISTINCT tickers)
  Order by avg_close descending, LIMIT 10.
skills:
  - select
  - group
  - avg
  - max
  - min
  - count
  - order
  - limit
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
prereq_cases: []
seedQuery: |-
  -- Daily market summary
  SELECT 1;
solutionQuery: |-
  SELECT
    date,
    ROUND(AVG(close), 2) AS avg_close,
    MAX(volume) AS highest_volume,
    MIN(volume) AS lowest_volume,
    COUNT(DISTINCT ticker) AS ticker_count
  FROM finance_stocks
  GROUP BY date
  ORDER BY avg_close DESC
  LIMIT 10;
hints:
  - "Multiple aggregates in one SELECT — AVG, MAX, MIN, COUNT all grouped by date"
  - "COUNT(DISTINCT ticker) counts unique tickers per date"
  - "GROUP BY date gives one row per trading day"
thoughtProcess:
  - "You can use multiple aggregate functions in a single query — they all operate on the same groups."
  - "GROUP BY date means AVG, MAX, MIN, and COUNT each summarize all tickers for that date."
  - "COUNT(DISTINCT ticker) avoids double-counting if a ticker appears multiple times on one date."
