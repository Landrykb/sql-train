id: trial_date_math
name: "Trial 22: Date Arithmetic"
tier: 3
domain: trials
description: "Calculate durations between dates — essential for time-based analysis."
instructions: |-
  *bleep* Date math, human.
  Using the admissions dataset, calculate each patient's length of stay in days.
  Show admission_id, patient_id, admission_date, discharge_date,
  and length_of_stay (JULIANDAY(discharge_date) - JULIANDAY(admission_date), cast as INTEGER).
  Order by length_of_stay descending, LIMIT 10.
skills:
  - select
  - date_functions
  - order
  - limit
datasets:
  - name: admissions
    file: admissions.csv
prereq_cases: []
seedQuery: |-
  -- Calculate length of hospital stay
  SELECT 1;
solutionQuery: |-
  SELECT
    admission_id,
    patient_id,
    admission_date,
    discharge_date,
    CAST(JULIANDAY(discharge_date) - JULIANDAY(admission_date) AS INTEGER) AS length_of_stay
  FROM admissions
  ORDER BY length_of_stay DESC
  LIMIT 10;
hints:
  - "JULIANDAY() converts a date to a numeric Julian day number"
  - "Subtracting two Julian days gives the difference in days"
  - "CAST(... AS INTEGER) removes the decimal part"
thoughtProcess:
  - "SQLite doesn't have DATEDIFF — use JULIANDAY(end) - JULIANDAY(start) instead."
  - "JULIANDAY converts a date string to a floating-point day number."
  - "CAST AS INTEGER rounds down to whole days."
  - "ORDER BY length_of_stay DESC shows the longest hospital stays first."
