id: trial_top_n_group
name: "Trial: Top N Per Group"
tier: 4
domain: trials
description: "Find the top N records within each group — one of the hardest common interview patterns."
instructions: |-
  *bleep* The classic 'top N per group' problem, human.
  Using the nba_games dataset, find the highest-scoring game for each unique game_date.
  Use ROW_NUMBER() OVER (PARTITION BY game_date ORDER BY points DESC) to rank players per date.
  Then filter to only the top scorer per date (row_num = 1).
  Show game_date, player_id, points, assists, rebounds.
  Order by game_date descending, LIMIT 10.
skills:
  - select
  - cte
  - window
  - order
  - limit
datasets:
  - name: nba_games
    file: nba_games.csv
prereq_cases: []
  - trial_window
seedQuery: |-
  -- Top scorer per game date
  SELECT 1;
solutionQuery: |-
  WITH Ranked AS (
    SELECT
      game_date,
      player_id,
      points,
      assists,
      rebounds,
      ROW_NUMBER() OVER (PARTITION BY game_date ORDER BY points DESC) AS row_num
    FROM nba_games
  )
  SELECT game_date, player_id, points, assists, rebounds
  FROM Ranked
  WHERE row_num = 1
  ORDER BY game_date DESC
  LIMIT 10;
hints:
  - "ROW_NUMBER() OVER (PARTITION BY game_date ORDER BY points DESC) ranks within each date"
  - "PARTITION BY resets the numbering for each group"
  - "Filter row_num = 1 in the outer query to get only the top per group"
thoughtProcess:
  - "Top N per group requires: assign a rank within each group, then filter to rank <= N."
  - "ROW_NUMBER() OVER (PARTITION BY game_date ORDER BY points DESC) numbers rows 1, 2, 3... within each date, with highest points = 1."
  - "Window functions can't be filtered in WHERE of the same query — use a CTE, then WHERE row_num = 1."
  - "This pattern (CTE + ROW_NUMBER + PARTITION BY + filter) is the most asked advanced SQL interview question."
