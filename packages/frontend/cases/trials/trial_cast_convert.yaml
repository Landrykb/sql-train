  - { ticker: 'TICK7859', avg_volume: 99954959, peak_volume: 99954959 }
  - { ticker: 'TICK5838', avg_volume: 99939701, peak_volume: 99939701 }
  - { ticker: 'TICK7399', avg_volume: 99929724, peak_volume: 99929724 }
  - { ticker: 'TICK7659', avg_volume: 99928262, peak_volume: 99928262 }
  - { ticker: 'TICK1124', avg_volume: 99926829, peak_volume: 99926829 }
  - { ticker: 'TICK303', avg_volume: 99923550, peak_volume: 99923550 }
