id: trial_subquery
name: "Trial 8: Subquery Showdown"
tier: 3
domain: trials
description: "Cross-domain subquery trial — filter with nested queries under pressure."
instructions: |-
  *bleep* Trial 8, human. Queries inside queries.
  Using the nba_games dataset, find all players who scored above the league average points.
  Show player_id, points, assists, rebounds, and game_date.
  Order by points descending, LIMIT 10.
skills:
  - select
  - where
  - subquery
  - order
  - limit
datasets:
  - name: nba_games
    file: nba_games.csv
prereq_cases: []
  - trial_aggregation
seedQuery: |-
  -- TRIAL 8: Subquery Showdown
  -- Find players scoring above league average
  SELECT 1;
solutionQuery: |-
  SELECT player_id, points, assists, rebounds, game_date
  FROM nba_games
  WHERE points > (SELECT AVG(points) FROM nba_games)
  ORDER BY points DESC
  LIMIT 10;
hints:
  - "Use a subquery in WHERE: points > (SELECT AVG(points) FROM nba_games)"
  - "The subquery calculates the overall average independently"
  - "ORDER BY points DESC LIMIT 10 gets the top scorers above average"
thoughtProcess:
  - "You need to compare each player's points to the league average — that's a subquery in WHERE."
  - "The subquery (SELECT AVG(points) FROM nba_games) runs once and returns a single value."
  - "WHERE points > that value filters to above-average performances."
  - "ORDER BY points DESC LIMIT 10 shows the top 10 above-average scorers."
