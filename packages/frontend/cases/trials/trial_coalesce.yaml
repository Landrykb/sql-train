  - { patient_id: 'P1626', age: 112, gender: 'F', last_admission: '2023-01-14' }
  - { patient_id: 'P1877', age: 112, gender: 'F', last_admission: 'Never Admitted' }
  - { patient_id: 'P1903', age: 112, gender: 'M', last_admission: 'Never Admitted' }
