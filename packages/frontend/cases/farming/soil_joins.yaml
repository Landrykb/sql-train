id: soil_joins
name: Soil and Crop Analysis
tier: 3
domain: Farming Ndvi
description: Join crop and soil data
skills:
  - join
datasets:
  - name: farming_yield
    file: farming_yield.csv
  - name: soil_data
    file: soil_data.csv
prereq_cases:
  - ndvi_overview
  - yield_by_crop
seedQuery: |-
  -- TODO: write query for soil_joins
  SELECT 1;
solutionQuery: |-
  SELECT f.id, f.ndvi, s.soil_ph, s.soil_type
  FROM farming_yield f
  LEFT JOIN soil_data s ON f.id = s.id
  WHERE s.soil_type = 'sandy_loam'
  ORDER BY f.ndvi DESC
  LIMIT 5;
instructions: Join crop and soil data, filter for sandy_loam soil, order by NDVI
hints:
  - Review the join concept in the GuideBook
  - Use LEFT JOIN to include soil data
  - Filter with WHERE for soil_type
  - Use LIMIT to get 5 rows
thoughtProcess:
  - "You need crop data (ndvi) AND soil data (soil_ph, soil_type) together. They live in different tables — farming_yield and soil_data — so you need a JOIN."
  - "The linking column is id in both tables. LEFT JOIN soil_data s ON f.id = s.id ensures all farming rows are kept even if soil data is missing."
  - "WHERE s.soil_type = 'sandy_loam' filters to a specific soil type after the join. String values need single quotes."
  - "SELECT f.id, f.ndvi, s.soil_ph, s.soil_type — use table aliases (f, s) to specify which table each column comes from. This avoids ambiguity when both tables have columns with the same name."
  - "ORDER BY f.ndvi DESC LIMIT 5 — healthiest crops in sandy loam soil first. The JOIN pattern: FROM table1 alias1 LEFT JOIN table2 alias2 ON alias1.key = alias2.key WHERE filter."
schema:
  - name: farming_yield
    columns:
      - name: id
        type: INTEGER
      - name: region
        type: TEXT
      - name: ndvi
        type: FLOAT
      - name: yield
        type: FLOAT
      - name: year
        type: INTEGER
      - name: month
        type: INTEGER
      - name: soil_type
        type: TEXT
  - name: soil_data
    columns:
      - name: id
        type: INTEGER
      - name: soil_ph
        type: FLOAT
      - name: soil_type
        type: TEXT
