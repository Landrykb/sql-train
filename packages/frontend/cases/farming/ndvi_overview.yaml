id: ndvi_overview
name: Crop Health Overview
tier: 1
domain: Farming Ndvi
description: Retrieve top fields by yield
skills:
  - select
  - filter
datasets:
  - name: farming_yield
    file: farming_yield.csv
  - name: soil_data
    file: soil_data.csv
prereq_cases: []
seedQuery: |-
  -- TODO: write query for ndvi_overview
  SELECT 1;
solutionQuery: |-
  SELECT id, region, ndvi, yield
  FROM farming_yield
  WHERE ndvi > 0.5
  ORDER BY yield DESC
  LIMIT 5;
instructions: Select the top 5 fields with NDVI > 0.5, ordered by yield
hints:
  - Review the select concept in the GuideBook
  - Use WHERE to filter NDVI
  - Use ORDER BY to sort by yield
  - Use LIMIT to get 5 rows
schema:
  - name: farming_yield
    columns:
      - name: id
        type: INTEGER
      - name: region
        type: TEXT
      - name: ndvi
        type: FLOAT
      - name: yield
        type: FLOAT
      - name: year
        type: INTEGER
      - name: month
        type: INTEGER
      - name: soil_type
        type: TEXT
  - name: soil_data
    columns:
      - name: id
        type: INTEGER
      - name: soil_ph
        type: FLOAT
      - name: soil_type
        type: TEXT
