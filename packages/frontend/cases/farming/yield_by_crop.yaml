id: yield_by_crop
name: Yield by Soil Type
tier: 2
domain: Farming Ndvi
description: Analyze yield by soil type
skills:
  - aggregation
datasets:
  - name: farming_yield
    file: farming_yield.csv
  - name: soil_data
    file: soil_data.csv
prereq_cases:
  - ndvi_overview
seedQuery: |-
  -- TODO: write query for yield_by_crop
  SELECT 1;
solutionQuery: |-
  SELECT soil_type, AVG(yield) as avg_yield
  FROM farming_yield
  GROUP BY soil_type
  ORDER BY avg_yield DESC;
instructions: Calculate average yield by soil type, order by yield
hints:
  - Review aggregation in the GuideBook
  - Use GROUP BY for soil_type
  - Use AVG for yield
  - Order by average yield
schema:
  - name: farming_yield
    columns:
      - name: id
        type: INTEGER
      - name: region
        type: TEXT
      - name: ndvi
        type: FLOAT
      - name: yield
        type: FLOAT
      - name: year
        type: INTEGER
      - name: month
        type: INTEGER
      - name: soil_type
        type: TEXT
  - name: soil_data
    columns:
      - name: id
        type: INTEGER
      - name: soil_ph
        type: FLOAT
      - name: soil_type
        type: TEXT
expected:
  - avg_yield: 3.497059715065166
    soil_type: sandy_loam
  - avg_yield: 3.496325690770136
    soil_type: clay
  - avg_yield: 3.4956350409214916
    soil_type: peat
type: standard
tags:
  - farming_ndvi
  - aggregation
category: Farming Ndvi
