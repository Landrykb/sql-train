id: likes_trend
name: Engagement Trends
tier: 3
domain: Social Twitter
description: Analyze tweet engagement trends
skills:
  - aggregation
  - date_functions
datasets:
  - name: tweets
    file: tweets.csv
  - name: users
    file: users.csv
prereq_cases:
  - post_select
  - engagement_by_type
seedQuery: |-
  -- TODO: write query for likes_trend
  SELECT 1;
solutionQuery: |-
  SELECT strftime('%Y-%m', created_at) AS month, COUNT(*) AS tweet_count
  FROM tweets
  GROUP BY strftime('%Y-%m', created_at)
  ORDER BY month;
instructions: Count tweets by month, order by month
hints:
  - Review date functions in the GuideBook
  - Use strftime to group by month
  - Use COUNT for tweets
  - Order by month
schema:
  - name: tweets
    columns:
      - name: tweet_id
        type: TEXT
      - name: user_id
        type: TEXT
      - name: created_at
        type: DATE
      - name: text
        type: TEXT
  - name: users
    columns:
      - name: user_id
        type: TEXT
      - name: user_name
        type: TEXT
      - name: signup_date
        type: DATE
