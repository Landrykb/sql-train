id: hidden_viral_prediction
name: "Viral Content Prediction Engine"
tier: 7
domain: Social Twitter
description: "The social media team wants to predict virality. Analyze posting patterns and user activity to find which users consistently create high-engagement content and what timing works best."
hidden: true
skills:
  - select
  - join
  - group
  - window
  - cte
  - case
datasets:
  - name: tweets
    file: tweets.csv
  - name: users
    file: users.csv
prereq_cases:
  - post_select
  - engagement_by_type
  - user_joins
  - likes_trend
  - cte_engagement
  - capstone_social
  - hidden_influencer_roi
seedQuery: |-
  -- SOCIAL MEDIA STRATEGY: The Content Director asks:
  -- "Which users are our power creators? Find users who
  --  post the most, and rank them by activity. Also show
  --  how long they've been on the platform — veteran
  --  creators are our most valuable partners."
  --
  -- Build the creator analytics engine!
  SELECT 1;
solutionQuery: |-
  WITH UserMetrics AS (
    SELECT
      t.user_id,
      u.user_name,
      u.signup_date,
      t.created_at AS post_date,
      LENGTH(t.text) AS content_length,
      ROUND(JULIANDAY(t.created_at) - JULIANDAY(u.signup_date)) AS days_to_first_post
    FROM tweets t
    JOIN users u ON t.user_id = u.user_id
  ),
  Ranked AS (
    SELECT
      user_id,
      user_name,
      signup_date,
      post_date,
      content_length,
      days_to_first_post,
      RANK() OVER (ORDER BY days_to_first_post ASC) AS speed_rank,
      CASE
        WHEN days_to_first_post <= 30 THEN 'Early Adopter'
        WHEN days_to_first_post <= 90 THEN 'Quick Starter'
        WHEN days_to_first_post <= 180 THEN 'Steady User'
        ELSE 'Late Bloomer'
      END AS engagement_tier,
      CASE
        WHEN content_length >= 40 THEN 'Long Form'
        WHEN content_length >= 20 THEN 'Standard'
        ELSE 'Short Form'
      END AS content_type
    FROM UserMetrics
    WHERE days_to_first_post >= 0
  )
  SELECT
    user_id,
    user_name,
    signup_date,
    post_date,
    content_length,
    days_to_first_post,
    speed_rank,
    engagement_tier,
    content_type
  FROM Ranked
  WHERE speed_rank <= 20
  ORDER BY speed_rank;
instructions: |-
  Build a creator analytics engine:

  1. Join tweets with users to get user details
  2. Per user: calculate content_length (LENGTH of tweet text)
  3. Calculate days_to_first_post: JULIANDAY(post_date) - JULIANDAY(signup_date)
  4. Only include users where days_to_first_post >= 0
  5. Rank users by days_to_first_post ascending (fastest posters first)
  6. Classify engagement tier:
     - Early Adopter: posted within 30 days
     - Quick Starter: posted within 90 days
     - Steady User: posted within 180 days
     - Late Bloomer: everyone else
  7. Classify content type:
     - Long Form: 40+ characters
     - Standard: 20+ characters
     - Short Form: under 20 characters
  8. Show only top 20 fastest posters

  Return: user_id, user_name, signup_date, post_date, content_length, days_to_first_post, speed_rank, engagement_tier, content_type
  Order by speed_rank
hints:
  - JOIN tweets with users ON user_id
  - JULIANDAY(created_at) - JULIANDAY(signup_date) gives days between signup and first post
  - LENGTH(text) gives the character count of the tweet
  - RANK() OVER (ORDER BY days_to_first_post ASC) ranks fastest posters first
  - Use a CTE for the base metrics, then classify in a second step
  - Filter WHERE speed_rank <= 20 in the outer query (can't use window functions in WHERE of same query)
thoughtProcess:
  - "Viral prediction = identify the most engaged users. Users who post soon after signup are more likely to become power creators. Measure days_to_first_post as a proxy for engagement speed."
  - "CTE 1 — UserMetrics: JOIN tweets with users on user_id. Compute LENGTH(text) AS content_length and ROUND(JULIANDAY(created_at) - JULIANDAY(signup_date)) AS days_to_first_post."
  - "Days to first post = JULIANDAY(post_date) - JULIANDAY(signup_date). Users who post quickly after signup tend to be more engaged. JULIANDAY converts dates to numeric Julian day numbers."
  - "CTE 2 — Ranked: Add RANK() OVER (ORDER BY days_to_first_post ASC) to rank by engagement speed. Window functions compute across the full result set without GROUP BY."
  - "CASE for engagement_tier: <= 30 days = 'Early Adopter', <= 90 = 'Quick Starter'. Another CASE for content_type based on LENGTH. Multiple CASE expressions in one SELECT is a powerful classification pattern."
  - "Pattern: CTE1 for raw metrics → CTE2 for ranking + classification → outer SELECT for filtering. You can't use window function results in WHERE of the same query — that's why you need the CTE layer."
schema:
  - name: tweets
    columns:
      - { name: tweet_id, type: TEXT }
      - { name: user_id, type: TEXT }
      - { name: created_at, type: DATE }
      - { name: text, type: TEXT }
  - name: users
    columns:
      - { name: user_id, type: TEXT }
      - { name: user_name, type: TEXT }
      - { name: signup_date, type: DATE }
type: hidden
