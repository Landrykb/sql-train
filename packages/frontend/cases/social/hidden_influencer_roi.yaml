id: hidden_influencer_roi
name: "Find High-ROI Influencers for Campaign"
tier: 6
domain: Social Twitter
description: The marketing director needs to select top content creators for a campaign — find users who post the longest, most substantial content and joined earliest to identify the best partners.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - join
datasets:
  - name: tweets
    file: tweets.csv
  - name: users
    file: users.csv
prereq_cases:
  - post_select
  - engagement_by_type
  - user_joins
  - likes_trend
  - cte_engagement
  - capstone_social
seedQuery: |-
  -- SCENARIO: The Marketing Director asks:
  -- "We have budget for 10 influencer partnerships.
  --  Find users with the highest engagement rates
  --  relative to their follower count. Those are
  --  our best bang-for-buck partners."
  SELECT 1;
solutionQuery: |-
  WITH UserActivity AS (
    SELECT
      u.user_id,
      u.user_name,
      u.signup_date,
      COUNT(t.tweet_id) AS total_posts,
      ROUND(AVG(LENGTH(t.text)), 1) AS avg_content_length,
      MAX(LENGTH(t.text)) AS max_content_length,
      MIN(t.created_at) AS first_post_date
    FROM users u
    INNER JOIN tweets t ON u.user_id = t.user_id
    GROUP BY u.user_id, u.user_name, u.signup_date
  )
  SELECT
    user_name,
    total_posts,
    avg_content_length,
    max_content_length,
    signup_date,
    first_post_date,
    CAST(JULIANDAY(first_post_date) - JULIANDAY(signup_date) AS INTEGER) AS days_to_first_post,
    CASE
      WHEN avg_content_length > 30 AND JULIANDAY(first_post_date) - JULIANDAY(signup_date) < 30 THEN 'Tier 1 — Top Creator'
      WHEN avg_content_length > 20 THEN 'Tier 2 — Active Creator'
      WHEN total_posts >= 1 THEN 'Tier 3 — Casual'
      ELSE 'Skip'
    END AS campaign_tier
  FROM UserActivity
  ORDER BY avg_content_length DESC, days_to_first_post ASC
  LIMIT 15;
instructions: |-
  The marketing team needs to pick top content creators for a campaign.

  1. JOIN users with tweets on user_id
  2. Calculate per user: total_posts, avg_content_length, max_content_length, first_post_date
  3. Compute days_to_first_post = JULIANDAY(first_post_date) - JULIANDAY(signup_date)
  4. Classify campaign_tier:
     - Tier 1: avg_content_length > 30 AND days_to_first_post < 30
     - Tier 2: avg_content_length > 20
     - Tier 3: at least 1 post
     - Skip: no posts
  5. Order by avg_content_length DESC, days_to_first_post ASC, LIMIT 15
hints:
  - COUNT(tweet_id) for total posts per user
  - AVG(LENGTH(text)) for average content length
  - JULIANDAY difference for days_to_first_post
  - Use CASE for tier classification
thoughtProcess:
  - "Top creators = users who write substantial content and started posting quickly after signup. You need posting metrics per user, then classify by activity level."
  - "CTE — UserActivity: JOIN users with tweets on user_id. Compute COUNT(tweet_id) AS total_posts, AVG(LENGTH(text)) for content depth. GROUP BY user info."
  - "JULIANDAY(first_post_date) - JULIANDAY(signup_date) computes how quickly they started posting. Early adopters who write long content = best campaign partners."
  - "Use CASE to classify tiers: long content + fast posting = 'Top Creator', moderate content = 'Active Creator', any posts = 'Casual'. Strictest condition first in CASE."
  - "ORDER BY avg_content_length DESC surfaces users who write the most substantial content first."
  - "Pattern: JOIN for combined metrics → CTE for aggregation → date math → CASE classification. This is how marketing teams evaluate content creator partnerships."
