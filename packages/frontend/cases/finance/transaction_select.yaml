id: transaction_select
name: Stock Price Overview
tier: 1
domain: Finance Stocks
description: Retrieve large transactions
skills:
  - select
  - filter
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases: []
seedQuery: |-
  -- TODO: write query for transaction_select
  SELECT 1;
solutionQuery: |-
  SELECT ticker, date, close
  FROM finance_stocks
  WHERE close > 100
  ORDER BY date DESC
  LIMIT 5;
instructions: Select top 5 stock prices with close > 100, ordered by date
hints:
  - Review the select concept in the GuideBook
  - Use WHERE to filter close
  - Use ORDER BY to sort by date
  - Use LIMIT to get 5 rows
thoughtProcess:
  - "Read the goal: 'top 5 stock prices with close > 100, ordered by date'. Break it down — what columns, what filter, what order, how many rows."
  - "SELECT ticker, date, close — these are the columns relevant to the question. FROM finance_stocks is the data source."
  - "WHERE close > 100 — filters to only stocks that closed above 100. This is a numeric comparison, no quotes needed."
  - "ORDER BY date DESC — most recent prices first. LIMIT 5 — cap at 5 rows."
  - "This is the fundamental SQL pattern: SELECT → FROM → WHERE → ORDER BY → LIMIT. Every query you write builds on this skeleton."
schema:
  - name: finance_stocks
    columns:
      - name: ticker
        type: TEXT
      - name: date
        type: DATE
      - name: open
        type: FLOAT
      - name: high
        type: FLOAT
      - name: low
        type: FLOAT
      - name: close
        type: FLOAT
      - name: volume
        type: INTEGER
  - name: market_index
    columns:
      - name: date
        type: DATE
      - name: index_close
        type: FLOAT
