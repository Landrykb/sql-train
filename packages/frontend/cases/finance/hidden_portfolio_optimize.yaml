id: hidden_portfolio_optimize
name: "Risk-Adjusted Portfolio Builder"
tier: 7
domain: Finance Stocks
description: "The fund manager needs a data-driven portfolio strategy. Calculate risk-adjusted returns for each ticker using volatility and market correlation to build an optimized allocation."
hidden: true
skills:
  - select
  - join
  - group
  - window
  - cte
  - case
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
  - balance_by_account
  - fraud_joins
  - balance_trend
  - cte_fraud
  - capstone_finance
  - hidden_fraud_detection
seedQuery: |-
  -- FUND MANAGER REQUEST: The Portfolio Manager asks:
  -- "I need risk-adjusted metrics for each ticker.
  --  Calculate average daily return, volatility (stddev),
  --  and a Sharpe-like ratio. Then rank tickers by
  --  risk-adjusted performance to build our portfolio."
  --
  -- Build the portfolio optimizer!
  SELECT 1;
solutionQuery: |-
  WITH TickerMetrics AS (
    SELECT
      ticker,
      date,
      open,
      close,
      high,
      low,
      volume,
      ROUND((close - open) / open * 100, 3) AS day_return_pct,
      ROUND((high - low) / open * 100, 3) AS volatility_pct
    FROM finance_stocks
    WHERE open > 0
  ),
  Ranked AS (
    SELECT
      ticker,
      date,
      ROUND(open, 2) AS open_price,
      ROUND(close, 2) AS close_price,
      ROUND(high - low, 2) AS price_spread,
      volume,
      day_return_pct,
      volatility_pct,
      CASE
        WHEN day_return_pct > 5 THEN 'STRONG BUY'
        WHEN day_return_pct > 0 THEN 'BUY'
        WHEN day_return_pct > -5 THEN 'HOLD'
        ELSE 'SELL'
      END AS recommendation,
      ROW_NUMBER() OVER (ORDER BY day_return_pct DESC) AS performance_rank
    FROM TickerMetrics
  )
  SELECT
    ticker,
    date,
    open_price,
    close_price,
    price_spread,
    volume,
    day_return_pct,
    volatility_pct,
    recommendation,
    performance_rank
  FROM Ranked
  WHERE performance_rank <= 20
  ORDER BY performance_rank;
instructions: |-
  Build a portfolio optimization report:

  1. Calculate each ticker's intra-day return: (close - open) / open * 100
  2. Calculate volatility as the intra-day spread: (high - low) / open * 100
  3. Only include tickers where open > 0 (avoid division by zero)
  4. Classify recommendation:
     - STRONG BUY: day return > 5%
     - BUY: day return > 0%
     - HOLD: day return > -5%
     - SELL: everything else
  5. Rank by day_return_pct descending, show only top 20

  Return: ticker, date, open_price, close_price, price_spread, volume, day_return_pct, volatility_pct, recommendation, performance_rank
hints:
  - Intra-day return = (close - open) / open * 100
  - Use ROUND to clean up decimal places
  - ROW_NUMBER() OVER (ORDER BY day_return_pct DESC) for ranking
  - Filter WHERE performance_rank <= 20 in the outer query
thoughtProcess:
  - "Portfolio optimization = compare stocks by return and risk. Each row has open/close/high/low for a single trading snapshot per ticker."
  - "CTE 1 — TickerMetrics: Compute day_return_pct = (close - open) / open * 100. This shows how much each ticker gained or lost. Compute volatility_pct = (high - low) / open * 100 — wider spread means more volatile."
  - "Filter WHERE open > 0 to avoid division by zero errors. Always validate denominators in financial calculations."
  - "CTE 2 — Ranked: Add ROW_NUMBER() OVER (ORDER BY day_return_pct DESC) to rank by best performance. Use CASE for investment recommendation."
  - "Final SELECT filters WHERE performance_rank <= 20 to show only the top performers. This two-CTE pattern — compute metrics → rank + classify — is standard for financial analytics."
  - "Key takeaway: Window functions like ROW_NUMBER can't be used in WHERE of the same query. Wrap in a CTE first, then filter in the outer query."
schema:
  - name: finance_stocks
    columns:
      - { name: ticker, type: TEXT }
      - { name: date, type: DATE }
      - { name: open, type: FLOAT }
      - { name: high, type: FLOAT }
      - { name: low, type: FLOAT }
      - { name: close, type: FLOAT }
      - { name: volume, type: INTEGER }
  - name: market_index
    columns:
      - { name: date, type: DATE }
      - { name: index_close, type: FLOAT }
type: hidden
tags:
  - finance
  - real_world
  - portfolio
  - risk_analysis
category: Finance Stocks
