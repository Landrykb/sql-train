id: hidden_fraud_detection
name: "Flag Suspicious Trading Patterns"
tier: 6
domain: Finance Stocks
description: The compliance team needs you to identify potentially fraudulent trading — find accounts with unusual volume spikes that deviate from their normal pattern.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - window
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
  - balance_by_account
  - fraud_joins
  - balance_trend
  - cte_fraud
  - capstone_finance
seedQuery: |-
  -- SCENARIO: The Compliance Officer asks:
  -- "Find tickers where single-day volume exceeds
  --  3x the average daily volume. Those are our
  --  red flags for potential market manipulation."
  SELECT 1;
solutionQuery: |-
  WITH MarketAvg AS (
    SELECT
      date,
      ROUND(AVG(volume), 2) AS market_avg_volume
    FROM finance_stocks
    GROUP BY date
  )
  SELECT
    f.ticker,
    f.date,
    CAST(f.volume AS INTEGER) AS volume,
    CAST(m.market_avg_volume AS INTEGER) AS market_avg_volume,
    ROUND(f.volume / m.market_avg_volume, 2) AS volume_ratio,
    CASE
      WHEN f.volume > 3 * m.market_avg_volume THEN 'RED FLAG'
      WHEN f.volume > 2 * m.market_avg_volume THEN 'WARNING'
      ELSE 'NORMAL'
    END AS alert_level
  FROM finance_stocks f
  INNER JOIN MarketAvg m ON f.date = m.date
  WHERE f.volume > 2 * m.market_avg_volume
  ORDER BY volume_ratio DESC
  LIMIT 15;
instructions: |-
  The compliance team suspects market manipulation. They need you to:

  1. Compute market_avg_volume (AVG of volume) per date across all tickers
  2. Compare each ticker's volume to the market average for that date
  3. Flag tickers where volume > 2x market average:
     - RED FLAG: > 3x market average
     - WARNING: > 2x market average
  4. Show ticker, date, volume, market_avg_volume, volume_ratio, alert_level
  5. Order by volume_ratio DESC, LIMIT 15
hints:
  - "CTE: AVG(volume) per date for the market baseline"
  - JOIN finance_stocks with the CTE on date
  - Use CASE for alert classification
  - Filter with WHERE after the join
  - volume_ratio = volume / market_avg_volume
thoughtProcess:
  - "Fraud detection = find abnormal trading volume. Compare each ticker's volume to the market-wide average for that day. A ticker trading 3x the market average is suspicious."
  - "CTE — MarketAvg: SELECT date, AVG(volume) AS market_avg_volume FROM finance_stocks GROUP BY date. This gives the daily market baseline."
  - "Main query: JOIN finance_stocks with MarketAvg on date. Compute volume_ratio = volume / market_avg_volume. A ratio of 3 means 3x normal market volume."
  - "CASE classification: ratio > 3 = 'RED FLAG', > 2 = 'WARNING', else 'NORMAL'. Strictest condition first. This is exactly how real compliance systems flag outliers."
  - "WHERE f.volume > 2 * m.market_avg_volume filters to only suspicious trades. ORDER BY volume_ratio DESC surfaces the worst offenders."
  - "Pattern: CTE for market baseline → JOIN to compare individual vs market → CASE for alerting → WHERE to filter. Each layer is independently testable."
