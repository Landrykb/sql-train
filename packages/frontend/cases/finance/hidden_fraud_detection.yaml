id: hidden_fraud_detection
name: "Flag Suspicious Trading Patterns"
tier: 6
domain: Finance Stocks
description: The compliance team needs you to identify potentially fraudulent trading — find accounts with unusual volume spikes that deviate from their normal pattern.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - window
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
  - balance_by_account
  - fraud_joins
  - balance_trend
  - cte_fraud
  - capstone_finance
seedQuery: |-
  -- SCENARIO: The Compliance Officer asks:
  -- "Find tickers where single-day volume exceeds
  --  3x the average daily volume. Those are our
  --  red flags for potential market manipulation."
  SELECT 1;
solutionQuery: |-
  WITH DailyVolume AS (
    SELECT
      ticker,
      date,
      SUM(volume) AS daily_volume
    FROM finance_stocks
    GROUP BY ticker, date
  ),
  TickerAvg AS (
    SELECT
      ticker,
      ROUND(AVG(daily_volume), 2) AS avg_daily_volume
    FROM DailyVolume
    GROUP BY ticker
  )
  SELECT
    d.ticker,
    d.date,
    d.daily_volume,
    t.avg_daily_volume,
    ROUND(CAST(d.daily_volume AS REAL) / t.avg_daily_volume, 2) AS volume_ratio,
    CASE
      WHEN d.daily_volume > 3 * t.avg_daily_volume THEN 'RED FLAG'
      WHEN d.daily_volume > 2 * t.avg_daily_volume THEN 'WARNING'
      ELSE 'NORMAL'
    END AS alert_level
  FROM DailyVolume d
  INNER JOIN TickerAvg t ON d.ticker = t.ticker
  WHERE d.daily_volume > 2 * t.avg_daily_volume
  ORDER BY volume_ratio DESC
  LIMIT 15;
instructions: |-
  The compliance team suspects market manipulation. They need you to:

  1. Compute daily_volume (SUM of volume) per ticker per date
  2. Compute avg_daily_volume per ticker
  3. Flag days where daily_volume > 2x average:
     - RED FLAG: > 3x average
     - WARNING: > 2x average
  4. Show ticker, date, daily_volume, avg_daily_volume, volume_ratio, alert_level
  5. Order by volume_ratio DESC, LIMIT 15
hints:
  - First CTE: SUM(volume) per ticker/date
  - Second CTE: AVG(daily_volume) per ticker
  - JOIN the two CTEs on ticker
  - Use CASE for alert classification
  - Filter with WHERE after the join
thoughtProcess:
  - "Fraud detection = find abnormal trading volume. You need to compare each day's volume against the ticker's average. This requires two CTEs: one for daily totals, one for averages."
  - "CTE 1 — DailyVolume: SELECT ticker, date, SUM(volume) AS daily_volume GROUP BY ticker, date. This gives the total traded volume per ticker per day."
  - "CTE 2 — TickerAvg: SELECT ticker, ROUND(AVG(daily_volume), 2) AS avg_daily_volume FROM DailyVolume GROUP BY ticker. This computes each ticker's normal daily volume baseline."
  - "Main query: JOIN DailyVolume with TickerAvg on ticker. Compute volume_ratio = daily_volume / avg_daily_volume. A ratio of 3 means 3x normal volume."
  - "CASE classification: volume_ratio > 3 = 'RED FLAG', > 2 = 'WARNING', else 'NORMAL'. Strictest condition first. This is exactly how real fraud detection systems work."
  - "Pattern: CTE for granular metrics → CTE for baseline averages → JOIN to compare → CASE for alerting. Each layer is independently testable."
