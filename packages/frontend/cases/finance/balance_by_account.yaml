id: balance_by_account
name: Stock vs Market
tier: 2
domain: Finance Stocks
description: Join stock and market index data
skills:
  - join
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
seedQuery: |-
  -- TODO: write query for balance_by_account
  SELECT 1;
solutionQuery: |-
  SELECT s.ticker, s.date, s.close, m.index_close
  FROM finance_stocks s
  LEFT JOIN market_index m ON s.date = m.date
  WHERE m.index_close IS NOT NULL
  ORDER BY s.date DESC
  LIMIT 5;
instructions: Join stock and market index, show stocks with index values, order by
  date
hints:
  - Review the join concept in the GuideBook
  - Use LEFT JOIN to include market data
  - Filter with WHERE for non-null index values
  - Use LIMIT to get 5 rows
thoughtProcess:
  - "You need stock prices AND market index values together. They're in two tables — finance_stocks and market_index — so you need a JOIN."
  - "What connects them? Both have a date column. JOIN ON s.date = m.date matches each stock's daily price with the market index for that same day."
  - "LEFT JOIN keeps all stock rows even if the market index is missing for that date. Then WHERE m.index_close IS NOT NULL filters to only days with market data available."
  - "SELECT s.ticker, s.date, s.close, m.index_close — use aliases (s, m) to clearly specify which table each column belongs to."
  - "ORDER BY s.date DESC LIMIT 5 — most recent data first. This is the standard JOIN pattern for combining related datasets on a shared key."
schema:
  - name: finance_stocks
    columns:
      - name: ticker
        type: TEXT
      - name: date
        type: DATE
      - name: open
        type: FLOAT
      - name: high
        type: FLOAT
      - name: low
        type: FLOAT
      - name: close
        type: FLOAT
      - name: volume
        type: INTEGER
  - name: market_index
    columns:
      - name: date
        type: DATE
      - name: index_close
        type: FLOAT
