id: balance_trend
name: Stock Price Trends
tier: 3
domain: Finance Stocks
description: Analyze stock price trends
skills:
  - aggregation
  - date_functions
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
  - balance_by_account
seedQuery: |-
  -- TODO: write query for balance_trend
  SELECT 1;
solutionQuery: |-
  SELECT strftime('%Y-%m', date) AS month, AVG(close) AS avg_close
  FROM finance_stocks
  GROUP BY strftime('%Y-%m', date)
  ORDER BY month;
instructions: Calculate monthly average stock price, order by month
hints:
  - Review date functions in the GuideBook
  - Use strftime to group by month
  - Use AVG for closing prices
  - Order by month
schema:
  - name: finance_stocks
    columns:
      - name: ticker
        type: TEXT
      - name: date
        type: DATE
      - name: open
        type: FLOAT
      - name: high
        type: FLOAT
      - name: low
        type: FLOAT
      - name: close
        type: FLOAT
      - name: volume
        type: INTEGER
  - name: market_index
    columns:
      - name: date
        type: DATE
      - name: index_close
        type: FLOAT
