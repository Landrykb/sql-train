id: fraud_joins
name: Fraud Detection
tier: 3
domain: Finance Stocks
description: Identify suspicious stock transactions
skills:
  - joins
  - aggregation
datasets:
  - name: finance_stocks
    file: finance_stocks.csv
  - name: market_index
    file: market_index.csv
prereq_cases:
  - transaction_select
  - balance_by_account
seedQuery: |-
  -- TODO: write query for fraud_joins
  SELECT 1;
solutionQuery: |-
  SELECT s.ticker, s.date, s.close, ((s.high - s.low) / s.close) AS volatility
  FROM finance_stocks s
  LEFT JOIN market_index m ON s.date = m.date
  WHERE ((s.high - s.low) / s.close) > 0.1
  ORDER BY s.date DESC
  LIMIT 5;
instructions: |-
  Join stocks and market index, flag transactions with high volatility, order by
  date
hints:
  - Review joins in the GuideBook
  - Calculate volatility as (high - low) / close
  - Filter for high volatility
  - Order by date
thoughtProcess:
  - "The goal is finding high-volatility stocks. Volatility = (high - low) / close — the daily price range as a fraction of the closing price."
  - "You can compute expressions directly in SELECT: ((s.high - s.low) / s.close) AS volatility. SQL lets you do math on columns."
  - "LEFT JOIN market_index m ON s.date = m.date brings in market context. Even if you don't select market columns, the join is part of the exercise structure."
  - "WHERE ((s.high - s.low) / s.close) > 0.1 filters for stocks with > 10% daily volatility. Note: you must repeat the full expression in WHERE — you can't use the alias 'volatility' in WHERE."
  - "ORDER BY s.date DESC LIMIT 5 — most recent volatile days first. Key learning: computed columns (math expressions) can go in SELECT, WHERE, and ORDER BY."
schema:
  - name: finance_stocks
    columns:
      - name: ticker
        type: TEXT
      - name: date
        type: DATE
      - name: open
        type: FLOAT
      - name: high
        type: FLOAT
      - name: low
        type: FLOAT
      - name: close
        type: FLOAT
      - name: volume
        type: INTEGER
  - name: market_index
    columns:
      - name: date
        type: DATE
      - name: index_close
        type: FLOAT
