id: guide
title: SQL Query Guide
description: A comprehensive guide to SQL query types with examples and variants, applicable across all domains.
query_types:
  - name: SELECT
    description: Select specific columns from a dataset.
    variants:
      - name: Basic SELECT
        description: Select specific columns from a table.
        example_generic: |-
          SELECT col1, col2
          FROM table_main;
        example: |-
          SELECT product_line, total
          FROM business_retail;
      - name: SELECT All
        description: Select all columns using *.
        example_generic: |-
          SELECT *
          FROM table_main
          LIMIT N;
        example: |-
          SELECT *
          FROM business_retail
          LIMIT 5;
      - name: SELECT DISTINCT
        description: Select unique values.
        example_generic: |-
          SELECT DISTINCT col1
          FROM table_main;
        example: |-
          SELECT DISTINCT product_line
          FROM business_retail;
  - name: WHERE
    description: Filter rows based on conditions.
    variants:
      - name: Basic WHERE
        description: Filter rows with a single condition.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          WHERE col2 > X;
        example: |-
          SELECT product_line, total
          FROM business_retail
          WHERE total > 150;
      - name: WHERE with Operators
        description: Combine conditions with AND, OR, NOT.
        example_generic: |-
          SELECT *
          FROM table_main
          WHERE col2 > X AND col1 = 'Y';
        example: |-
          SELECT *
          FROM business_retail
          WHERE total > 100 AND product_line = 'Food and beverages';
  - name: ORDER BY
    description: Sort the result set.
    variants:
      - name: Basic ORDER BY
        description: Sort by a column in ascending or descending order.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          ORDER BY col2 DESC;
        example: |-
          SELECT product_line, total
          FROM business_retail
          ORDER BY total DESC;
      - name: Multi-Column ORDER BY
        description: Sort by multiple columns.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          ORDER BY col1 ASC, col2 DESC;
        example: |-
          SELECT product_line, total
          FROM business_retail
          ORDER BY product_line ASC, total DESC;
  - name: GROUP BY
    description: Aggregate rows into groups.
    variants:
      - name: Basic GROUP BY
        description: Group rows and apply an aggregate function.
        example_generic: |-
          SELECT col1, SUM(col2)
          FROM table_main
          GROUP BY col1;
        example: |-
          SELECT product_line, SUM(total)
          FROM business_retail
          GROUP BY product_line;
  - name: HAVING
    description: Filter groups based on aggregate conditions.
    variants:
      - name: Basic HAVING
        description: Apply conditions to grouped results.
        example_generic: |-
          SELECT col1, SUM(col2) AS sum_col2
          FROM table_main
          GROUP BY col1
          HAVING SUM(col2) > X;
        example: |-
          SELECT product_line, SUM(total) AS total_revenue
          FROM business_retail
          GROUP BY product_line
          HAVING SUM(total) > 50000;
  - name: LIMIT
    description: Restrict the number of rows returned.
    variants:
      - name: Basic LIMIT
        description: Return a fixed number of rows.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          LIMIT N;
        example: |-
          SELECT product_line, total
          FROM business_retail
          LIMIT 5;
      - name: LIMIT with OFFSET
        description: Skip rows before returning a fixed number.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          LIMIT N OFFSET M;
        example: |-
          SELECT product_line, total
          FROM business_retail
          LIMIT 5 OFFSET 10;
  - name: UNION
    description: Combine results of multiple SELECT statements.
    variants:
      - name: Basic UNION
        description: Combine unique rows from multiple queries.
        example_generic: |-
          SELECT col1 FROM table_main WHERE col2 > X
          UNION
          SELECT col1 FROM table_main WHERE col2 < Y;
        example: |-
          SELECT product_line FROM business_retail WHERE total > 200
          UNION
          SELECT product_line FROM business_retail WHERE total < 50;
      - name: UNION ALL
        description: Combine all rows, including duplicates.
        example_generic: |-
          SELECT col1 FROM table_main WHERE col2 > X
          UNION ALL
          SELECT col1 FROM table_main WHERE col2 < Y;
        example: |-
          SELECT product_line FROM business_retail WHERE total > 200
          UNION ALL
          SELECT product_line FROM business_retail WHERE total < 50;
  - name: LIKE
    description: Pattern matching for strings.
    variants:
      - name: Basic LIKE
        description: Match strings using wildcards.
        example_generic: |-
          SELECT col1
          FROM table_main
          WHERE col1 LIKE 'pattern%';
        example: |-
          SELECT product_line
          FROM business_retail
          WHERE product_line LIKE 'Food%';
  - name: BETWEEN
    description: Filter values within a range.
    variants:
      - name: Basic BETWEEN
        description: Include values between two bounds.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          WHERE col2 BETWEEN X AND Y;
        example: |-
          SELECT product_line, total
          FROM business_retail
          WHERE total BETWEEN 100 AND 200;
  - name: IN
    description: Filter rows matching a list of values.
    variants:
      - name: Basic IN
        description: Check if a column value is in a list.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          WHERE col1 IN ('A','B','C');
        example: |-
          SELECT product_line, total
          FROM business_retail
          WHERE product_line IN ('Food and beverages','Sports and travel');
  - name: IS NULL
    description: Check for NULL values.
    variants:
      - name: Basic IS NULL
        description: Filter rows where a column is NULL.
        example_generic: |-
          SELECT col1
          FROM table_main
          WHERE col2 IS NULL;
        example: |-
          SELECT product_line
          FROM business_retail
          WHERE customer_id IS NULL;
  - name: SUM
    description: Sum numeric values in each group.
    variants:
      - name: Basic SUM
        description: Calculate the total of a numeric column.
        example_generic: |-
          SELECT SUM(col2)
          FROM table_main;
        example: |-
          SELECT SUM(total)
          FROM business_retail;
  - name: COUNT
    description: Count rows or non-null values.
    variants:
      - name: Basic COUNT
        description: Count all rows.
        example_generic: |-
          SELECT COUNT(*)
          FROM table_main;
        example: |-
          SELECT COUNT(*)
          FROM business_retail;
  - name: AVG
    description: Average numeric values.
    variants:
      - name: Basic AVG
        description: Calculate the average of a numeric column.
        example_generic: |-
          SELECT AVG(col2)
          FROM table_main;
        example: |-
          SELECT AVG(total)
          FROM business_retail;
  - name: MIN / MAX
    description: Find minimum or maximum values.
    variants:
      - name: Basic MIN/MAX
        description: Retrieve the smallest or largest value.
        example_generic: |-
          SELECT MIN(col2), MAX(col2)
          FROM table_main;
        example: |-
          SELECT MIN(total), MAX(total)
          FROM business_retail;
  - name: JOIN
    description: Combine two tables row-wise based on a related column.
    variants:
      - name: INNER JOIN
        description: Returns rows where there is a match in both tables.
        example_generic: |-
          SELECT a.col1, b.col2
          FROM table_main a
          INNER JOIN ref_table b ON a.key = b.key;
        example: |-
          SELECT b.product_line, c.customer_name
          FROM business_retail b
          INNER JOIN customers c ON b.customer_id = c.customer_id;
      - name: LEFT JOIN
        description: Returns all rows from the left table, with matches or NULL.
        example_generic: |-
          SELECT a.col1, b.col2
          FROM table_main a
          LEFT JOIN ref_table b ON a.key = b.key;
        example: |-
          SELECT b.product_line, c.customer_name
          FROM business_retail b
          LEFT JOIN customers c ON b.customer_id = c.customer_id;
  - name: WINDOW FUNCTIONS
    description: Compute metrics across a moving frame.
    variants:
      - name: ROW_NUMBER
        description: Assign a unique number to each row within a partition.
        example_generic: |-
          SELECT col1, col2, ROW_NUMBER() OVER (PARTITION BY col1 ORDER BY col2 DESC)
          FROM table_main;
        example: |-
          SELECT product_line, total, ROW_NUMBER() OVER (PARTITION BY product_line ORDER BY total DESC)
          FROM business_retail;
  - name: CTE
    description: Common Table Expressions (WITH) define temporary named result sets that make complex queries readable and modular. Think of them as creating a temporary view that only exists for one query.
    variants:
      - name: Basic CTE
        description: Use WITH to create a named subquery that you can reference like a table.
        example_generic: |-
          WITH temp AS (
            SELECT col1, col2
            FROM table_main
            WHERE col2 > X
          )
          SELECT col1, SUM(col2)
          FROM temp
          GROUP BY col1;
        example: |-
          WITH high_sales AS (
            SELECT product_line, total
            FROM business_retail
            WHERE total > 150
          )
          SELECT product_line, SUM(total) AS revenue
          FROM high_sales
          GROUP BY product_line;
      - name: CTE with Aggregation
        description: Use a CTE to pre-aggregate data, then filter or rank the results in the outer query.
        example_generic: |-
          WITH grouped AS (
            SELECT col1, AVG(col2) AS avg_col2
            FROM table_main
            GROUP BY col1
          )
          SELECT col1, avg_col2
          FROM grouped
          WHERE avg_col2 > (SELECT AVG(col2) FROM table_main);
        example: |-
          WITH region_avg AS (
            SELECT region, AVG(yield) AS avg_yield
            FROM farming_yield
            GROUP BY region
          )
          SELECT region, avg_yield
          FROM region_avg
          WHERE avg_yield > (SELECT AVG(yield) FROM farming_yield)
          ORDER BY avg_yield DESC;
      - name: Multiple CTEs
        description: Chain multiple CTEs by separating them with commas. Each CTE can reference the ones defined before it.
        example_generic: |-
          WITH step1 AS (
            SELECT col1, SUM(col2) AS total
            FROM table_main
            GROUP BY col1
          ),
          step2 AS (
            SELECT col1, total,
                   RANK() OVER (ORDER BY total DESC) AS rnk
            FROM step1
          )
          SELECT * FROM step2 WHERE rnk <= 5;
        example: |-
          WITH ticker_avg AS (
            SELECT ticker, ROUND(AVG(close), 2) AS avg_close
            FROM finance_stocks
            GROUP BY ticker
          ),
          ranked AS (
            SELECT ticker, avg_close,
                   RANK() OVER (ORDER BY avg_close DESC) AS rank_pos
            FROM ticker_avg
          )
          SELECT * FROM ranked WHERE rank_pos <= 5;
      - name: CTE with JOIN
        description: Use a CTE to prepare data from one table, then JOIN it with another table in the outer query.
        example_generic: |-
          WITH summary AS (
            SELECT key, COUNT(*) AS cnt
            FROM ref_table
            GROUP BY key
          )
          SELECT a.col1, s.cnt
          FROM table_main a
          JOIN summary s ON a.key = s.key
          ORDER BY s.cnt DESC;
        example: |-
          WITH return_counts AS (
            SELECT invoice_id, COUNT(*) AS return_count
            FROM returns
            GROUP BY invoice_id
          )
          SELECT b.product_line, r.return_count
          FROM business_retail b
          JOIN return_counts r ON b.invoice_id = r.invoice_id
          ORDER BY r.return_count DESC;
  - name: SUBQUERY
    description: Nest SELECTs inside other queries.
    variants:
      - name: Basic SUBQUERY
        description: Use a subquery in the WHERE clause.
        example_generic: |-
          SELECT * FROM table_main
          WHERE col1 IN (SELECT col1 FROM ref_table WHERE condition);
        example: |-
          SELECT * FROM business_retail
          WHERE customer_id IN (SELECT customer_id FROM customers WHERE status = 'active');
  - name: CASE
    description: Apply conditional logic in SELECT.
    variants:
      - name: Basic CASE
        description: Transform values based on conditions.
        example_generic: |-
          SELECT col1,
                 CASE WHEN col2 > X THEN 'High' ELSE 'Low' END AS category
          FROM table_main;
        example: |-
          SELECT product_line,
                 CASE WHEN total > 150 THEN 'High' ELSE 'Low' END AS sale_category
          FROM business_retail;
  - name: EXISTS
    description: Test whether a subquery returns any rows.
    variants:
      - name: Basic EXISTS
        description: Filter rows based on subquery results.
        example_generic: |-
          SELECT * FROM table_main t
          WHERE EXISTS (SELECT 1 FROM ref_table r WHERE r.key = t.key);
        example: |-
          SELECT * FROM business_retail b
          WHERE EXISTS (
            SELECT 1
            FROM customers c
            WHERE c.customer_id = b.customer_id
              AND c.status = 'active'
          );
  - name: RANK / DENSE_RANK
    description: Assign ranks in windowed results.
    variants:
      - name: Basic RANK
        description: Assign ranks with gaps for ties.
        example_generic: |-
          SELECT col1, col2, RANK() OVER (ORDER BY col2 DESC)
          FROM table_main;
        example: |-
          SELECT product_line, total, RANK() OVER (ORDER BY total DESC)
          FROM business_retail;
      - name: DENSE_RANK
        description: Assign ranks without gaps for ties.
        example_generic: |-
          SELECT col1, col2, DENSE_RANK() OVER (ORDER BY col2 DESC)
          FROM table_main;
        example: |-
          SELECT product_line, total, DENSE_RANK() OVER (ORDER BY total DESC)
          FROM business_retail;
  - name: LAG / LEAD
    description: Access previous or next row in a window.
    variants:
      - name: Basic LAG
        description: Retrieve the previous row’s value.
        example_generic: |-
          SELECT col1, col2, LAG(col2) OVER (ORDER BY col2)
          FROM table_main;
        example: |-
          SELECT product_line, total, LAG(total) OVER (ORDER BY total)
          FROM business_retail;
      - name: Basic LEAD
        description: Retrieve the next row’s value.
        example_generic: |-
          SELECT col1, col2, LEAD(col2) OVER (ORDER BY col2)
          FROM table_main;
        example: |-
          SELECT product_line, total, LEAD(total) OVER (ORDER BY total)
          FROM business_retail;
  - name: QUANTILE
    description: Compute distribution quantiles (DuckDB extension).
    variants:
      - name: Basic QUANTILE
        description: Calculate a specific quantile of a column.
        example_generic: |-
          SELECT QUANTILE_CONT(col2, 0.5)
          FROM table_main;
        example: |-
          SELECT QUANTILE_CONT(total, 0.5) FROM business_retail; -- Median
  - name: GEO_JOIN
    description: Map points into spatial grids (DuckDB spatial extension).
    variants:
      - name: Basic GEO_JOIN
        description: Join tables based on spatial relationships.
        example_generic: |-
          SELECT a.col1
          FROM table_main a
          JOIN spatial_grid g ON ST_Contains(g.geom, ST_Point(a.lon, a.lat));
        example: |-
          SELECT b.product_line
          FROM business_retail b
          JOIN spatial_grid g ON ST_Contains(g.geom, ST_Point(b.longitude, b.latitude));
  - name: PIVOT
    description: Rotate groups into columns (DuckDB extension).
    variants:
      - name: Basic PIVOT
        description: Transform rows into columns based on a pivot column.
        example_generic: |-
          SELECT * FROM table_main
          PIVOT (SUM(col2) FOR col1 IN ('A','B'));
        example: |-
          SELECT * FROM business_retail
          PIVOT (SUM(total) FOR product_line IN ('Food and beverages','Sports and travel'));
  - name: RECURSIVE CTE
    description: Handle hierarchical or recursive data.
    variants:
      - name: Basic RECURSIVE CTE
        description: Traverse a hierarchy.
        example_generic: |-
          WITH RECURSIVE tree AS (
            SELECT id, parent_id FROM table_main WHERE parent_id IS NULL
            UNION ALL
            SELECT t.id, t.parent_id
            FROM table_main t
            JOIN tree tr ON t.parent_id = tr.id
          )
          SELECT * FROM tree;
        example: |-
          WITH RECURSIVE hierarchy AS (
            SELECT customer_id, manager_id FROM customers WHERE manager_id IS NULL
            UNION ALL
            SELECT c.customer_id, c.manager_id
            FROM customers c JOIN hierarchy h ON c.manager_id = h.customer_id
          )
          SELECT * FROM hierarchy;
  - name: JSON_EXTRACT
    description: Pull a path out of JSON text (SQLite JSON1 extension).
    variants:
      - name: Basic JSON_EXTRACT
        description: Extract a value from a JSON column.
        example_generic: |-
          SELECT JSON_EXTRACT(json_col, '$.key')
          FROM table_main;
        example: |-
          SELECT JSON_EXTRACT(json_data, '$.key')
          FROM business_retail;
  - name: ALL / ANY
    description: Compare against all or any values in a subquery.
    variants:
      - name: Basic ALL
        description: Ensure a condition holds for all subquery values.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          WHERE col2 > ALL (SELECT col2 FROM table_main WHERE col1 = 'X');
        example: |-
          SELECT product_line, total
          FROM business_retail
          WHERE total > ALL (SELECT total FROM business_retail WHERE product_line = 'Sports and travel');
      - name: Basic ANY
        description: Ensure a condition holds for any subquery value.
        example_generic: |-
          SELECT col1, col2
          FROM table_main
          WHERE col2 > ANY (SELECT col2 FROM table_main WHERE col1 = 'X');
        example: |-
          SELECT product_line, total
          FROM business_retail
          WHERE total > ANY (SELECT total FROM business_retail WHERE product_line = 'Sports and travel');
  - name: COALESCE
    description: Return the first non-NULL value from a list of expressions. Essential for handling missing data gracefully.
    variants:
      - name: Basic COALESCE
        description: Replace NULL with a default value.
        example_generic: |-
          SELECT col1, COALESCE(col2, 0) AS col2_safe
          FROM table_main;
        example: |-
          SELECT product_line, COALESCE(discount, 0) AS discount
          FROM business_retail;
      - name: COALESCE with Multiple Fallbacks
        description: Try multiple columns in order, returning the first non-NULL.
        example_generic: |-
          SELECT COALESCE(col1, col2, 'Unknown') AS result
          FROM table_main;
        example: |-
          SELECT COALESCE(nickname, full_name, 'Anonymous') AS display_name
          FROM customers;
      - name: COALESCE in Calculations
        description: Use COALESCE to safely handle NULL in math expressions (NULL in arithmetic makes the whole result NULL).
        example_generic: |-
          SELECT col1,
                 col2 - COALESCE(prev_col2, col2) AS change
          FROM table_main;
        example: |-
          SELECT region,
                 avg_ndvi - COALESCE(prev_ndvi, avg_ndvi) AS ndvi_change
          FROM monthly_stats;
  - name: NULLIF
    description: Return NULL if two expressions are equal. Commonly used to prevent division by zero.
    variants:
      - name: Basic NULLIF
        description: Returns NULL when both arguments are the same, otherwise returns the first argument.
        example_generic: |-
          SELECT col1 / NULLIF(col2, 0) AS safe_ratio
          FROM table_main;
        example: |-
          SELECT product_line,
                 revenue / NULLIF(quantity, 0) AS price_per_unit
          FROM business_retail;
  - name: ROUND
    description: Round a numeric value to a specified number of decimal places.
    variants:
      - name: Basic ROUND
        description: Round to N decimal places.
        example_generic: |-
          SELECT ROUND(col1, 2) AS rounded_val
          FROM table_main;
        example: |-
          SELECT product_line, ROUND(AVG(total), 2) AS avg_total
          FROM business_retail
          GROUP BY product_line;
      - name: ROUND to Integer
        description: Round to the nearest whole number by using 0 decimal places.
        example_generic: |-
          SELECT ROUND(col1, 0) AS whole_number
          FROM table_main;
        example: |-
          SELECT ROUND(AVG(yield), 0) AS avg_yield
          FROM farming_yield;
  - name: CAST
    description: Convert a value from one data type to another.
    variants:
      - name: Basic CAST
        description: Convert between types like TEXT, INTEGER, REAL, DATE.
        example_generic: |-
          SELECT CAST(col1 AS INTEGER) AS int_val
          FROM table_main;
        example: |-
          SELECT CAST(total AS INTEGER) AS total_int
          FROM business_retail;
      - name: CAST for Division
        description: Cast integers to REAL/FLOAT before dividing to get decimal results instead of integer division.
        example_generic: |-
          SELECT CAST(col1 AS REAL) / col2 AS ratio
          FROM table_main;
        example: |-
          SELECT CAST(correct_count AS REAL) / total_count AS accuracy
          FROM results;
  - name: OVER / PARTITION BY
    description: The OVER clause turns an aggregate or ranking function into a window function. PARTITION BY divides rows into groups (like GROUP BY but without collapsing rows). ORDER BY within OVER defines the row order for the window.
    variants:
      - name: Aggregate with OVER
        description: Compute an aggregate per group while keeping every row visible (unlike GROUP BY which collapses rows).
        example_generic: |-
          SELECT col1, col2,
                 SUM(col2) OVER (PARTITION BY col1) AS group_total
          FROM table_main;
        example: |-
          SELECT product_line, total,
                 SUM(total) OVER (PARTITION BY product_line) AS line_total
          FROM business_retail;
      - name: Running Total with OVER
        description: Compute a cumulative sum by ordering rows within each partition.
        example_generic: |-
          SELECT col1, col2,
                 SUM(col2) OVER (PARTITION BY col1 ORDER BY col3) AS running_total
          FROM table_main;
        example: |-
          SELECT product_line, date, total,
                 SUM(total) OVER (PARTITION BY product_line ORDER BY date) AS cumulative_sales
          FROM business_retail;
      - name: PARTITION BY with Ranking
        description: Rank rows within each group independently.
        example_generic: |-
          SELECT col1, col2,
                 ROW_NUMBER() OVER (PARTITION BY col1 ORDER BY col2 DESC) AS rank_in_group
          FROM table_main;
        example: |-
          SELECT product_line, total,
                 ROW_NUMBER() OVER (PARTITION BY product_line ORDER BY total DESC) AS sales_rank
          FROM business_retail;
  - name: FIRST_VALUE / LAST_VALUE
    description: Retrieve the first or last value in a window frame.
    variants:
      - name: Basic FIRST_VALUE
        description: Get the first value within a partition.
        example_generic: |-
          SELECT col1, col2,
                 FIRST_VALUE(col2) OVER (PARTITION BY col1 ORDER BY col3) AS first_val
          FROM table_main;
        example: |-
          SELECT ticker, date, close,
                 FIRST_VALUE(close) OVER (PARTITION BY ticker ORDER BY date) AS opening_price
          FROM finance_stocks;
      - name: Basic LAST_VALUE
        description: Get the last value within a partition. Note — you often need a frame clause to get the true last value.
        example_generic: |-
          SELECT col1, col2,
                 LAST_VALUE(col2) OVER (
                   PARTITION BY col1 ORDER BY col3
                   ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
                 ) AS last_val
          FROM table_main;
        example: |-
          SELECT ticker, date, close,
                 LAST_VALUE(close) OVER (
                   PARTITION BY ticker ORDER BY date
                   ROWS BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING
                 ) AS latest_price
          FROM finance_stocks;
  - name: NTILE
    description: Divide rows into N roughly equal buckets within a partition.
    variants:
      - name: Basic NTILE
        description: Split rows into N groups and assign a bucket number.
        example_generic: |-
          SELECT col1, col2,
                 NTILE(4) OVER (ORDER BY col2 DESC) AS quartile
          FROM table_main;
        example: |-
          SELECT product_line, total,
                 NTILE(4) OVER (ORDER BY total DESC) AS quartile
          FROM business_retail;
  - name: STRING_AGG
    description: Concatenate string values from multiple rows into a single string, separated by a delimiter.
    variants:
      - name: Basic STRING_AGG
        description: Combine values into a comma-separated list.
        example_generic: |-
          SELECT col1, STRING_AGG(col2, ', ') AS combined
          FROM table_main
          GROUP BY col1;
        example: |-
          SELECT product_line, STRING_AGG(invoice_id, ', ') AS invoices
          FROM business_retail
          GROUP BY product_line;
  - name: String Functions
    description: Functions for manipulating text values.
    variants:
      - name: REPLACE
        description: Replace occurrences of a substring.
        example_generic: |-
          SELECT REPLACE(col1, 'old', 'new') AS cleaned
          FROM table_main;
        example: |-
          SELECT REPLACE(product_line, 'and', '&') AS short_name
          FROM business_retail;
      - name: SUBSTR
        description: Extract a portion of a string by position and length.
        example_generic: |-
          SELECT SUBSTR(col1, 1, 3) AS prefix
          FROM table_main;
        example: |-
          SELECT SUBSTR(invoice_id, 1, 3) AS store_code
          FROM business_retail;
      - name: LENGTH
        description: Get the number of characters in a string.
        example_generic: |-
          SELECT col1, LENGTH(col1) AS name_length
          FROM table_main;
        example: |-
          SELECT product_line, LENGTH(product_line) AS name_length
          FROM business_retail;
      - name: TRIM / UPPER / LOWER
        description: Clean and normalize text.
        example_generic: |-
          SELECT TRIM(col1) AS trimmed, UPPER(col1) AS uppercased, LOWER(col1) AS lowercased
          FROM table_main;
        example: |-
          SELECT TRIM(product_line) AS cleaned, UPPER(product_line) AS upper_name
          FROM business_retail;
  - name: Date Functions
    description: Functions for extracting and formatting dates and timestamps.
    variants:
      - name: STRFTIME
        description: Format a date/timestamp into a string (SQLite/DuckDB).
        example_generic: |-
          SELECT STRFTIME('%Y-%m', date_col) AS month
          FROM table_main;
        example: |-
          SELECT STRFTIME('%Y-%m', date) AS month, COUNT(*) AS sales
          FROM business_retail
          GROUP BY month;
      - name: EXTRACT
        description: Pull a specific part (year, month, day) from a date.
        example_generic: |-
          SELECT EXTRACT(YEAR FROM date_col) AS yr
          FROM table_main;
        example: |-
          SELECT EXTRACT(MONTH FROM date) AS month, SUM(total) AS revenue
          FROM business_retail
          GROUP BY month;
  - name: IFNULL / IIF
    description: Simple conditional expressions for handling NULLs and inline if-else logic.
    variants:
      - name: IFNULL
        description: Return the first argument if it is not NULL, otherwise return the second. Shorthand for COALESCE with two arguments.
        example_generic: |-
          SELECT col1, IFNULL(col2, 0) AS safe_col2
          FROM table_main;
        example: |-
          SELECT product_line, IFNULL(discount, 0) AS discount
          FROM business_retail;
      - name: IIF
        description: Inline if-else — returns one value if a condition is true, another if false.
        example_generic: |-
          SELECT col1, IIF(col2 > X, 'Yes', 'No') AS flag
          FROM table_main;
        example: |-
          SELECT product_line, IIF(total > 150, 'High', 'Low') AS category
          FROM business_retail;
  - name: ABS
    description: Return the absolute (non-negative) value of a number.
    variants:
      - name: Basic ABS
        description: Remove the sign from a number.
        example_generic: |-
          SELECT ABS(col1 - col2) AS difference
          FROM table_main;
        example: |-
          SELECT product_line, ABS(total - AVG(total) OVER()) AS deviation
          FROM business_retail;
  - name: EXCEPT / INTERSECT
    description: Set operations to find differences or commonalities between two result sets.
    variants:
      - name: EXCEPT
        description: Return rows from the first query that are NOT in the second query.
        example_generic: |-
          SELECT col1 FROM table_main
          EXCEPT
          SELECT col1 FROM ref_table;
        example: |-
          SELECT product_line FROM business_retail
          EXCEPT
          SELECT product_line FROM returns;
      - name: INTERSECT
        description: Return only rows that appear in BOTH queries.
        example_generic: |-
          SELECT col1 FROM table_main
          INTERSECT
          SELECT col1 FROM ref_table;
        example: |-
          SELECT product_line FROM business_retail WHERE total > 200
          INTERSECT
          SELECT product_line FROM business_retail WHERE quantity > 5;
