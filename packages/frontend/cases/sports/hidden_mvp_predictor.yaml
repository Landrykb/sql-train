id: hidden_mvp_predictor
name: "MVP Prediction Model"
tier: 7
domain: Sports NBA
description: "The analytics department needs to identify MVP candidates. Build a composite scoring model that weighs points, assists, rebounds, and shooting efficiency to rank the league's best performers."
hidden: true
skills:
  - select
  - join
  - group
  - window
  - cte
  - case
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases:
  - match_select
  - score_by_team
  - player_joins
  - score_trend
  - cte_player
  - capstone_sports
  - hidden_player_value
seedQuery: |-
  -- ANALYTICS DEPARTMENT: The Head of Analytics asks:
  -- "Build an MVP prediction model. Combine game stats
  --  with shooting data to create a composite score.
  --  Weight points, assists, rebounds, and shot accuracy
  --  to rank the top MVP candidates this season."
  --
  -- Build the MVP predictor!
  SELECT 1;
solutionQuery: |-
  WITH PlayerStats AS (
    SELECT
      player_id,
      COUNT(DISTINCT game_id) AS games_played,
      ROUND(AVG(points), 1) AS avg_points,
      ROUND(AVG(assists), 1) AS avg_assists,
      ROUND(AVG(rebounds), 1) AS avg_rebounds,
      SUM(points) AS total_points
    FROM nba_games
    GROUP BY player_id
  ),
  ShootingStats AS (
    SELECT
      player_id,
      COUNT(*) AS total_shots,
      SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) AS made_shots,
      ROUND(SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) * 100.0 / COUNT(*), 1) AS fg_pct
    FROM shot_zones
    GROUP BY player_id
  ),
  MVPScore AS (
    SELECT
      ps.player_id,
      ps.games_played,
      ps.avg_points,
      ps.avg_assists,
      ps.avg_rebounds,
      COALESCE(ss.fg_pct, 0) AS fg_pct,
      ROUND(ps.avg_points * 1.0 + ps.avg_assists * 1.5 + ps.avg_rebounds * 1.2 + COALESCE(ss.fg_pct, 0) * 0.5, 1) AS mvp_score
    FROM PlayerStats ps
    LEFT JOIN ShootingStats ss ON ps.player_id = ss.player_id
    WHERE ps.games_played >= 1
  )
  SELECT
    player_id,
    games_played,
    avg_points,
    avg_assists,
    avg_rebounds,
    fg_pct,
    mvp_score,
    RANK() OVER (ORDER BY mvp_score DESC) AS mvp_rank,
    CASE
      WHEN RANK() OVER (ORDER BY mvp_score DESC) <= 3 THEN 'MVP Candidate'
      WHEN RANK() OVER (ORDER BY mvp_score DESC) <= 10 THEN 'All-Star'
      WHEN RANK() OVER (ORDER BY mvp_score DESC) <= 25 THEN 'Starter'
      ELSE 'Role Player'
    END AS player_tier
  FROM MVPScore
  ORDER BY mvp_rank
  LIMIT 25;
instructions: |-
  Build an MVP prediction model:

  1. Calculate per-player game stats: games_played, avg_points, avg_assists, avg_rebounds
  2. Calculate shooting stats: total_shots, made_shots, fg_pct (field goal %)
     - made column contains 'True'/'False' strings
  3. Compute composite mvp_score:
     points * 1.0 + assists * 1.5 + rebounds * 1.2 + fg_pct * 0.5
  4. Only include players with at least 1 game played
  5. Classify player tier:
     - MVP Candidate: rank 1-3
     - All-Star: rank 4-10
     - Starter: rank 11-25
     - Role Player: everyone else
  6. Rank by mvp_score descending

  Return: player_id, games_played, avg_points, avg_assists, avg_rebounds, fg_pct, mvp_score, mvp_rank, player_tier
hints:
  - Use CASE WHEN made = 'True' THEN 1 ELSE 0 END to count made shots
  - LEFT JOIN shooting stats since not all players may have shot data
  - COALESCE(fg_pct, 0) handles players with no shot records
  - "Three CTEs: PlayerStats, ShootingStats, MVPScore"
  - You can use RANK() inside CASE in the final SELECT
thoughtProcess:
  - "MVP prediction = combine multiple performance dimensions into a single score. Break it into three CTEs: game stats, shooting efficiency, and composite score."
  - "CTE 1 — PlayerStats: GROUP BY player_id from nba_games. Compute AVG(points), AVG(assists), AVG(rebounds), SUM(points), COUNT(DISTINCT game_id). These are the raw per-player metrics."
  - "CTE 2 — ShootingStats: SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS fg_pct FROM shot_zones GROUP BY player_id. The CASE-inside-SUM pattern counts made shots."
  - "CTE 3 — MVPScore: LEFT JOIN PlayerStats with ShootingStats on player_id. LEFT JOIN ensures players without shot data are kept. COALESCE(fg_pct, 0) replaces NULL with 0."
  - "Composite score formula: weighted sum of avg_points, avg_assists, avg_rebounds, fg_pct. Use RANK() OVER (ORDER BY mvp_score DESC) for final ranking."
  - "CASE in final SELECT: RANK = 1 → 'MVP Favorite', top 5 → 'All-Star Candidate', etc. Pattern: independent CTEs → LEFT JOIN for completeness → weighted score → RANK → CASE classification."
schema:
  - name: nba_games
    columns:
      - { name: game_id, type: TEXT }
      - { name: player_id, type: TEXT }
      - { name: points, type: INTEGER }
      - { name: assists, type: INTEGER }
      - { name: rebounds, type: INTEGER }
      - { name: game_date, type: DATE }
  - name: shot_zones
    columns:
      - { name: shot_id, type: TEXT }
      - { name: player_id, type: TEXT }
      - { name: shot_zone, type: TEXT }
      - { name: made, type: TEXT }
type: hidden
