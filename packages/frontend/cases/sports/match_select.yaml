id: match_select
name: Player Efficiency
tier: 1
domain: Sports Nba
description: Calculate player efficiency metrics
skills:
  - group
  - aggregation
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases: []
seedQuery: |-
  -- TODO: write query for match_select
  SELECT 1;
solutionQuery: |-
  SELECT player_id, SUM(points + assists + rebounds) AS total_efficiency
  FROM nba_games
  GROUP BY player_id
  ORDER BY total_efficiency DESC;
instructions: Sum points, assists, and rebounds for each player, order by total
hints:
  - Review the group concept in the GuideBook
  - Use SUM to aggregate metrics
  - Use GROUP BY for player_id
  - Use ORDER BY to sort results
thoughtProcess:
  - "'Sum points, assists, and rebounds for each player' — you need a composite metric (efficiency) per player. GROUP BY player_id."
  - "SELECT player_id, SUM(points + assists + rebounds) AS total_efficiency — addition inside SUM combines the three stats per game, then SUM totals across all games."
  - "FROM nba_games GROUP BY player_id — each player gets one row with their career total efficiency."
  - "ORDER BY total_efficiency DESC — best performers first. No LIMIT means you see all players."
  - "Pattern: SUM(expr1 + expr2) aggregates a computed expression. You can do math inside aggregate functions — SQL evaluates the expression per row, then aggregates."
schema:
  - name: nba_games
    columns:
      - name: game_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: points
        type: INTEGER
      - name: assists
        type: INTEGER
      - name: rebounds
        type: INTEGER
      - name: game_date
        type: DATE
  - name: shot_zones
    columns:
      - name: shot_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: shot_zone
        type: TEXT
      - name: made
        type: BOOLEAN
