id: player_joins
name: Player Performance
tier: 3
domain: Sports Nba
description: Join game and shot data for player analysis
skills:
  - joins
  - aggregation
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases:
  - match_select
  - score_by_team
seedQuery: |-
  -- TODO: write query for player_joins
  SELECT 1;
solutionQuery: |-
  SELECT g.player_id, COUNT(s.shot_id) AS shot_count
  FROM nba_games g
  JOIN shot_zones s ON g.player_id = s.player_id
  GROUP BY g.player_id
  ORDER BY shot_count DESC;
instructions: Join nba_games and shot_zones, summarize player shots, order by shots
hints:
  - Review joins in the GuideBook
  - Use JOIN on player_id
  - Count shots per player
  - Order by shot count
thoughtProcess:
  - "You need shot counts per player — shots live in shot_zones, player games in nba_games. JOIN on player_id links the two tables."
  - "JOIN shot_zones s ON g.player_id = s.player_id — INNER JOIN keeps only players who have shot records."
  - "SELECT g.player_id, COUNT(s.shot_id) AS shot_count — counts total shots per player. GROUP BY g.player_id collapses all rows for the same player."
  - "ORDER BY shot_count DESC — most active shooters first. This combines JOIN + aggregation, the bread-and-butter of multi-table analytics."
  - "Pattern: FROM table1 JOIN table2 ON key → SELECT key, COUNT(detail) → GROUP BY key → ORDER BY aggregate."
schema:
  - name: nba_games
    columns:
      - name: game_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: points
        type: INTEGER
      - name: assists
        type: INTEGER
      - name: rebounds
        type: INTEGER
      - name: game_date
        type: DATE
  - name: shot_zones
    columns:
      - name: shot_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: shot_zone
        type: TEXT
      - name: made
        type: BOOLEAN
