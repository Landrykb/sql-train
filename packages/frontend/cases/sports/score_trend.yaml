id: score_trend
name: Scoring Trends
tier: 3
domain: Sports Nba
description: Analyze player scoring trends
skills:
  - aggregation
  - date_functions
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases:
  - match_select
  - score_by_team
seedQuery: |-
  -- TODO: write query for score_trend
  SELECT 1;
solutionQuery: |-
  SELECT strftime('%Y-%m', game_date) AS month, AVG(points) AS avg_points
  FROM nba_games
  GROUP BY strftime('%Y-%m', game_date)
  ORDER BY month;
instructions: Calculate average points per game by month, order by month
hints:
  - Review date functions in the GuideBook
  - Use strftime to group by month
  - Use AVG for points
  - Order by month
schema:
  - name: nba_games
    columns:
      - name: game_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: points
        type: INTEGER
      - name: assists
        type: INTEGER
      - name: rebounds
        type: INTEGER
      - name: game_date
        type: DATE
  - name: shot_zones
    columns:
      - name: shot_id
        type: TEXT
      - name: player_id
        type: TEXT
      - name: shot_zone
        type: TEXT
      - name: made
        type: BOOLEAN
