id: hidden_player_value
name: "Identify Undervalued Players for Trade Deadline"
tier: 6
domain: Sports NBA
description: The GM needs trade deadline analysis — find players delivering outsized performance by combining scoring, assists, rebounds, and shooting efficiency to identify the most valuable trade targets.
hidden: true
skills:
  - select
  - group
  - order
  - case
  - cte
  - join
datasets:
  - name: nba_games
    file: nba_games.csv
  - name: shot_zones
    file: shot_zones.csv
prereq_cases:
  - match_select
  - score_by_team
  - player_joins
  - score_trend
  - cte_player
  - capstone_sports
seedQuery: |-
  -- SCENARIO: The General Manager asks:
  -- "The trade deadline is coming. Find teams
  --  with the best scorers but worst records —
  --  those teams might be willing to trade their
  --  star players. Show me the data."
  SELECT 1;
solutionQuery: |-
  WITH PlayerStats AS (
    SELECT
      g.player_id,
      COUNT(DISTINCT g.game_id) AS games_played,
      ROUND(AVG(g.points), 1) AS avg_points,
      ROUND(AVG(g.assists), 1) AS avg_assists,
      ROUND(AVG(g.rebounds), 1) AS avg_rebounds,
      SUM(g.points) AS total_points
    FROM nba_games g
    GROUP BY g.player_id
  ),
  ShootingStats AS (
    SELECT
      player_id,
      COUNT(*) AS total_shots,
      SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) AS made_shots,
      ROUND(100.0 * SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) / COUNT(*), 1) AS fg_pct
    FROM shot_zones
    GROUP BY player_id
  )
  SELECT
    p.player_id,
    p.games_played,
    p.avg_points,
    p.avg_assists,
    p.avg_rebounds,
    COALESCE(s.fg_pct, 0) AS fg_pct,
    ROUND(p.avg_points + p.avg_assists * 1.5 + p.avg_rebounds + COALESCE(s.fg_pct, 0) * 0.5, 1) AS trade_value,
    CASE
      WHEN p.avg_points >= 30 AND COALESCE(s.fg_pct, 0) >= 50 THEN 'Elite Target'
      WHEN p.avg_points >= 20 THEN 'High Value'
      WHEN p.avg_points >= 10 AND p.avg_assists >= 5 THEN 'Solid Role Player'
      ELSE 'Depth Piece'
    END AS trade_likelihood
  FROM PlayerStats p
  LEFT JOIN ShootingStats s ON p.player_id = s.player_id
  ORDER BY trade_value DESC
  LIMIT 20;
instructions: |-
  The GM needs trade deadline intelligence:

  1. CTE 1: Calculate per player from nba_games: games_played, avg_points, avg_assists, avg_rebounds
  2. CTE 2: Calculate per player from shot_zones: fg_pct using CASE WHEN made = 'True'
  3. LEFT JOIN to combine (not all players have shot data)
  4. Compute trade_value = avg_points + avg_assists * 1.5 + avg_rebounds + fg_pct * 0.5
  5. Classify trade_likelihood:
     - Elite Target: avg_points >= 30 AND fg_pct >= 50
     - High Value: avg_points >= 20
     - Solid Role Player: avg_points >= 10 AND avg_assists >= 5
     - Depth Piece: everyone else
  6. Order by trade_value DESC, LIMIT 20
hints:
  - "Two CTEs: one for game stats, one for shooting"
  - Use CASE WHEN made = 'True' for fg_pct
  - LEFT JOIN on player_id (not all have shot data)
  - COALESCE(fg_pct, 0) for players without shot records
thoughtProcess:
  - "Player trade value = combine game performance with shooting efficiency. Two CTEs: one for per-game averages, one for shooting percentage — then LEFT JOIN on player_id."
  - "CTE 1 — PlayerStats: GROUP BY player_id from nba_games. AVG(points), AVG(assists), AVG(rebounds), SUM(points). These raw per-player metrics show on-court impact."
  - "CTE 2 — ShootingStats: SUM(CASE WHEN made = 'True' THEN 1 ELSE 0 END) / COUNT(*) AS fg_pct. The CASE-inside-SUM pattern counts made shots from shot_zones."
  - "LEFT JOIN ensures players without shot data are kept. COALESCE(fg_pct, 0) replaces NULL with 0 for the composite score."
  - "Trade value formula: weighted sum of avg_points, avg_assists, avg_rebounds, fg_pct. Different weights reflect position value — assists worth 1.5x shows playmaking premium."
  - "Pattern: independent CTEs for different aspects → LEFT JOIN for completeness → composite score → CASE classification. This is how front offices evaluate trade targets."
