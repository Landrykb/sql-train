solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.metrics import mean_absolute_error, mean_squared_error
  from statsmodels.tsa.arima.model import ARIMA

  raw = pd.read_csv(open_url("/datasets/train.csv"))
  raw['Order Date'] = pd.to_datetime(raw['Order Date'])
  df = raw.groupby('Order Date')['Sales'].sum().to_frame('value')

  # Train/test split (last 30 days as test)
  train, test = df.iloc[:-30], df.iloc[-30:]
  model = ARIMA(train['value'], order=(2, 1, 2))
  results = model.fit()
  forecast = results.forecast(steps=30)
  mae = mean_absolute_error(test['value'], forecast)
  rmse = np.sqrt(mean_squared_error(test['value'], forecast))
  mape = np.mean(np.abs((test['value'].values - forecast.values) / test['value'].values)) * 100
  print("Model Comparison:")
  print(f"ARIMA — MAE: {mae:.1f}, RMSE: {rmse:.1f}, MAPE: {mape:.1f}%")
