id: forecast_prophet
name: "Advanced Forecasting Models"
domain: forecasting
project: "Time Series Forecasting"
step_number: 4
tier: 3
skills: [exponential_smoothing, regression, forecasting, comparison]
language: python
dataset_url: "https://www.kaggle.com/datasets/rohitsahoo/sales-forecasting"
description: "Use exponential smoothing and a simple regression baseline for trend/seasonality — pure-Python alternatives to Prophet and LSTM that run in the browser."
prereq_cases: [forecast_arima]
learning_objectives:
  - Fit exponential smoothing models with trend and seasonality
  - Build a regression model with lag features
  - Compare the models against ARIMA
sections:
  - title: "Exponential Smoothing"
    content: "Exponential smoothing models are a fast, lightweight way to capture trend and weekly seasonality without Prophet."
    code: |
      from statsmodels.tsa.holtwinters import ExponentialSmoothing
      import warnings
      warnings.filterwarnings('ignore')

      # Ensure a regular daily frequency for statsmodels
      ts = df['value'].asfreq('D').fillna(0)
      es = ExponentialSmoothing(ts, trend='add', seasonal='add', seasonal_periods=7)
      es_fit = es.fit()
      exp_forecast = es_fit.forecast(30)
      print(exp_forecast.head())
    explanation: "Holt-Winters exponential smoothing decomposes the series into level, trend, and seasonal components. It is a pure-Python alternative to Prophet that works in Pyodide."
  - title: "Regression with Lag Features"
    content: "A simple linear model can learn from the last few days of values to predict the next one."
    code: |
      from sklearn.linear_model import LinearRegression

      # Build lag features (last 7 days predict today)
      reg_df = df['value'].asfreq('D').fillna(0).to_frame('value')
      for lag in range(1, 8):
          reg_df[f'lag_{lag}'] = reg_df['value'].shift(lag)
      reg_df = reg_df.dropna()

      X = reg_df[[f'lag_{i}' for i in range(1, 8)]]
      y = reg_df['value']
      split = int(0.8 * len(reg_df))

      reg = LinearRegression().fit(X.iloc[:split], y.iloc[:split])
      r2 = reg.score(X.iloc[split:], y.iloc[split:])
      print(f"Linear regression R² on test: {r2:.3f}")
    explanation: "Using lag features turns time series forecasting into a supervised learning problem. Linear regression is a simple, interpretable alternative to an LSTM and runs fully in the browser."
schema:
  - date
  - value
thought_process:
  - "Prepare a regular daily time series: df['value'].asfreq('D').fillna(0)"
  - "Fit exponential smoothing with additive trend and weekly seasonality"
  - "Generate a 30-day forecast and print the first few values"
  - "Build a DataFrame of lag-1 through lag-7 values as features"
  - "Train a linear regression and check R² on the held-out test set"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from statsmodels.tsa.holtwinters import ExponentialSmoothing
  from sklearn.linear_model import LinearRegression
  import warnings
  warnings.filterwarnings('ignore')

  raw = pd.read_csv(open_url("/datasets/train.csv"))
  raw['Order Date'] = pd.to_datetime(raw['Order Date'])
  df = raw.groupby('Order Date')['Sales'].sum().to_frame('value')
  df = df.asfreq('D').fillna(0)

  # Exponential Smoothing forecast
  es = ExponentialSmoothing(df['value'], trend='add', seasonal='add', seasonal_periods=7)
  es_fit = es.fit()
  exp_forecast = es_fit.forecast(30)

  # Linear regression with lag features
  reg_df = df.copy()
  for lag in range(1, 8):
      reg_df[f'lag_{lag}'] = reg_df['value'].shift(lag)
  reg_df = reg_df.dropna()
  X = reg_df[[f'lag_{i}' for i in range(1, 8)]]
  y = reg_df['value']
  split = int(0.8 * len(reg_df))
  reg = LinearRegression().fit(X.iloc[:split], y.iloc[:split])
  reg_r2 = reg.score(X.iloc[split:], y.iloc[split:])

  print(f"Exponential Smoothing — last 5 forecasts:")
  print(exp_forecast.tail())
  print(f"Linear regression R²: {reg_r2:.3f}")
expected_output: |
  Exponential Smoothing — last 5 forecasts:
  Linear regression R²:
hints:
  - "ExponentialSmoothing needs a regular frequency: use df.asfreq('D') first"
  - "Use warnings.filterwarnings('ignore') to keep statsmodels output clean"
  - "Lag features shift the series: df['value'].shift(1) is yesterday"
visualizations:
  - title: "Exponential Smoothing Forecast"
    code: |
      import matplotlib.pyplot as plt
      import warnings
      warnings.filterwarnings('ignore')
      ts = df['value'].asfreq('D').fillna(0)
      es = ExponentialSmoothing(ts, trend='add', seasonal='add', seasonal_periods=7).fit()
      fc = es.forecast(30)
      plt.figure(figsize=(14, 5))
      plt.plot(ts[-90:], label='Historical', color='steelblue')
      plt.plot(fc.index, fc.values, label='ES Forecast', color='coral', linewidth=2)
      plt.title('30-Day Exponential Smoothing Forecast')
      plt.legend()
      plt.show()
    description: "Forecasts from Holt-Winters exponential smoothing"
  - title: "Actual vs Predicted (Regression)"
    code: |
      import matplotlib.pyplot as plt
      import warnings
      warnings.filterwarnings('ignore')
      reg_df = df['value'].asfreq('D').fillna(0).to_frame('value')
      for lag in range(1, 8):
          reg_df[f'lag_{lag}'] = reg_df['value'].shift(lag)
      reg_df = reg_df.dropna()
      X = reg_df[[f'lag_{i}' for i in range(1, 8)]]
      y = reg_df['value']
      split = int(0.8 * len(reg_df))
      reg = LinearRegression().fit(X.iloc[:split], y.iloc[:split])
      pred = reg.predict(X.iloc[split:])
      plt.figure(figsize=(14, 5))
      plt.plot(y.iloc[split:].index, y.iloc[split:], label='Actual', color='steelblue')
      plt.plot(y.iloc[split:].index, pred, label='Predicted', color='coral')
      plt.title('Regression: Actual vs Predicted')
      plt.legend()
      plt.show()
    description: "Compare the regression model's predictions to actual values"
  - title: "Model Comparison: ARIMA vs ES"
    code: |
      import matplotlib.pyplot as plt
      import warnings
      warnings.filterwarnings('ignore')
      arima = ARIMA(df['value'], order=(2, 1, 2)).fit()
      arima_fc = arima.forecast(30)
      es = ExponentialSmoothing(df['value'].asfreq('D').fillna(0), trend='add', seasonal='add', seasonal_periods=7).fit()
      es_fc = es.forecast(30)
      plt.figure(figsize=(14, 5))
      plt.plot(df['value'][-90:], label='Historical', color='steelblue')
      plt.plot(arima_fc.index, arima_fc.values, label='ARIMA', linestyle='--', color='coral')
      plt.plot(es_fc.index, es_fc.values, label='Exponential Smoothing', linestyle='--', color='green')
      plt.title('30-Day Forecast Comparison')
      plt.legend()
      plt.show()
    description: "Overlay ARIMA and Exponential Smoothing forecasts"
