id: forecast_arima
name: "ARIMA Modeling"
domain: forecasting
project: "Time Series Forecasting"
step_number: 3
tier: 2
skills: [arima, statsmodels, model_selection, forecasting]
language: python
dataset_url: "https://www.kaggle.com/datasets/rohitsahoo/sales-forecasting"
description: "Build and tune ARIMA models for time series forecasting with proper parameter selection and diagnostics."
prereq_cases: [forecast_timeseries]
learning_objectives:
  - Fit ARIMA models with selected (p,d,q) parameters
  - Use a small grid search to pick a good (p,d,q) order
  - Diagnose model residuals
  - Generate forecasts with confidence intervals
sections:
  - title: "Fit ARIMA Model"
    content: "Use the parameters identified from ACF/PACF analysis."
    code: |
      from statsmodels.tsa.arima.model import ARIMA

      model = ARIMA(df['value'], order=(2, 1, 2))
      results = model.fit()
      print(results.summary())
    explanation: "ARIMA(p,d,q): p=AR lags, d=differencing order, q=MA lags. The summary shows coefficient estimates, AIC/BIC for model comparison, and diagnostic test results."
  - title: "Select Best ARIMA Order"
    content: "Test a small grid of (p,d,q) orders and pick the one with the lowest AIC. This is the Pyodide-compatible alternative to auto_arima."
    code: |
      import itertools
      from statsmodels.tsa.arima.model import ARIMA

      best_aic = float('inf')
      best_order = None
      best_results = None
      orders = [(p, 1, q) for p in range(3) for q in range(3)]

      for order in orders:
          try:
              candidate = ARIMA(df['value'], order=order).fit()
              if candidate.aic < best_aic:
                  best_aic = candidate.aic
                  best_order = order
                  best_results = candidate
          except Exception:
              pass

      print(f"Best order: {best_order}")
      print(f"Best AIC: {best_aic:.2f}")
    explanation: "A small grid search tries several (p,d,q) combinations and keeps the model with the lowest AIC. This avoids the pmdarima dependency while still automating parameter selection."
  - title: "Forecast & Visualize"
    content: "Generate predictions with confidence intervals from the best model."
    code: |
      import matplotlib.pyplot as plt
      from statsmodels.tsa.arima.model import ARIMA

      # Fit the best candidate again if you skipped the grid-search step
      best_results = best_results if 'best_results' in dir() and best_results is not None else ARIMA(df['value'], order=(2, 1, 2)).fit()

      forecast_steps = 30
      forecast = best_results.get_forecast(steps=forecast_steps)
      fc_values = forecast.predicted_mean
      fc_conf = forecast.conf_int()

      fc_index = pd.date_range(df.index[-1], periods=forecast_steps+1, freq='D')[1:]

      plt.figure(figsize=(14, 5))
      plt.plot(df['value'][-90:], label='Historical', color='steelblue')
      plt.plot(fc_index, fc_values, label='Forecast', color='coral', linewidth=2)
      plt.fill_between(fc_index, fc_conf.iloc[:, 0], fc_conf.iloc[:, 1], alpha=0.2, color='coral')
      plt.legend()
      plt.title('30-Day ARIMA Forecast')
      plt.show()
    explanation: "The shaded region shows the 95% confidence interval — it widens as we forecast further ahead because uncertainty grows. Narrow bands = more confident predictions."
schema:
  - date
  - value
thought_process:
  - "Use ACF/PACF results to pick initial (p,d,q) parameters"
  - "Fit an ARIMA model and examine the summary for AIC and coefficients"
  - "Run a small (p,d,q) grid search and keep the model with the lowest AIC"
  - "Generate a 30-day forecast with confidence intervals"
  - "Plot forecast alongside historical data for visual validation"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from statsmodels.tsa.arima.model import ARIMA

  raw = pd.read_csv(open_url("/datasets/train.csv"))
  raw['Order Date'] = pd.to_datetime(raw['Order Date'])
  df = raw.groupby('Order Date')['Sales'].sum().to_frame('value')
  df = df.asfreq('D').fillna(0)
  model = ARIMA(df['value'], order=(2, 1, 2))
  results = model.fit()
  print(f"AIC: {results.aic:.2f}")
  print(f"BIC: {results.bic:.2f}")
expected_output: |
  AIC:
  BIC:
hints:
  - "Lower AIC = better model (penalizes complexity)"
  - "Check residuals: they should look like white noise"
  - "SARIMA adds seasonal components: ARIMA(p,d,q)(P,D,Q,m)"
visualizations:
  - title: "ARIMA Forecast with Confidence Intervals"
    code: |
      import matplotlib.pyplot as plt
      from statsmodels.tsa.arima.model import ARIMA
      forecast_steps = 30
      results = ARIMA(df['value'], order=(2, 1, 2)).fit()
      forecast = results.get_forecast(steps=forecast_steps)
      fc_values = forecast.predicted_mean
      fc_conf = forecast.conf_int()
      fc_index = pd.date_range(df.index[-1], periods=forecast_steps+1, freq='D')[1:]
      plt.figure(figsize=(14, 5))
      plt.plot(df['value'][-90:], label='Historical', color='steelblue')
      plt.plot(fc_index, fc_values, label='Forecast', color='coral', linewidth=2)
      plt.fill_between(fc_index, fc_conf.iloc[:, 0], fc_conf.iloc[:, 1], alpha=0.2, color='coral')
      plt.legend()
      plt.title('30-Day ARIMA Forecast')
      plt.show()
    description: "Shows forecast with 95% confidence interval bands"
  - title: "Model Residuals Diagnostics"
    code: |
      import matplotlib.pyplot as plt
      from statsmodels.tsa.arima.model import ARIMA
      from statsmodels.graphics.tsaplots import plot_acf
      results = ARIMA(df['value'], order=(2, 1, 2)).fit()
      residuals = results.resid
      fig, axes = plt.subplots(2, 2, figsize=(12, 8))
      residuals.plot(ax=axes[0, 0], title='Residuals Over Time')
      residuals.hist(bins=30, ax=axes[0, 1], edgecolor='black')
      axes[0, 1].set_title('Residual Distribution')
      plot_acf(residuals, lags=20, ax=axes[1, 0])
      axes[1, 0].set_title('Residual ACF')
      axes[1, 1].axis('off')
      plt.tight_layout()
      plt.show()
    description: "Check if residuals look like white noise (no patterns)"
  - title: "Model Comparison Bar Chart"
    code: |
      import matplotlib.pyplot as plt
      from statsmodels.tsa.arima.model import ARIMA
      manual_results = ARIMA(df['value'], order=(2, 1, 2)).fit()
      auto_results = ARIMA(df['value'], order=(1, 1, 1)).fit()
      models = ['Manual ARIMA', 'Auto ARIMA']
      aic_values = [manual_results.aic, auto_results.aic]
      plt.bar(models, aic_values, color=['steelblue', 'coral'])
      plt.title('Model Comparison (Lower AIC is Better)')
      plt.ylabel('AIC Score')
      plt.show()
    description: "Compare AIC scores to select the best model"
  - title: "Forecast Accuracy on Test Set"
    code: |
      import matplotlib.pyplot as plt
      from statsmodels.tsa.arima.model import ARIMA
      from sklearn.metrics import mean_absolute_error
      train = df['value'][:-30]
      test = df['value'][-30:]
      model_test = ARIMA(train, order=(2, 1, 2))
      results_test = model_test.fit()
      pred = results_test.forecast(steps=30)
      mae = mean_absolute_error(test, pred)
      plt.figure(figsize=(10, 4))
      plt.plot(test.index, test, label='Actual', marker='o')
      plt.plot(test.index, pred, label='Predicted', marker='s', linestyle='--')
      plt.title(f'Validation: MAE = {mae:.2f}')
      plt.legend()
      plt.show()
    description: "Validate forecast accuracy on holdout test set"
