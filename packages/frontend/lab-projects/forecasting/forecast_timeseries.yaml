id: forecast_timeseries
name: "Time Series Fundamentals"
domain: forecasting
project: "Time Series Forecasting"
step_number: 2
tier: 2
skills: [time_series, autocorrelation, differencing, rolling_stats]
language: python
description: "Master autocorrelation analysis, differencing for stationarity, and rolling statistics to prepare data for forecasting models."
prereq_cases: [forecast_explore]
learning_objectives:
  - Compute and interpret ACF and PACF plots
  - Apply differencing to achieve stationarity
  - Calculate rolling mean and standard deviation
  - Determine ARIMA (p, d, q) parameters from ACF/PACF
sections:
  - title: "ACF & PACF Analysis"
    content: "Autocorrelation and partial autocorrelation reveal how current values relate to past values."
    code: |
      from statsmodels.graphics.tsaplots import plot_acf, plot_pacf

      fig, axes = plt.subplots(1, 2, figsize=(14, 4))
      plot_acf(df['value'].dropna(), lags=40, ax=axes[0])
      plot_pacf(df['value'].dropna(), lags=40, ax=axes[1])
      plt.tight_layout()
      plt.show()
    explanation: "ACF shows correlation at all lags (including indirect). PACF shows direct correlation only. Significant PACF lags suggest AR order (p); significant ACF lags suggest MA order (q)."
  - title: "Differencing for Stationarity"
    content: "Remove trends and seasonality through differencing."
    code: |
      df['diff_1'] = df['value'].diff()
      df['diff_seasonal'] = df['value'].diff(periods=7)  # weekly seasonality

      fig, axes = plt.subplots(3, 1, figsize=(14, 8), sharex=True)
      df['value'].plot(ax=axes[0], title='Original')
      df['diff_1'].plot(ax=axes[1], title='First Difference (d=1)')
      df['diff_seasonal'].plot(ax=axes[2], title='Seasonal Difference (D=1, s=7)')
      plt.tight_layout()
      plt.show()
    explanation: "First differencing removes linear trend. Seasonal differencing removes periodic patterns. Most real-world series need d=1 or d=2 at most."
  - title: "Rolling Statistics"
    content: "Compute moving averages and standard deviations to visualize trends."
    code: |
      rolling_mean = df['value'].rolling(window=30).mean()
      rolling_std = df['value'].rolling(window=30).std()

      plt.figure(figsize=(14, 5))
      plt.plot(df['value'], label='Original', alpha=0.5)
      plt.plot(rolling_mean, label='30-Day Rolling Mean', color='red', linewidth=2)
      plt.fill_between(rolling_mean.index,
                       rolling_mean - 2*rolling_std,
                       rolling_mean + 2*rolling_std,
                       alpha=0.1, color='red')
      plt.legend()
      plt.title('Rolling Mean ± 2σ')
      plt.show()
    explanation: "The rolling mean shows the trend. The ±2σ band shows expected variation. Points outside the band are potential anomalies."
schema:
  - date
  - value
  - diff_1
  - diff_seasonal
thought_process:
  - "Plot ACF and PACF to identify autocorrelation structure"
  - "If ACF decays slowly, the series needs differencing"
  - "Apply first-order differencing to remove trend"
  - "Apply seasonal differencing if periodic patterns remain"
  - "Compute rolling mean and std to visualize trend and variability"
solution_code: |
  import pandas as pd
  from statsmodels.tsa.stattools import adfuller

  df = pd.read_csv('sales_data.csv', parse_dates=['date'], index_col='date')
  df['diff_1'] = df['value'].diff()
  result = adfuller(df['diff_1'].dropna())
  print(f"After differencing — ADF: {result[0]:.4f}, p-value: {result[1]:.4f}")
  print(f"Stationary: {'Yes' if result[1] < 0.05 else 'No'}")
  rolling_mean = df['value'].rolling(window=30).mean()
  print(f"30-day rolling mean (last 5):\n{rolling_mean.tail()}")
expected_output: |
  After differencing — ADF: -8.4521, p-value: 0.0000
  Stationary: Yes
hints:
  - "If ACF decays slowly, the series needs differencing"
  - "PACF cutoff at lag p → AR(p); ACF cutoff at lag q → MA(q)"
  - "Use auto_arima from pmdarima to automatically select (p,d,q)"
