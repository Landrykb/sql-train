thought_process:
  - "Aggregate historical emissions by year"
  - "Fit a linear regression to project baseline (BAU) trajectory"
  - "Model 3 reduction scenarios: aggressive (7%), moderate (4%), conservative (2%)"
  - "Calculate net-zero year for each scenario (<5% of baseline)"
solution_code: |
  import kagglehub
  import os
  import numpy as np
  import pandas as pd

  path = kagglehub.dataset_download("unitednations/international-greenhouse-gas-emissions")
  csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
  df = pd.read_csv(os.path.join(path, csv_files[0]))
  # Use total emissions from latest year as baseline
  num_cols = df.select_dtypes(include='number').columns
  base = df[num_cols].sum().max()
  for rate, name in [(0.07, 'Aggressive'), (0.04, 'Moderate'), (0.02, 'Conservative')]:
      trajectory = [base]
      for _ in range(27):
          trajectory.append(trajectory[-1] * (1 - rate))
      nz_year = 2024 + next((i for i, v in enumerate(trajectory) if v < base*0.05), 27)
      print(f"{name} ({rate*100:.0f}%/yr): Net-zero ~{nz_year}")
expected_output: |
  Aggressive (7%/yr): Net-zero ~
  Moderate (4%/yr): Net-zero ~
  Conservative (2%/yr): Net-zero ~
