id: decarb_emissions
name: "Model Carbon Footprint"
domain: decarb
project: "Decarbonization Modeling"
step_number: 2
tier: 2
skills: [carbon_accounting, regression, lifecycle_analysis]
language: python
dataset_url: "https://www.kaggle.com/datasets/unitednations/international-greenhouse-gas-emissions"
description: "Build a carbon footprint model that estimates emissions from operational data — energy use, transport, supply chain activities."
prereq_cases: [decarb_explore]
learning_objectives:
  - Calculate carbon footprint using emission factors
  - Model the relationship between operational metrics and emissions
  - Identify the largest emission hotspots
sections:
  - title: "Emission Factor Calculations"
    content: "Convert operational data to CO2 equivalents using standard emission factors."
    code: |
      # Analyze emissions by category
      cat_totals = emissions.groupby('category')['value'].sum().sort_values(ascending=False)
      print("Emission Breakdown by Category:")
      print(cat_totals.round(1))

      # Per-capita style: emissions per country per year
      country_yearly = emissions.groupby(['country_or_area', 'year'])['value'].sum().reset_index()
      country_yearly.columns = ['country', 'year', 'total_emissions']
      print(f"\nCountry-year records: {len(country_yearly)}")
      print(country_yearly.head())
    explanation: "Emission factors convert activity data (kWh, liters, km) to CO2 equivalents. These are published by EPA, DEFRA, and IEA. The total footprint is the sum of all sources."
  - title: "Hotspot Analysis"
    content: "Identify the largest emission sources for targeted reduction."
    code: |
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))

      cat_totals.head(8).plot(kind='pie', ax=axes[0], autopct='%1.1f%%')
      axes[0].set_title('Emissions by Category')
      axes[0].set_ylabel('')

      top10 = emissions.groupby('country_or_area')['value'].sum().nlargest(10)
      top10.plot(kind='barh', ax=axes[1], color='coral')
      axes[1].set_title('Top 10 Emitting Countries')
      axes[1].set_xlabel('GHG Value')

      plt.tight_layout()
      plt.show()
    explanation: "The 80/20 rule often applies: 20% of facilities/sources cause 80% of emissions. Focusing reduction efforts on hotspots maximizes impact per dollar spent."
schema:
  - country_or_area
  - year
  - value
  - category
thought_process:
  - "Define emission factors for each energy/activity source"
  - "Multiply activity data by emission factors to get CO2 equivalents"
  - "Sum all sources for total carbon footprint per facility"
  - "Identify the largest emission hotspots (80/20 rule)"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  df = pd.read_csv(open_url("/datasets/ghg_emissions.csv"))
  print(f"Shape: {df.shape}")
  print(f"Columns: {df.columns.tolist()}")
  # Explore emission categories
  for col in df.select_dtypes(include='object').columns[:3]:
      print(f"\n{col} unique values: {df[col].nunique()}")
