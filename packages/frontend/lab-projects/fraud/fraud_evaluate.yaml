solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.ensemble import IsolationForest, RandomForestClassifier
  from sklearn.model_selection import train_test_split
  from sklearn.metrics import average_precision_score

  df = pd.read_csv(open_url("/datasets/creditcard_fraud.csv"))

  X = df.drop('Class', axis=1)
  y = df['Class']
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, stratify=y, random_state=42)

  # Random Forest (supervised)
  rf = RandomForestClassifier(n_estimators=100, class_weight='balanced', random_state=42)
  rf.fit(X_train, y_train)
  rf_proba = rf.predict_proba(X_test)[:, 1]
  rf_ap = average_precision_score(y_test, rf_proba)

  # Isolation Forest (unsupervised)
  iso = IsolationForest(contamination=0.005, random_state=42, n_estimators=100)
  iso.fit(X_train)
  iso_scores = -iso.decision_function(X_test)
  iso_ap = average_precision_score(y_test, iso_scores)

  print("Model Comparison (Average Precision):")
  print(f"Random Forest:    AP = {rf_ap:.3f}")
  print(f"Isolation Forest: AP = {iso_ap:.3f}")
  print(f"\nTotal fraud in test: {int(y_test.sum())}")
  rf_pred = rf.predict(X_test)
  detected = ((rf_pred == 1) & (y_test == 1)).sum()
  print(f"RF detected: {detected}/{int(y_test.sum())}")
