id: fraud_imbalance
name: "Handle Extreme Imbalance"
domain: fraud
project: "Fraud Detection"
step_number: 2
tier: 2
skills: [smote, undersampling, class_weight, imbalanced_learning]
language: python
dataset_url: "https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud"
description: "Apply techniques to handle the extreme class imbalance in fraud data — undersampling, SMOTE, and cost-sensitive learning."
prereq_cases: [fraud_explore]
learning_objectives:
  - Apply random undersampling and SMOTE
  - Use cost-sensitive learning with class weights
  - Compare strategies on evaluation metrics
sections:
  - title: "Sampling Strategies"
    content: "Balance the dataset using undersampling and oversampling."
    code: |
      from imblearn.over_sampling import SMOTE
      from imblearn.under_sampling import RandomUnderSampler
      from sklearn.model_selection import train_test_split

      X = df.drop('Class', axis=1)
      y = df['Class']
      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)

      # Undersampling
      rus = RandomUnderSampler(random_state=42)
      X_under, y_under = rus.fit_resample(X_train, y_train)
      print(f"Undersampled: {pd.Series(y_under).value_counts().to_dict()}")

      # SMOTE
      smote = SMOTE(random_state=42)
      X_smote, y_smote = smote.fit_resample(X_train, y_train)
      print(f"SMOTE: {pd.Series(y_smote).value_counts().to_dict()}")
    explanation: "Undersampling discards majority samples (fast but loses data). SMOTE creates synthetic minority samples (preserves data but may introduce noise). Both have tradeoffs."
  - title: "Cost-Sensitive Learning"
    content: "Instead of resampling, adjust the model to penalize fraud misclassification more."
    code: |
      from sklearn.ensemble import RandomForestClassifier
      from sklearn.metrics import classification_report

      # Balanced class weights: automatically adjusts for imbalance
      model_balanced = RandomForestClassifier(
          n_estimators=100, class_weight='balanced', random_state=42
      )
      model_balanced.fit(X_train, y_train)
      y_pred = model_balanced.predict(X_test)
      print(classification_report(y_test, y_pred))
    explanation: "class_weight='balanced' increases the penalty for misclassifying the minority class proportionally to the imbalance ratio. No resampling needed."
schema:
  - V1
  - V2
  - V3
  - V14
  - V17
  - Amount
  - Class
thought_process:
  - "Split data with stratification to preserve the fraud ratio"
  - "Apply undersampling to reduce majority class to match minority"
  - "Apply SMOTE to create synthetic fraud examples"
  - "Compare both approaches on the same test set"
  - "Try cost-sensitive learning (class_weight='balanced') as an alternative"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.model_selection import train_test_split

  df = pd.read_csv(open_url("/datasets/creditcard.csv"))
  X = df.drop('Class', axis=1)
  y = df['Class']
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)
  print(f"Original train: {y_train.value_counts().to_dict()}")
  print(f"Fraud rate: {y_train.mean()*100:.3f}%")
expected_output: |
  Original train:
  Fraud rate:
hints:
  - "For fraud, recall (catching fraud) is more important than precision"
  - "Try combining undersampling + SMOTE with imblearn's SMOTEENN"
  - "Always evaluate on the original imbalanced test set, never resampled"
visualizations:
  - title: "Class Distribution Before/After Resampling"
    code: |
      import matplotlib.pyplot as plt
      fig, axes = plt.subplots(1, 3, figsize=(15, 4))
      y_train.value_counts().plot(kind='bar', ax=axes[0], color=['steelblue', 'coral'])
      axes[0].set_title('Original')
      axes[0].set_xticklabels(['Legit', 'Fraud'], rotation=0)
      pd.Series(y_under).value_counts().plot(kind='bar', ax=axes[1], color=['steelblue', 'coral'])
      axes[1].set_title('Undersampled')
      axes[1].set_xticklabels(['Legit', 'Fraud'], rotation=0)
      pd.Series(y_smote).value_counts().plot(kind='bar', ax=axes[2], color=['steelblue', 'coral'])
      axes[2].set_title('SMOTE')
      axes[2].set_xticklabels(['Legit', 'Fraud'], rotation=0)
      plt.tight_layout()
      plt.show()
    description: "Shows how resampling balances the classes"
  - title: "Feature Distribution by Class"
    code: |
      import matplotlib.pyplot as plt
      fig, axes = plt.subplots(2, 2, figsize=(12, 8))
      for i, col in enumerate(['V1', 'V2', 'V3', 'Amount']):
        ax = axes[i//2, i%2]
        df[df['Class']==0][col].hist(bins=30, ax=ax, alpha=0.6, label='Legit', color='steelblue')
        df[df['Class']==1][col].hist(bins=30, ax=ax, alpha=0.6, label='Fraud', color='coral')
        ax.set_title(f'{col} Distribution')
        ax.legend()
      plt.tight_layout()
      plt.show()
    description: "Compares feature distributions between classes"
  - title: "PCA 2D Visualization"
    code: |
      import matplotlib.pyplot as plt
      from sklearn.decomposition import PCA
      pca = PCA(n_components=2)
      X_2d = pca.fit_transform(df[['V1','V2','V3','V4','V5']])
      plt.scatter(X_2d[:, 0], X_2d[:, 1], c=df['Class'], alpha=0.5, cmap='coolwarm')
      plt.colorbar(label='Class')
      plt.title('PCA Visualization of Fraud Data')
      plt.xlabel('PC1')
      plt.ylabel('PC2')
      plt.show()
    description: "Shows 2D projection of fraud data"
  - title: "Amount Distribution (Log Scale)"
    code: |
      import matplotlib.pyplot as plt
      import numpy as np
      fig, axes = plt.subplots(1, 2, figsize=(12, 4))
      df[df['Class']==0]['Amount'].hist(bins=30, ax=axes[0], alpha=0.6, label='Legit', color='steelblue')
      df[df['Class']==1]['Amount'].hist(bins=30, ax=axes[0], alpha=0.6, label='Fraud', color='coral')
      axes[0].set_title('Amount Distribution')
      axes[0].legend()
      np.log1p(df[df['Class']==0]['Amount']).hist(bins=30, ax=axes[1], alpha=0.6, label='Legit', color='steelblue')
      np.log1p(df[df['Class']==1]['Amount']).hist(bins=30, ax=axes[1], alpha=0.6, label='Fraud', color='coral')
      axes[1].set_title('Log(Amount) Distribution')
      axes[1].legend()
      plt.tight_layout()
      plt.show()
    description: "Log transform helps visualize skewed amount distributions"
