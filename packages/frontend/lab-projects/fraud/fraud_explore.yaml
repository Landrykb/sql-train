id: fraud_explore
name: "Explore Transaction Data"
domain: fraud
project: "Fraud Detection"
step_number: 1
tier: 1
skills: [pandas, eda, visualization, imbalanced_data]
language: python
dataset_url: "https://www.kaggle.com/datasets/mlg-ulb/creditcardfraud"
description: "Load credit card transaction data and understand the extreme class imbalance inherent in fraud detection."
prereq_cases: []
learning_objectives:
  - Understand fraud detection as an anomaly detection problem
  - Explore extreme class imbalance (fraud < 1% of transactions)
  - Identify statistical differences between fraud and legitimate transactions
sections:
  - title: "Load & Inspect"
    content: "Load the dataset and understand its structure."
    code: |
      from pyodide.http import open_url
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns

      df = pd.read_csv(open_url("/datasets/creditcard.csv"))
      print(f"Shape: {df.shape}")
      print(f"\nFraud distribution:")
      print(df['Class'].value_counts())
      print(f"\nFraud rate: {df['Class'].mean()*100:.3f}%")
    explanation: "Real fraud datasets are extremely imbalanced — often less than 0.5% fraud. This makes accuracy a useless metric (99.5% accuracy by always predicting 'not fraud')."
  - title: "Compare Fraud vs Legitimate"
    content: "Visualize how transaction features differ between classes."
    code: |
      fig, axes = plt.subplots(1, 3, figsize=(16, 4))

      df.groupby('Class')['Amount'].mean().plot(kind='bar', ax=axes[0], color=['steelblue', 'coral'])
      axes[0].set_title('Avg Amount by Class')

      axes[1].hist(df[df['Class']==0]['Amount'], bins=50, alpha=0.6, label='Legit', color='steelblue')
      axes[1].hist(df[df['Class']==1]['Amount'], bins=50, alpha=0.6, label='Fraud', color='coral')
      axes[1].set_title('Amount Distribution')
      axes[1].legend()

      sns.heatmap(df[['V1','V2','V3','V4','V5','Amount','Class']].corr(), annot=True, cmap='RdBu_r', ax=axes[2], fmt='.2f')
      axes[2].set_title('Feature Correlations')
      plt.tight_layout()
      plt.show()
    explanation: "PCA-transformed features (V1-V28) are already anonymized. Amount and Time are the only interpretable features. Fraud transactions often have different amount distributions."
schema:
  - Time
  - V1
  - V2
  - V3
  - V4
  - V5
  - V14
  - V17
  - Amount
  - Class
thought_process:
  - "Load the dataset and check its shape"
  - "Examine the fraud rate — expect extreme imbalance (<1%)"
  - "Compare average Amount between fraud and legitimate"
  - "Visualize feature correlations with the Class target"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np

  df = pd.read_csv(open_url("/datasets/creditcard.csv"))
  print(f"Shape: {df.shape}")
  print(f"Fraud rate: {df['Class'].mean()*100:.3f}%")
  print(f"Fraud count: {int(df['Class'].sum())}")
  print(f"Avg fraud amount: ${df[df['Class']==1]['Amount'].mean():.2f}")
  print(f"Avg legit amount: ${df[df['Class']==0]['Amount'].mean():.2f}")
expected_output: |
  Shape:
  Fraud rate:
  Fraud count:
hints:
  - "Features V1-V28 are PCA components — already preprocessed"
  - "Use log transform on Amount for better distribution"
  - "Try t-SNE for 2D visualization of fraud vs legitimate clusters"
