id: fraud_anomaly
name: "Anomaly Detection Models"
domain: fraud
project: "Fraud Detection"
step_number: 3
tier: 2
skills: [isolation_forest, autoencoder, anomaly_detection]
language: python
description: "Apply unsupervised anomaly detection methods — Isolation Forest, Local Outlier Factor, and Autoencoders — to detect fraudulent transactions."
prereq_cases: [fraud_imbalance]
learning_objectives:
  - Train Isolation Forest for anomaly detection
  - Use Local Outlier Factor for density-based detection
  - Build a simple autoencoder for reconstruction-based detection
sections:
  - title: "Isolation Forest"
    content: "Isolation Forest isolates anomalies by randomly partitioning data — outliers are isolated faster."
    code: |
      from sklearn.ensemble import IsolationForest
      from sklearn.metrics import classification_report

      iso = IsolationForest(contamination=0.002, random_state=42, n_estimators=200)
      y_pred_iso = iso.fit_predict(X_test)
      y_pred_iso = (y_pred_iso == -1).astype(int)  # -1 = anomaly → 1

      print("Isolation Forest:")
      print(classification_report(y_test, y_pred_iso))
    explanation: "contamination tells the model what fraction of data is anomalous. Set it close to the actual fraud rate. Isolation Forest works well without labels — truly unsupervised."
  - title: "Local Outlier Factor"
    content: "LOF compares local density of each point to its neighbors."
    code: |
      from sklearn.neighbors import LocalOutlierFactor

      lof = LocalOutlierFactor(n_neighbors=20, contamination=0.002, novelty=False)
      y_pred_lof = lof.fit_predict(X_test)
      y_pred_lof = (y_pred_lof == -1).astype(int)

      print("Local Outlier Factor:")
      print(classification_report(y_test, y_pred_lof))
    explanation: "LOF measures how isolated a point is compared to its local neighborhood. Points in sparse regions (low density) are flagged as outliers."
  - title: "Autoencoder (Deep Learning)"
    content: "Train a neural network to reconstruct normal transactions — high reconstruction error signals fraud."
    code: |
      from tensorflow.keras.models import Model
      from tensorflow.keras.layers import Input, Dense

      # Train only on legitimate transactions
      X_normal = X_train[y_train == 0]

      input_dim = X_normal.shape[1]
      inp = Input(shape=(input_dim,))
      encoded = Dense(14, activation='relu')(inp)
      encoded = Dense(7, activation='relu')(encoded)
      decoded = Dense(14, activation='relu')(encoded)
      decoded = Dense(input_dim, activation='linear')(decoded)

      autoencoder = Model(inp, decoded)
      autoencoder.compile(optimizer='adam', loss='mse')
      autoencoder.fit(X_normal, X_normal, epochs=20, batch_size=256, verbose=0)

      # Reconstruction error as anomaly score
      recon = autoencoder.predict(X_test, verbose=0)
      mse = np.mean((X_test.values - recon) ** 2, axis=1)
      threshold = np.percentile(mse, 99.8)
      y_pred_ae = (mse > threshold).astype(int)

      print("Autoencoder:")
      print(classification_report(y_test, y_pred_ae))
    explanation: "The autoencoder learns to reconstruct 'normal' patterns. Fraud transactions look different, so their reconstruction error is high. The threshold controls the sensitivity."
hints:
  - "Combine multiple anomaly detectors for ensemble detection"
  - "Use precision-recall AUC instead of ROC AUC for imbalanced data"
  - "Visualize anomaly scores with histograms to find natural thresholds"
