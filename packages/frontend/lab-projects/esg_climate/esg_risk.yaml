thought_process:
  - "Collapse panel to latest-year snapshot per company"
  - "Apply $75/ton shadow carbon price; compute cost / Revenue"
  - "Rank Industries by mean carbon impact"
  - "Build three climate scenarios combining carbon price, green premium, and physical damage"
  - "Report MarketCap-weighted portfolio impact per scenario"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  raw = pd.read_csv(open_url("/datasets/company_esg_financial_dataset.csv"))
  df = raw.sort_values('Year').groupby('CompanyID').tail(1).reset_index(drop=True)

  df['carbon_cost']       = df['CarbonEmissions'] * 75
  df['carbon_impact_pct'] = (df['carbon_cost'] / df['Revenue']) * 100

  print(f"Shape: {df.shape}")
  print(f"Top 3 Industries by carbon impact:")
  print(df.groupby('Industry')['carbon_impact_pct'].mean().nlargest(3).round(2))
expected_output: |
  Shape:
  Top 3 Industries by carbon impact:
