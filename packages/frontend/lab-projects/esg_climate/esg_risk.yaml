      df['carbon_cost'] = df['co2_emissions_mt'] * 75  # $75/ton carbon price
      df['carbon_impact_pct'] = (df['carbon_cost'] / df['revenue']) * 100

      sector_impact = df.groupby('sector')['carbon_impact_pct'].mean().sort_values(ascending=False)
      sector_impact.plot(kind='barh', figsize=(10, 6), color='coral')
      plt.title('Revenue Impact of $75/ton Carbon Price by Sector')
      plt.xlabel('Revenue Impact (%)')
      plt.tight_layout()
