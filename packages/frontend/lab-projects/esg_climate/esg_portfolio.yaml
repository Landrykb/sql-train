thought_process:
  - "Collapse panel to latest-year snapshot"
  - "Derive market-cap weights and ESG_Overall weights"
  - "Blend both at 50/50 to form an ESG-tilted portfolio"
  - "Compare tilted vs market-cap return using GrowthRate as proxy"
  - "Produce a 3-line TCFD-style climate risk report"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  raw = pd.read_csv(open_url("/datasets/company_esg_financial_dataset.csv"))
  df = raw.sort_values('Year').groupby('CompanyID').tail(1).reset_index(drop=True)

  df['esg_weight']    = df['ESG_Overall'] / df['ESG_Overall'].sum()
  df['market_weight'] = df['MarketCap']   / df['MarketCap'].sum()
  df['tilt']          = 0.5 * df['market_weight'] + 0.5 * df['esg_weight']
  df['tilt']          = df['tilt'] / df['tilt'].sum()

  esg_return    = (df['tilt']          * df['GrowthRate']).sum()
  market_return = (df['market_weight'] * df['GrowthRate']).sum()
  print(f"ESG Portfolio    : {esg_return:.2f}%")
  print(f"Market Portfolio : {market_return:.2f}%")
  print(f"ESG Premium      : {esg_return - market_return:+.2f} pp")
expected_output: |
  ESG Portfolio    :
  Market Portfolio :
  ESG Premium      :
