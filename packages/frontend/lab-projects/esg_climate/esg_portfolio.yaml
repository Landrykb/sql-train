id: esg_portfolio
name: "ESG-Integrated Portfolio"
domain: esg_climate
project: "ESG & Climate Risk Analytics"
step_number: 4
tier: 3
skills: [portfolio_optimization, esg_integration, visualization, reporting]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/shriyashjagtap/esg-and-financial-performance-dataset"
description: "Construct an ESG-tilted portfolio on top of the Kaggle ESG & Financial Performance panel — compare ESG vs market-cap weighting and produce a TCFD-style climate summary."
prereq_cases: [esg_risk]
learning_objectives:
  - Build ESG-tilted weights from ESG_Overall and MarketCap
  - Compare ESG vs conventional portfolio return and carbon intensity
  - Generate a short TCFD-aligned climate risk report
sections:
  - title: "Load Latest-Year Snapshot & Derive Return Proxy"
    content: "We use the Kaggle panel's annual GrowthRate as a per-company return proxy (the dataset doesn't include stock returns)."
    code: |
      from pyodide.http import open_url
      import pandas as pd

      raw = pd.read_csv(open_url("/datasets/company_esg_financial_dataset.csv"))
      # Latest-year snapshot gives a single Revenue / MarketCap / GrowthRate per issuer
      df = raw.sort_values('Year').groupby('CompanyID').tail(1).reset_index(drop=True)
      print(f"Issuers: {len(df)}, Industries: {df['Industry'].nunique()}")
      print(df[['CompanyName', 'Industry', 'MarketCap', 'ESG_Overall', 'GrowthRate']].head())
    r_code: |
      library(dplyr)

      raw <- read.csv('company_esg_financial_dataset.csv')
      df <- raw %>% arrange(Year) %>% group_by(CompanyID) %>% slice_tail(n = 1) %>% ungroup()
      cat(sprintf("Issuers: %d\n", nrow(df)))
      head(df[, c('CompanyName','Industry','MarketCap','ESG_Overall','GrowthRate')])
    explanation: "The Kaggle dataset reports fundamentals (Revenue, MarketCap, GrowthRate) rather than stock prices, so we use GrowthRate as the return proxy. In production you would merge in actual equity returns."
  - title: "Build ESG-Tilted Weights"
    content: "A 50/50 blend of market-cap weighting and ESG_Overall weighting."
    code: |
      df['esg_weight']    = df['ESG_Overall'] / df['ESG_Overall'].sum()
      df['market_weight'] = df['MarketCap']   / df['MarketCap'].sum()
      df['tilt']          = 0.5 * df['market_weight'] + 0.5 * df['esg_weight']
      df['tilt']          = df['tilt'] / df['tilt'].sum()

      esg_return    = (df['tilt']          * df['GrowthRate']).sum()
      market_return = (df['market_weight'] * df['GrowthRate']).sum()
      print(f"ESG-Tilted Portfolio GrowthRate : {esg_return:.2f}%")
      print(f"Market-Cap Portfolio GrowthRate : {market_return:.2f}%")
      print(f"ESG Premium / (Discount)        : {esg_return - market_return:+.2f} pp")
    r_code: |
      df$esg_weight    <- df$ESG_Overall / sum(df$ESG_Overall, na.rm = TRUE)
      df$market_weight <- df$MarketCap   / sum(df$MarketCap,   na.rm = TRUE)
      df$tilt          <- 0.5 * df$market_weight + 0.5 * df$esg_weight
      df$tilt          <- df$tilt / sum(df$tilt)

      esg_return    <- sum(df$tilt          * df$GrowthRate, na.rm = TRUE)
      market_return <- sum(df$market_weight * df$GrowthRate, na.rm = TRUE)
      cat(sprintf("ESG-Tilted  GrowthRate: %.2f%%\n", esg_return))
      cat(sprintf("Market-Cap  GrowthRate: %.2f%%\n", market_return))
      cat(sprintf("ESG Premium          : %+.2f pp\n", esg_return - market_return))
    explanation: "A 50/50 tilt overweights high-ESG companies while still reflecting market size. The ESG premium varies by period and methodology — many studies find a risk-adjusted benefit rather than a raw-return one."
  - title: "Climate Risk Dashboard"
    content: "Summarise the portfolio's ESG, carbon intensity, and high-carbon-industry exposure in one short report."
    code: |
      high_carbon_industries = {'Energy', 'Utilities', 'Materials'}
      carbon_intensity = df['CarbonEmissions'] / df['Revenue']

      weighted_esg         = (df['tilt'] * df['ESG_Overall']).sum()
      weighted_intensity   = (df['tilt'] * carbon_intensity).sum()
      high_carbon_share    = df.loc[df['Industry'].isin(high_carbon_industries), 'tilt'].sum() * 100

      print("=== PORTFOLIO CLIMATE RISK REPORT ===")
      print(f"Weighted Avg ESG_Overall       : {weighted_esg:.1f}")
      print(f"Weighted Avg Carbon Intensity  : {weighted_intensity:.4f}  (CarbonEmissions / Revenue)")
      print(f"High-Carbon Industry Share     : {high_carbon_share:.1f}%")
    r_code: |
      high_carbon_industries <- c('Energy','Utilities','Materials')
      carbon_intensity <- df$CarbonEmissions / df$Revenue

      weighted_esg       <- sum(df$tilt * df$ESG_Overall, na.rm = TRUE)
      weighted_intensity <- sum(df$tilt * carbon_intensity, na.rm = TRUE)
      high_carbon_share  <- sum(df$tilt[df$Industry %in% high_carbon_industries], na.rm = TRUE) * 100

      cat("=== PORTFOLIO CLIMATE RISK REPORT ===\n")
      cat(sprintf("Weighted Avg ESG_Overall      : %.1f\n", weighted_esg))
      cat(sprintf("Weighted Avg Carbon Intensity : %.4f\n", weighted_intensity))
      cat(sprintf("High-Carbon Industry Share    : %.1f%%\n", high_carbon_share))
    explanation: "This mini report follows the TCFD (Task Force on Climate-related Financial Disclosures) structure — an ESG quality indicator, a carbon-intensity metric, and an exposure-to-high-carbon-sectors measure."
