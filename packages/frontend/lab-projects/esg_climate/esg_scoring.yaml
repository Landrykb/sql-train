thought_process:
  - "Collapse the panel to a single latest-year row per company"
  - "Rescale the three Kaggle pillar scores to 0-1 with MinMaxScaler"
  - "Compute a weighted composite with custom E/S/G weights"
  - "Calculate percentile rank for interpretability"
  - "Compute industry-relative z-scores and map them to CCC-to-AA letter ratings"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  from sklearn.preprocessing import MinMaxScaler

  raw = pd.read_csv(open_url("/datasets/company_esg_financial_dataset.csv"))
  df = raw.sort_values('Year').groupby('CompanyID').tail(1).reset_index(drop=True)

  pillars = ['ESG_Environmental', 'ESG_Social', 'ESG_Governance']
  df[pillars] = MinMaxScaler().fit_transform(df[pillars])
  df['custom_esg'] = df['ESG_Environmental']*0.4 + df['ESG_Social']*0.3 + df['ESG_Governance']*0.3
  df['esg_percentile'] = df['custom_esg'].rank(pct=True) * 100

  print(f"Shape: {df.shape}")
  print(f"Columns (subset): {[c for c in df.columns if c.startswith('ESG') or c in ('Industry','custom_esg','esg_percentile')]}")
  print(f"\nTop 3 by custom_esg:\n{df.nlargest(3, 'custom_esg')[['CompanyName','Industry','custom_esg']].to_string(index=False)}")
