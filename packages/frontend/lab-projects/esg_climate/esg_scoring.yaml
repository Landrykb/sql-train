id: esg_scoring
name: "Build ESG Scoring Model"
domain: esg_climate
project: "ESG & Climate Risk Analytics"
step_number: 2
tier: 2
skills: [scoring, weighting, normalization, sklearn]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/shriyashjagtap/esg-and-financial-performance-dataset"
description: "Create a custom ESG scoring methodology on top of the Kaggle ESG & Financial Performance dataset — weighted pillars, sector-adjusted benchmarks, and percentile rankings."
prereq_cases: [esg_explore]
learning_objectives:
  - Normalize ESG pillar scores across companies
  - Build a weighted composite score
  - Produce sector-adjusted (industry-relative) ratings
sections:
  - title: "Load & Collapse to Latest Year"
    content: "The Kaggle dataset has 11 years per company — collapse to the most recent year for a cross-sectional scoring exercise."
    code: |
      from pyodide.http import open_url
      import pandas as pd

      raw = pd.read_csv(open_url("/datasets/company_esg_financial_dataset.csv"))
      df = raw.sort_values('Year').groupby('CompanyID').tail(1).reset_index(drop=True)
      print(f"Companies: {len(df)}")
      print(df[['CompanyName', 'Industry', 'ESG_Environmental', 'ESG_Social', 'ESG_Governance']].head())
    r_code: |
      library(dplyr)

      raw <- read.csv('company_esg_financial_dataset.csv')
      df <- raw %>% arrange(Year) %>% group_by(CompanyID) %>% slice_tail(n = 1) %>% ungroup()
      cat(sprintf("Companies: %d\n", nrow(df)))
      head(df[, c('CompanyName','Industry','ESG_Environmental','ESG_Social','ESG_Governance')])
    explanation: "The dataset is a panel (1,000 companies × 11 years). For cross-sectional scoring we collapse to the latest available year per company."
  - title: "Normalize & Weight Pillars"
    content: "The Kaggle pillars are already on a 0-100 scale. We rescale to 0-1 with MinMaxScaler for transparency, then apply weights (E=40%, S=30%, G=30%) to produce a custom composite."
    code: |
      from sklearn.preprocessing import MinMaxScaler

      pillars = ['ESG_Environmental', 'ESG_Social', 'ESG_Governance']
      scaler = MinMaxScaler()
      df[pillars] = scaler.fit_transform(df[pillars])

      weights = {'ESG_Environmental': 0.4, 'ESG_Social': 0.3, 'ESG_Governance': 0.3}
      df['custom_esg'] = sum(df[col] * w for col, w in weights.items())
      df['esg_percentile'] = df['custom_esg'].rank(pct=True) * 100

      top5 = df.nlargest(5, 'custom_esg')[['CompanyName', 'Industry', 'custom_esg', 'esg_percentile']]
      print("Top 5 ESG companies:")
      print(top5.to_string(index=False))
    r_code: |
      library(dplyr)

      pillars <- c('ESG_Environmental', 'ESG_Social', 'ESG_Governance')
      for (col in pillars) {
        rng <- range(df[[col]], na.rm = TRUE)
        df[[col]] <- (df[[col]] - rng[1]) / (rng[2] - rng[1])
      }

      df$custom_esg <- df$ESG_Environmental * 0.4 + df$ESG_Social * 0.3 + df$ESG_Governance * 0.3
      df$esg_percentile <- rank(df$custom_esg) / nrow(df) * 100

      top5 <- df %>% arrange(desc(custom_esg)) %>% head(5) %>%
        select(CompanyName, Industry, custom_esg, esg_percentile)
      print(top5)
    explanation: "Weighting E higher (40%) reflects the growing regulatory importance of climate. MinMaxScaler keeps all pillars on a comparable 0-1 scale; percentile ranking makes the composite interpretable to non-specialists."
  - title: "Industry-Adjusted Benchmarks"
    content: "Compare each company to its Industry peers, not the universe, so an energy company with a 55 E-score isn't unfairly penalised vs. a software firm with 85."
    code: |
      df['industry_esg_mean'] = df.groupby('Industry')['custom_esg'].transform('mean')
      df['industry_esg_std']  = df.groupby('Industry')['custom_esg'].transform('std')
      df['esg_z_score'] = (df['custom_esg'] - df['industry_esg_mean']) / df['industry_esg_std']

      df['esg_rating'] = pd.cut(
          df['esg_z_score'],
          bins=[-float('inf'), -1, -0.5, 0.5, 1, float('inf')],
          labels=['CCC', 'B', 'BB', 'A', 'AA']
      )

      print(df['esg_rating'].value_counts().sort_index())
    r_code: |
      library(dplyr)

      df <- df %>%
        group_by(Industry) %>%
        mutate(
          industry_esg_mean = mean(custom_esg),
          industry_esg_std  = sd(custom_esg),
          esg_z_score = (custom_esg - industry_esg_mean) / industry_esg_std,
          esg_rating = cut(esg_z_score,
            breaks = c(-Inf, -1, -0.5, 0.5, 1, Inf),
            labels = c('CCC', 'B', 'BB', 'A', 'AA'))
        ) %>%
        ungroup()

      table(df$esg_rating)
    explanation: "Industry-relative z-scores mirror how MSCI and Sustainalytics actually rate companies — you are compared to peers in the same sector, not to the whole universe."
schema:
