solution_code: |
  import kagglehub
  import os
  import pandas as pd

  path = kagglehub.dataset_download("maharshipandya/-spotify-tracks-dataset")
  csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
  df = pd.read_csv(os.path.join(path, csv_files[0]))
  print(f"Shape: {df.shape}")
  print(f"Popularity stats:\n{df['popularity'].describe()}")
  print(f"\nTop 5 genres by avg popularity:\n{df.groupby('track_genre')['popularity'].mean().nlargest(5)}")
expected_output: |
  Shape:
  Popularity stats:
hints:
