id: music_explore
name: "Explore Spotify Data"
domain: music
project: "Spotify Music Analysis"
step_number: 1
tier: 1
skills: [pandas, eda, visualization]
language: python
dataset_url: "https://www.kaggle.com/datasets/maharshipandya/-spotify-tracks-dataset"
description: "Load the Spotify tracks dataset and explore audio features, popularity patterns, and genre distributions."
prereq_cases: []
learning_objectives:
  - Load and inspect the Spotify dataset
  - Understand audio features (danceability, energy, valence, tempo)
  - Visualize popularity distributions across genres
sections:
  - title: "Load & Overview"
    content: "Load the dataset and understand its structure."
    code: |
      from pyodide.http import open_url
      import pandas as pd
      import matplotlib.pyplot as plt
      import seaborn as sns

      df = pd.read_csv(open_url("/datasets/dataset.csv"))
      print(f"Shape: {df.shape}")
      print(f"\nAudio features: {['danceability', 'energy', 'loudness', 'speechiness', 'acousticness', 'instrumentalness', 'liveness', 'valence', 'tempo']}")
      df.head()
    explanation: "Spotify's audio features are numerical scores (0-1 scale for most). These make excellent ML features because they quantify subjective musical qualities."
  - title: "Popularity Distribution"
    content: "Understand how popularity is distributed and what makes a hit."
    code: |
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))

      axes[0].hist(df['popularity'], bins=50, color='#1DB954', edgecolor='white')
      axes[0].set_title('Popularity Distribution')
      axes[0].set_xlabel('Popularity Score')

      top_genres = df.groupby('track_genre')['popularity'].mean().nlargest(15)
      top_genres.plot(kind='barh', ax=axes[1], color='#1DB954')
      axes[1].set_title('Top 15 Genres by Avg Popularity')
      plt.tight_layout()
      plt.show()
    explanation: "Most tracks have low popularity — the music industry follows a power law. Understanding genre trends helps focus the analysis."
schema:
  - track_id
  - artists
  - album_name
  - track_name
  - popularity
  - duration_ms
  - danceability
  - energy
  - loudness
  - speechiness
  - acousticness
  - instrumentalness
  - liveness
  - valence
  - tempo
  - track_genre
thought_process:
  - "Load the dataset and check its shape and column names"
  - "Understand the audio feature scales (most are 0-1)"
  - "Check the popularity distribution — is it normal or skewed?"
  - "Identify top genres by average popularity"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  df = pd.read_csv(open_url("/datasets/dataset.csv"))
  print(f"Shape: {df.shape}")
  print(f"Popularity stats:\n{df['popularity'].describe()}")
  print(f"\nTop 5 genres by avg popularity:\n{df.groupby('track_genre')['popularity'].mean().nlargest(5)}")
expected_output: |
  Shape:
  Popularity stats:
hints:
  - "Use df.describe() for statistical overview of audio features"
  - "Try sns.pairplot for relationships between audio features"
  - "Filter to popular tracks (popularity > 70) for focused analysis"
visualizations:
  - title: "Popularity Distribution"
    code: |
      import matplotlib.pyplot as plt
      df['popularity'].hist(bins=50, color='#1DB954', edgecolor='white')
      plt.title('Popularity Distribution')
      plt.xlabel('Popularity Score')
      plt.ylabel('Count')
      plt.show()
    description: "Shows the distribution of track popularity scores"
  - title: "Top Genres by Popularity"
    code: |
      import matplotlib.pyplot as plt
      top_genres = df.groupby('track_genre')['popularity'].mean().nlargest(15)
      top_genres.plot(kind='barh', color='#1DB954')
      plt.title('Top 15 Genres by Avg Popularity')
      plt.xlabel('Average Popularity')
      plt.tight_layout()
      plt.show()
    description: "Shows which genres have the highest average popularity"
  - title: "Audio Features Correlation Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      audio_features = ['danceability', 'energy', 'loudness', 'speechiness', 'acousticness', 'instrumentalness', 'liveness', 'valence', 'tempo']
      sns.heatmap(df[audio_features].corr(), annot=True, cmap='coolwarm', fmt='.2f')
      plt.title('Audio Features Correlation Matrix')
      plt.tight_layout()
      plt.show()
    description: "Shows correlations between audio features"
  - title: "Danceability vs Energy Scatter"
    code: |
      import matplotlib.pyplot as plt
      plt.scatter(df['danceability'], df['energy'], alpha=0.5, c=df['popularity'], cmap='viridis')
      plt.xlabel('Danceability')
      plt.ylabel('Energy')
      plt.title('Danceability vs Energy (colored by popularity)')
      plt.colorbar(label='Popularity')
      plt.show()
    description: "Shows relationship between danceability and energy"
