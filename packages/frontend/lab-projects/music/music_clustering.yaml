id: music_clustering
name: "Cluster Songs by Audio Profile"
domain: music
project: "Spotify Music Analysis"
step_number: 3
tier: 2
skills: [clustering, kmeans, pca, unsupervised_learning]
language: python
dataset_url: "https://www.kaggle.com/datasets/maharshipandya/-spotify-tracks-dataset"
description: "Use K-Means clustering and PCA to discover natural groupings in songs based on their audio features."
prereq_cases: [music_eda]
learning_objectives:
  - Apply K-Means clustering to audio features
  - Use the elbow method to choose optimal K
  - Visualize clusters with PCA dimensionality reduction
sections:
  - title: "K-Means Clustering"
    content: "Group songs into clusters based on audio similarity."
    code: |
      from sklearn.cluster import KMeans
      from sklearn.preprocessing import StandardScaler

      features = ['danceability', 'energy', 'acousticness', 'valence',
                  'instrumentalness', 'speechiness', 'tempo', 'loudness']
      X = StandardScaler().fit_transform(df[features])

      inertias = []
      for k in range(2, 11):
          km = KMeans(n_clusters=k, random_state=42, n_init=10)
          km.fit(X)
          inertias.append(km.inertia_)

      plt.plot(range(2, 11), inertias, 'bo-')
      plt.xlabel('Number of Clusters (K)')
      plt.ylabel('Inertia')
      plt.title('Elbow Method')
      plt.show()
    explanation: "The elbow point where inertia decrease slows down suggests the optimal K. Typically 4-6 clusters work well for music data."
  - title: "Visualize with PCA"
    content: "Reduce dimensions to 2D for visualization."
    code: |
      from sklearn.decomposition import PCA

      km = KMeans(n_clusters=5, random_state=42, n_init=10)
      df['cluster'] = km.fit_predict(X)

      pca = PCA(n_components=2)
      X_2d = pca.fit_transform(X)

      plt.figure(figsize=(10, 7))
      scatter = plt.scatter(X_2d[:, 0], X_2d[:, 1], c=df['cluster'],
                           cmap='Set2', alpha=0.4, s=5)
      plt.colorbar(scatter, label='Cluster')
      plt.title(f'Song Clusters (PCA — {pca.explained_variance_ratio_.sum():.0%} variance)')
      plt.xlabel('PC1')
      plt.ylabel('PC2')
      plt.show()
    explanation: "PCA compresses 8 audio dimensions into 2 for plotting. Each cluster represents a distinct 'mood' or 'vibe' — energetic dance, calm acoustic, instrumental, etc."
schema:
  - danceability
  - energy
  - acousticness
  - valence
  - instrumentalness
