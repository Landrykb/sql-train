solution_code: |
  import kagglehub
  import os
  import pandas as pd
  import numpy as np

  path = kagglehub.dataset_download("szrlee/stock-time-series-20050101-to-20171231")
  csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
  print("Available files:", csv_files[:5])
  # Load first stock file as example
