thought_process:
  - "Calculate annualized mean returns and covariance matrix"
  - "Define a portfolio_metrics function for any weight vector"
  - "Generate 5000 random portfolios on the efficient frontier"
  - "Find the max Sharpe ratio portfolio (optimal)"
  - "Visualize the frontier colored by Sharpe ratio"
solution_code: |
  from pyodide.http import open_url
  import numpy as np
  import pandas as pd

  raw = pd.read_csv(open_url("/datasets/stock_prices.csv"))
  prices = raw.pivot_table(index='Date', columns='ticker', values='Close')
  returns = prices.pct_change().dropna()
  mean_returns = returns.mean() * 252
  cov_matrix = returns.cov() * 252
  n = len(returns.columns)
  eq_weights = np.ones(n) / n
  ret = np.dot(eq_weights, mean_returns)
  vol = np.sqrt(np.dot(eq_weights.T, np.dot(cov_matrix, eq_weights)))
  sharpe = ret / vol
  print(f"Equal-Weight Portfolio:")
  print(f"  Return: {ret*100:.1f}%, Volatility: {vol*100:.1f}%, Sharpe: {sharpe:.2f}")
expected_output: |
  Equal-Weight Portfolio:
