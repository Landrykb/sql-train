language: python
dataset_url: "https://www.kaggle.com/datasets/szrlee/stock-time-series-20050101-to-20171231"
description: "Implement Modern Portfolio Theory — construct the efficient frontier, find the optimal portfolio, and understand the risk-return tradeoff."
