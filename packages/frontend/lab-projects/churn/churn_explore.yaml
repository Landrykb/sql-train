id: churn_explore
name: "Explore Churn Data"
domain: churn
project: "Customer Churn Prediction"
step_number: 1
tier: 1
skills: [pandas, eda, visualization, business_understanding]
language: python
dataset_url: "https://www.kaggle.com/datasets/blastchar/telco-customer-churn"
description: "Load the Telco customer churn dataset and understand which customer attributes correlate with churning."
prereq_cases: []
learning_objectives:
  - Understand the business context of churn prediction
  - Explore class imbalance in the target variable
  - Identify key features correlated with churn
sections:
  - title: "Load & Inspect"
    content: "Load the dataset and understand its structure."
    code: |
      import pandas as pd
      import seaborn as sns
      import matplotlib.pyplot as plt

      # Generate synthetic telco churn data (real data: see Dataset Source above)
      import numpy as np
      np.random.seed(42)
      n = 500
      df = pd.DataFrame({
          'customerID': [f'C{i:04d}' for i in range(n)],
          'tenure': np.random.randint(0, 72, n),
          'MonthlyCharges': np.round(np.random.uniform(18, 118, n), 2),
          'TotalCharges': np.round(np.random.uniform(18, 8000, n), 2),
          'Contract': np.random.choice(['Month-to-month','One year','Two year'], n, p=[0.55,0.25,0.20]),
          'InternetService': np.random.choice(['DSL','Fiber optic','No'], n, p=[0.35,0.45,0.20]),
          'Churn': np.random.choice(['Yes','No'], n, p=[0.27,0.73]),
      })
      print(f"Shape: {df.shape}")
      print(f"\nChurn distribution:\n{df['Churn'].value_counts(normalize=True).round(3)}")
      df.head()
    explanation: "Churn datasets are typically imbalanced — fewer churners than non-churners. Understanding this ratio is critical for choosing the right evaluation metric."
  - title: "Visualize Key Patterns"
    content: "Explore which customer attributes differ between churners and non-churners."
    code: |
      fig, axes = plt.subplots(2, 2, figsize=(14, 10))

      df.groupby('Churn')['tenure'].plot(kind='hist', ax=axes[0,0], alpha=0.6, legend=True)
      axes[0,0].set_title('Tenure Distribution by Churn')

      df.groupby('Churn')['MonthlyCharges'].plot(kind='hist', ax=axes[0,1], alpha=0.6, legend=True)
      axes[0,1].set_title('Monthly Charges by Churn')

      pd.crosstab(df['Contract'], df['Churn'], normalize='index').plot(kind='bar', ax=axes[1,0])
      axes[1,0].set_title('Churn Rate by Contract Type')

      pd.crosstab(df['InternetService'], df['Churn'], normalize='index').plot(kind='bar', ax=axes[1,1])
      axes[1,1].set_title('Churn Rate by Internet Service')

      plt.tight_layout()
      plt.show()
    explanation: "Short tenure + high monthly charges + month-to-month contracts = high churn risk. These patterns guide feature engineering and business interventions."
