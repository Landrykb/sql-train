id: churn_features
name: "Feature Engineering for Churn"
domain: churn
project: "Customer Churn Prediction"
step_number: 2
tier: 1
skills: [feature_engineering, encoding, pandas, sklearn]
language: python
dataset_url: "https://www.kaggle.com/datasets/blastchar/telco-customer-churn"
description: "Transform raw customer data into ML-ready features — encode categoricals, create interaction terms, and handle class imbalance."
prereq_cases: [churn_explore]
learning_objectives:
  - Encode categorical variables (label + one-hot)
  - Handle class imbalance with SMOTE
  - Create business-meaningful features
sections:
  - title: "Encode & Transform"
    content: "Convert all categorical columns to numerical representations."
    code: |
      from sklearn.preprocessing import LabelEncoder
      import pandas as pd

      df['TotalCharges'] = pd.to_numeric(df['TotalCharges'], errors='coerce').fillna(0)
      df['Churn_binary'] = (df['Churn'] == 'Yes').astype(int)

      cat_cols = df.select_dtypes(include='object').columns.drop(['customerID', 'Churn'])
      df_encoded = pd.get_dummies(df.drop(['customerID', 'Churn'], axis=1), columns=cat_cols, drop_first=True)
      print(f"Features: {df_encoded.shape[1]}")
    explanation: "One-hot encoding with drop_first avoids multicollinearity. TotalCharges often has whitespace entries that need numeric conversion."
  - title: "Handle Class Imbalance"
    content: "Use SMOTE to oversample the minority class (churners)."
    code: |
      from imblearn.over_sampling import SMOTE
      from sklearn.model_selection import train_test_split

      X = df_encoded.drop('Churn_binary', axis=1)
      y = df_encoded['Churn_binary']

      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)

      smote = SMOTE(random_state=42)
      X_train_bal, y_train_bal = smote.fit_resample(X_train, y_train)
      print(f"Before SMOTE: {y_train.value_counts().to_dict()}")
      print(f"After SMOTE:  {pd.Series(y_train_bal).value_counts().to_dict()}")
    explanation: "SMOTE creates synthetic minority samples by interpolating between existing ones. Only apply to training data — never the test set."
schema:
  - tenure
  - MonthlyCharges
  - TotalCharges
  - Churn_binary
  - Contract_One year
  - Contract_Two year
  - InternetService_Fiber optic
  - InternetService_No
thought_process:
  - "Convert TotalCharges to numeric (it has whitespace errors)"
  - "Create binary target: Churn_binary from 'Yes'/'No'"
  - "One-hot encode all categorical columns with drop_first"
  - "Split into train/test with stratification to preserve churn ratio"
  - "Apply SMOTE only to training data to balance classes"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.model_selection import train_test_split

  df = pd.read_csv(open_url("/datasets/WA_Fn-UseC_-Telco-Customer-Churn.csv"))
  df['TotalCharges'] = pd.to_numeric(df['TotalCharges'], errors='coerce')
  df.dropna(inplace=True)
  df['Churn_binary'] = (df['Churn'] == 'Yes').astype(int)
  cat_cols = df.select_dtypes(include='object').columns.drop(['customerID', 'Churn'])
  df_encoded = pd.get_dummies(df.drop(['customerID', 'Churn'], axis=1), columns=cat_cols, drop_first=True)
  X = df_encoded.drop('Churn_binary', axis=1)
  y = df_encoded['Churn_binary']
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)
  print(f"Features: {X.shape[1]}")
  print(f"Train churn rate: {y_train.mean()*100:.1f}%")
expected_output: |
  Features:
  Train churn rate:
hints:
  - "Try creating a 'charge_per_month' = TotalCharges / tenure feature"
  - "stratify=y ensures train/test have the same churn ratio"
  - "Consider class_weight='balanced' as an alternative to SMOTE"
visualizations:
  - title: "Class Distribution Before/After SMOTE"
    code: |
      import matplotlib.pyplot as plt
      fig, axes = plt.subplots(1, 2, figsize=(12, 4))
      y_train.value_counts().plot(kind='bar', ax=axes[0], color=['steelblue', 'coral'])
      axes[0].set_title('Before SMOTE')
      axes[0].set_xticklabels(['No Churn', 'Churn'], rotation=0)
      pd.Series(y_train_bal).value_counts().plot(kind='bar', ax=axes[1], color=['steelblue', 'coral'])
      axes[1].set_title('After SMOTE')
      axes[1].set_xticklabels(['No Churn', 'Churn'], rotation=0)
      plt.tight_layout()
      plt.show()
    description: "Shows how SMOTE balances the classes"
  - title: "Feature Correlation with Churn"
    code: |
      import matplotlib.pyplot as plt
      import seaborn as sns
      correlations = df_encoded.corr()['Churn_binary'].abs().sort_values(ascending=False).head(10)
      correlations.plot(kind='barh', color='steelblue')
      plt.title('Top 10 Features Correlated with Churn')
      plt.xlabel('Absolute Correlation')
      plt.tight_layout()
      plt.show()
    description: "Shows which features correlate most with churn"
  - title: "TotalCharges vs MonthlyCharges Scatter"
    code: |
      import matplotlib.pyplot as plt
      plt.scatter(df['tenure'], df['MonthlyCharges'], alpha=0.5, c=df['Churn_binary'], cmap='coolwarm')
      plt.xlabel('Tenure (months)')
      plt.ylabel('Monthly Charges ($)')
      plt.title('Tenure vs Monthly Charges by Churn')
      plt.colorbar(label='Churn')
      plt.show()
    description: "Shows relationship between tenure, charges, and churn"
  - title: "Feature Importance via Correlation"
    code: |
      import matplotlib.pyplot as plt
      top_features = correlations.head(10)
      top_features.plot(kind='barh', color='coral')
      plt.title('Feature Importance (Correlation with Churn)')
      plt.xlabel('Correlation Coefficient')
      plt.tight_layout()
      plt.show()
    description: "Ranks features by their correlation strength"
