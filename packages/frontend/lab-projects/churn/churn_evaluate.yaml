sections:
  - title: "ROC Curve & AUC"
    content: "Visualize the tradeoff between true positive and false positive rates."
    code: |
      from sklearn.metrics import roc_curve, roc_auc_score

      y_proba = best.predict_proba(X_test)[:, 1]
      fpr, tpr, thresholds = roc_curve(y_test, y_proba)
      auc = roc_auc_score(y_test, y_proba)

      plt.figure(figsize=(8, 6))
      plt.plot(fpr, tpr, color='coral', linewidth=2, label=f'AUC = {auc:.3f}')
      plt.plot([0, 1], [0, 1], 'k--', alpha=0.3)
      plt.xlabel('False Positive Rate')
      plt.ylabel('True Positive Rate')
      plt.title('ROC Curve — Churn Prediction')
      plt.legend()
      plt.show()
    explanation: "AUC of 0.5 = random guessing, 1.0 = perfect. Above 0.8 is generally good for churn. The curve shows how adjusting the threshold trades off precision and recall."
  - title: "Business Impact Analysis"
    content: "Estimate the financial value of catching churners early."
    code: |
      from sklearn.metrics import confusion_matrix

      y_pred = best.predict(X_test)
      tn, fp, fn, tp = confusion_matrix(y_test, y_pred).ravel()

      avg_revenue = df['MonthlyCharges'].mean() * 12
      saved = tp * avg_revenue * 0.3  # assume 30% retention rate with intervention
      cost = fp * 50  # cost of unnecessary retention offer

      print(f"True Positives (caught churners): {tp}")
      print(f"False Negatives (missed churners): {fn}")
      print(f"Estimated annual revenue saved: ${saved:,.0f}")
      print(f"Cost of false alarms: ${cost:,.0f}")
      print(f"Net value: ${saved - cost:,.0f}")
    explanation: "Translating ML metrics into dollars makes the model's value clear to stakeholders. This analysis justifies the project and guides threshold selection."
schema:
  - tenure
  - MonthlyCharges
  - TotalCharges
  - Churn_binary
thought_process:
  - "Plot ROC curve and compute AUC to measure overall discrimination ability"
  - "Examine the confusion matrix for TP, TN, FP, FN counts"
  - "Calculate business impact: revenue saved by catching churners early"
  - "Estimate cost of false alarms vs value of true positives"
  - "Recommend optimal threshold based on business cost trade-offs"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.model_selection import train_test_split
  from sklearn.ensemble import GradientBoostingClassifier
  from sklearn.metrics import roc_auc_score, confusion_matrix

  df = pd.read_csv(open_url("/datasets/telco_churn.csv"))
  df['TotalCharges'] = pd.to_numeric(df['TotalCharges'], errors='coerce')
  df.dropna(inplace=True)
  df['Churn_binary'] = (df['Churn'] == 'Yes').astype(int)
  cat_cols = df.select_dtypes(include='object').columns.drop(['customerID', 'Churn'])
  df_encoded = pd.get_dummies(df.drop(['customerID', 'Churn'], axis=1), columns=cat_cols, drop_first=True)
  X = df_encoded.drop('Churn_binary', axis=1)
  y = df_encoded['Churn_binary']
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.2, stratify=y, random_state=42)

  # Train & evaluate
  best = GradientBoostingClassifier(n_estimators=100, random_state=42)
  best.fit(X_train, y_train)
  y_proba = best.predict_proba(X_test)[:, 1]
  auc = roc_auc_score(y_test, y_proba)
  y_pred = best.predict(X_test)
  tn, fp, fn, tp = confusion_matrix(y_test, y_pred).ravel()
  print(f"AUC: {auc:.3f}")
  print(f"TP: {tp}, FP: {fp}, FN: {fn}, TN: {tn}")
  print(f"Churn recall: {tp/(tp+fn):.3f}")
expected_output: |
  AUC:
  TP:
  Churn recall:
