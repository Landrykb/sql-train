id: carbon_price_ml
name: "Carbon Credit Price ML"
domain: carbon_credits
project: "Carbon Credits"
step_number: 4
tier: 3
skills: [pandas, sklearn, regression, ml, climate]
language: python
dataset_url: "https://data.world/carbonplan/carbon-offsets"
description: "Predict carbon credit price from project features. Train a Random Forest regressor and inspect feature importance to understand what drives carbon credit prices."
prereq_cases: []
learning_objectives:
  - Prepare features for a regression model
  - Train/test split and evaluate with MAE/RMSE
  - Interpret feature importance for carbon credit pricing
  - Understand the limits of small ML models in carbon markets
sections:
  - title: "Load & Prepare Features"
    content: "Load the price dataset and select features."
    code: |
      from pyodide.http import open_url
      import pandas as pd

      df = pd.read_csv(open_url("/datasets/carbon_credit_prices.csv"))
      print(df.head())
      print(f"\nShape: {df.shape}")
      print(df.describe())
    explanation: "Features: issuance size, vintage, and methodology. The target is price per tCO2e. Vintage is encoded as years since 2019 to capture time trends."
  - title: "Train a Random Forest Price Model"
    content: "Split data, train a RandomForestRegressor, and evaluate."
    code: |
      from sklearn.ensemble import RandomForestRegressor
      from sklearn.model_selection import train_test_split
      from sklearn.metrics import mean_absolute_error, mean_squared_error

      df['vintage_age'] = df['vintage'] - 2019
      X = df[['issuance_tco2e','vintage_age','methodology_encoded']]
      y = df['price_usd']

      X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=42)
      model = RandomForestRegressor(n_estimators=100, random_state=42)
      model.fit(X_train, y_train)
      y_pred = model.predict(X_test)

      print(f"MAE: ${mean_absolute_error(y_test, y_pred):.2f}")
      print(f"RMSE: ${mean_squared_error(y_test, y_pred)**0.5:.2f}")
      print(f"Feature importances: {dict(zip(X.columns, model.feature_importances_))}")
    explanation: "Random Forest handles the non-linear relationship between vintage, methodology, issuance, and price. MAE tells us how far off the model is in dollars per tCO2e."
  - title: "Compare Predicted vs Actual"
    content: "Plot predictions against true prices."
    code: |
      import matplotlib.pyplot as plt

      fig, ax = plt.subplots(figsize=(6, 6))
      ax.scatter(y_test, y_pred, alpha=0.6)
      ax.plot([y_test.min(), y_test.max()], [y_test.min(), y_test.max()], color='red', linestyle='--')
      ax.set_xlabel('Actual price USD')
      ax.set_ylabel('Predicted price USD')
      ax.set_title('Carbon Credit Price: Predicted vs Actual')
      plt.tight_layout()
      plt.show()
    explanation: "A perfect model would lie on the red diagonal. Wide scatter means price is driven by factors not in the dataset, such as project narrative, buyer preferences, or additionality claims."
schema:
  - project_id
  - issuance_tco2e
  - vintage
  - methodology_encoded
  - price_usd
thought_process:
  - "Load the carbon credit price dataset"
  - "Engineer a vintage_age feature"
  - "Train a Random Forest regressor"
  - "Evaluate with MAE and visualize predictions"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  from sklearn.ensemble import RandomForestRegressor
  from sklearn.model_selection import train_test_split
  from sklearn.metrics import mean_absolute_error

  df = pd.read_csv(open_url("/datasets/carbon_credit_prices.csv"))
  df['vintage_age'] = df['vintage'] - 2019
  X = df[['issuance_tco2e','vintage_age','methodology_encoded']]
  y = df['price_usd']
  X_train, X_test, y_train, y_test = train_test_split(X, y, test_size=0.3, random_state=42)
  model = RandomForestRegressor(n_estimators=100, random_state=42).fit(X_train, y_train)
  y_pred = model.predict(X_test)
  print(f"MAE: ${mean_absolute_error(y_test, y_pred):.2f}")
  print(f"Importances: {dict(zip(X.columns, model.feature_importances_))}")
expected_output: |
  MAE: $X.XX
  Importances:
hints:
  - "Try adding country or methodology dummies as one-hot features."
  - "More trees (n_estimators) usually improve stability but slow training in the browser."
  - "Carbon credit prices are also driven by narrative and standards, not just numbers."
