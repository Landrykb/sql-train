thought_process:
  - "Encode categorical variables — weather and event types — into numerical form"
  - "Create time-based features like rush hour flags and weekend indicators"
  - "Build interaction terms that capture combined effects (weather × rush hour)"
  - "Scale all numerical features with StandardScaler for model readiness"
  - "Verify the final feature matrix shape and target vector"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np
  from sklearn.preprocessing import LabelEncoder, StandardScaler

  # Load data
  df = pd.read_csv(open_url("/datasets/public_transport_delays.csv"))

  # Clean (from step 2)
  num_cols = df.select_dtypes(include=[np.number]).columns
  df[num_cols] = df[num_cols].fillna(df[num_cols].median())
  cat_cols = df.select_dtypes(include=['object']).columns
  for col in cat_cols:
      df[col] = df[col].fillna(df[col].mode()[0])
  # Combine date + time columns into a single timestamp
  df['datetime']    = pd.to_datetime(df['date'].astype(str) + ' ' + df['time'].astype(str), errors='coerce')
  df['hour']        = df['datetime'].dt.hour
  df['day_of_week'] = df['datetime'].dt.dayofweek
  df['month']       = df['datetime'].dt.month
  df['is_weekend']  = df['day_of_week'].isin([5, 6]).astype(int)

  # Feature engineering
  le = LabelEncoder()
  df['weather_encoded'] = le.fit_transform(df['weather_condition'])
  df['event_encoded'] = le.fit_transform(df['event_type'].fillna('none'))
  df['is_rush_hour'] = df['hour'].isin([7, 8, 9, 17, 18, 19]).astype(int)
  df['weather_rush'] = df['weather_encoded'] * df['is_rush_hour']
  df['event_peak'] = (df['event_encoded'] > 0).astype(int) * df['is_rush_hour']

  feature_cols = ['hour', 'day_of_week', 'month', 'is_weekend',
                  'is_rush_hour', 'weather_encoded', 'event_encoded',
                  'weather_rush', 'event_peak', 'temperature_C']
  X = df[feature_cols]
  y = df['actual_departure_delay_min']
  scaler = StandardScaler()
  X_scaled = pd.DataFrame(scaler.fit_transform(X), columns=feature_cols)
  print(f"Feature matrix: {X_scaled.shape}")
  print(f"Target: {y.shape}")
