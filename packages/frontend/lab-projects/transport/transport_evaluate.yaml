id: transport_evaluate
name: "Evaluate & Interpret Results"
domain: transport
project: "Predict Public Transport Delays"
step_number: 5
tier: 3
skills: [model_evaluation, visualization, interpretation, cross_validation]
language: python
dataset_url: "https://www.kaggle.com/datasets/khushikyad001/public-transport-delays-with-weather-and-events"
description: "Evaluate model performance with proper metrics, visualize predictions vs actuals, and interpret results for stakeholders."
prereq_cases: [transport_model]
learning_objectives:
  - Evaluate regression models with MAE, RMSE, R²
  - Visualize predicted vs actual values
  - Perform cross-validation for robust estimates
  - Communicate findings to non-technical stakeholders
sections:
  - title: "Detailed Model Evaluation"
    content: "Go beyond simple metrics — examine prediction errors and residuals."
    code: |
      from sklearn.metrics import mean_squared_error
      import numpy as np

      y_pred = best_model.predict(X_test)
      rmse = np.sqrt(mean_squared_error(y_test, y_pred))
      residuals = y_test - y_pred

      fig, axes = plt.subplots(1, 3, figsize=(18, 5))

      axes[0].scatter(y_test, y_pred, alpha=0.3, s=10)
      axes[0].plot([y_test.min(), y_test.max()], [y_test.min(), y_test.max()], 'r--')
      axes[0].set_title('Predicted vs Actual')
      axes[0].set_xlabel('Actual Delay (min)')
      axes[0].set_ylabel('Predicted Delay (min)')

      axes[1].hist(residuals, bins=50, color='steelblue', edgecolor='white')
      axes[1].set_title('Residual Distribution')
      axes[1].axvline(0, color='red', linestyle='--')

      axes[2].scatter(y_pred, residuals, alpha=0.3, s=10)
      axes[2].axhline(0, color='red', linestyle='--')
      axes[2].set_title('Residuals vs Predicted')

      plt.tight_layout()
      plt.show()
      print(f"RMSE: {rmse:.2f} minutes")
    explanation: "The scatter plot shows prediction accuracy. Residuals should be normally distributed around 0. If residuals show patterns, the model is missing something systematic."
  - title: "Cross-Validation"
    content: "Get robust performance estimates that account for data variability."
    code: |
      from sklearn.model_selection import cross_val_score

      cv_scores = cross_val_score(
          best_model, X_scaled, y, cv=5,
          scoring='neg_mean_absolute_error'
      )
      print(f"5-Fold CV MAE: {-cv_scores.mean():.2f} ± {cv_scores.std():.2f}")
    explanation: "Cross-validation splits data 5 ways and trains on each fold. The ± value shows stability — large std means the model is sensitive to the data split."
  - title: "Actionable Insights"
    content: "Translate model results into business recommendations."
    code: |
      print("=== KEY FINDINGS ===")
      print(f"1. Average prediction error: {rmse:.1f} minutes")
      print(f"2. Top delay factors: {importances.tail(3).index.tolist()}")
      print(f"3. Weather accounts for ~{importances['weather_encoded']/importances.sum()*100:.0f}% of delay variance")
      print(f"\n=== RECOMMENDATIONS ===")
      print("- Add extra buses during rain/snow forecasts")
      print("- Increase buffer times during rush hour events")
      print("- Monitor the top 3 features for real-time delay alerts")
    explanation: "Data science is only valuable when insights lead to action. Frame findings in terms stakeholders care about — minutes saved, costs reduced, reliability improved."
