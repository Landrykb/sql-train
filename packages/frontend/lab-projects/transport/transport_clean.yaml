id: transport_clean
name: "Clean & Preprocess Data"
domain: transport
project: "Predict Public Transport Delays"
step_number: 2
tier: 1
skills: [pandas, data_cleaning, preprocessing, imputation]
language: python
dataset_url: "https://www.kaggle.com/datasets/khushikyad001/public-transport-delays-with-weather-and-events"
description: "Handle missing values, fix data types, remove outliers, and prepare the dataset for feature engineering."
prereq_cases: [transport_explore]
learning_objectives:
  - Handle missing values with appropriate strategies
  - Convert data types (dates, categoricals)
  - Detect and handle outliers
  - Encode categorical variables
sections:
  - title: "Handle Missing Values"
    content: "Choose the right imputation strategy for each column based on the data type and distribution."
    code: |
      # Numerical: fill with median (robust to outliers)
      num_cols = df.select_dtypes(include=[np.number]).columns
      df[num_cols] = df[num_cols].fillna(df[num_cols].median())

      # Categorical: fill with mode
      cat_cols = df.select_dtypes(include=['object']).columns
      for col in cat_cols:
          df[col] = df[col].fillna(df[col].mode()[0])

      print(f"Remaining nulls: {df.isnull().sum().sum()}")
    explanation: "Median imputation is preferred for skewed numerical data. Mode works well for categorical columns. Never drop rows blindly — you lose valuable data."
  - title: "Fix Data Types & Parse Dates"
    content: "The CSV stores date (YYYY-MM-DD) and time (HH:MM:SS) in two columns — combine them into a single timestamp so .dt.hour is not always 0."
    code: |
      # Combine the date + time columns into a single timestamp
      df['datetime']    = pd.to_datetime(df['date'].astype(str) + ' ' + df['time'].astype(str), errors='coerce')
      df['date']        = df['datetime'].dt.normalize()
      df['hour']        = df['datetime'].dt.hour
      df['day_of_week'] = df['datetime'].dt.dayofweek
      df['month']       = df['datetime'].dt.month
      df['is_weekend']  = df['day_of_week'].isin([5, 6]).astype(int)

      print(df[['datetime', 'hour', 'day_of_week', 'month', 'is_weekend']].head())
    explanation: "Without combining date + time the hour column collapses to 0 and the model loses its strongest signal (rush-hour effects). Always build a single datetime when the CSV splits them."
  - title: "Remove Outliers"
    content: "Use the IQR method to cap extreme delay values."
    code: |
      Q1 = df['actual_departure_delay_min'].quantile(0.25)
      Q3 = df['actual_departure_delay_min'].quantile(0.75)
      IQR = Q3 - Q1
      lower = Q1 - 1.5 * IQR
      upper = Q3 + 1.5 * IQR

      before = len(df)
      df = df[(df['actual_departure_delay_min'] >= lower) & (df['actual_departure_delay_min'] <= upper)]
      print(f"Removed {before - len(df)} outlier rows")
    explanation: "IQR-based outlier removal keeps 99.3% of normally distributed data. Extreme delays may be data errors or rare events that hurt model generalization."
schema:
  - trip_id
  - date
  - transport_type
  - route_id
  - actual_departure_delay_min
  - weather_condition
  - temperature_C
  - event_type
  - peak_hour
  - delayed
thought_process:
  - "Identify which columns have missing values and their percentages"
  - "Choose imputation strategy based on data type: median for numbers, mode for categories"
  - "Parse date strings into datetime objects to extract time features"
  - "Use IQR method to detect and remove extreme outliers in delay_minutes"
  - "Verify no nulls remain and check shape after cleaning"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np

  df = pd.read_csv(open_url("/datasets/public_transport_delays.csv"))
  num_cols = df.select_dtypes(include=[np.number]).columns
  df[num_cols] = df[num_cols].fillna(df[num_cols].median())
  cat_cols = df.select_dtypes(include=['object']).columns
  for col in cat_cols:
      df[col] = df[col].fillna(df[col].mode()[0])

  # Combine the separate date + time columns into a single timestamp
  df['datetime']   = pd.to_datetime(df['date'].astype(str) + ' ' + df['time'].astype(str), errors='coerce')
  df['hour']       = df['datetime'].dt.hour
  df['is_weekend'] = df['datetime'].dt.dayofweek.isin([5, 6]).astype(int)

  Q1 = df['actual_departure_delay_min'].quantile(0.25)
  Q3 = df['actual_departure_delay_min'].quantile(0.75)
  IQR = Q3 - Q1
  df = df[(df['actual_departure_delay_min'] >= Q1 - 1.5*IQR) & (df['actual_departure_delay_min'] <= Q3 + 1.5*IQR)]
  print(f"Remaining nulls: {df.isnull().sum().sum()}")
  print(f"Clean shape: {df.shape}")
expected_output: |
  Remaining nulls: 0
  Clean shape:
hints:
  - "Use df.duplicated().sum() to check for duplicate rows"
  - "Consider pd.get_dummies() for one-hot encoding categoricals"
  - "Always check df.shape before and after cleaning to track data loss"
visualizations:
  - title: "Delay Distribution Before & After Cleaning"
    code: |
      import matplotlib.pyplot as plt
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      # Before cleaning (you'd save this before cleaning)
      df['actual_departure_delay_min'].hist(bins=30, ax=axes[0], edgecolor='black')
      axes[0].set_title('Before Cleaning')
      # After cleaning
      df['actual_departure_delay_min'].hist(bins=30, ax=axes[1], edgecolor='black', color='green')
      axes[1].set_title('After Cleaning')
      plt.tight_layout()
      plt.show()
    description: "Compare delay distribution before and after outlier removal"
  - title: "Missing Values Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      sns.heatmap(df.isnull(), cbar=False, cmap='viridis')
      plt.title('Missing Values Pattern')
      plt.show()
    description: "Visualize missing value patterns before imputation"
  - title: "Outlier Detection Box Plot"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      sns.boxplot(data=df, y='actual_departure_delay_min')
      plt.title('Delay Outliers Detection')
      plt.ylabel('Delay (minutes)')
      plt.show()
    description: "Box plot helps identify outliers before applying IQR method"
  - title: "Hour of Day Distribution"
    code: |
      import matplotlib.pyplot as plt
      df['hour'].hist(bins=24, edgecolor='black')
      plt.title('Distribution of Trips by Hour')
      plt.xlabel('Hour of Day')
      plt.ylabel('Count')
      plt.show()
    description: "Shows peak hours for transport activity after time feature extraction"
