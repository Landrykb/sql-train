id: transport_explore
name: "Explore Transport Delay Data"
domain: transport
project: "Predict Public Transport Delays"
step_number: 1
tier: 1
skills: [pandas, eda, data_loading, visualization]
language: python
dataset_url: "https://www.kaggle.com/datasets/khushikyad001/public-transport-delays-with-weather-and-events"
description: "Load the public transport delays dataset and perform exploratory data analysis to understand delay patterns, weather effects, and event impacts."
prereq_cases: []
learning_objectives:
  - Load CSV data with pandas
  - Examine dataset structure and data types
  - Identify missing values and outliers
  - Create initial visualizations of delay patterns
sections:
  - title: "Import Libraries & Load Data"
    content: "Start by importing the core data science libraries and loading the dataset."
    code: |
      from pyodide.http import open_url
      import pandas as pd
      import numpy as np
      import matplotlib.pyplot as plt
      import seaborn as sns

      df = pd.read_csv(open_url("/datasets/public_transport_delays.csv"))
      print(f"Shape: {df.shape}")
      print(f"Columns: {df.columns.tolist()}")
      df.head()
    explanation: "pandas handles tabular data, numpy does numerical ops, and matplotlib/seaborn create visualizations. Always start by checking shape and column names."
  - title: "Check Data Quality"
    content: "Before any analysis, assess missing values, data types, and basic statistics."
    code: |
      df.info()

      missing = df.isnull().sum()
      missing_pct = (missing / len(df) * 100).round(2)
      print("Missing values (%):")
      print(missing_pct[missing_pct > 0])

      df.describe()
    explanation: "df.info() shows data types and non-null counts. df.describe() gives statistical summaries. Missing value analysis guides your cleaning strategy."
  - title: "Visualize Delay Distribution"
    content: "Understand how delays are distributed and which weather conditions cause the most delays."
    code: |
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))

      axes[0].hist(df['actual_departure_delay_min'], bins=50, color='steelblue', edgecolor='white')
      axes[0].set_title('Distribution of Delay Duration')
      axes[0].set_xlabel('Delay (minutes)')

      df.groupby('weather_condition')['actual_departure_delay_min'].mean().sort_values().plot(
          kind='barh', ax=axes[1], color='coral'
      )
      axes[1].set_title('Avg Delay by Weather')
      plt.tight_layout()
      plt.show()
    explanation: "Histograms reveal the delay distribution shape. Bar charts show which weather conditions correlate with longer delays — key for feature engineering later."
schema:
  - trip_id
  - date
  - transport_type
  - route_id
  - actual_departure_delay_min
  - weather_condition
  - temperature_C
  - event_type
  - peak_hour
  - delayed
thought_process:
  - "Load the dataset and check its shape to understand the data volume"
  - "Examine column names and data types to plan your analysis"
  - "Check for missing values — they'll affect model accuracy later"
  - "Visualize delay distribution to understand if it's normal, skewed, or multimodal"
  - "Group by weather condition to see which conditions cause the worst delays"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd
  import numpy as np

  df = pd.read_csv(open_url("/datasets/public_transport_delays.csv"))
  print(f"Shape: {df.shape}")
  print(f"Columns: {df.columns.tolist()}")
  print(f"Missing values:\n{df.isnull().sum()}")
  print(f"\nDelay stats:\n{df['actual_departure_delay_min'].describe()}")
expected_output: |
  Shape:
  Columns:
hints:
  - "Use sns.heatmap(df.corr(), annot=True) for a correlation matrix"
  - "Try df.value_counts() on categorical columns"
  - "Box plots help identify outliers: sns.boxplot(x='weather', y='delay', data=df)"
visualizations:
  - title: "Delay Distribution Histogram"
    code: |
      import matplotlib.pyplot as plt
      df['actual_departure_delay_min'].hist(bins=30, edgecolor='black', color='steelblue')
      plt.title('Distribution of Delay Duration')
      plt.xlabel('Delay (minutes)')
      plt.ylabel('Count')
      plt.show()
    description: "Shows the overall distribution of delays - check for skewness and outliers"
  - title: "Delay vs Temperature Scatter"
    code: |
      import matplotlib.pyplot as plt
      plt.scatter(df['temperature_C'], df['actual_departure_delay_min'], alpha=0.5)
      plt.title('Delay vs Temperature')
      plt.xlabel('Temperature (°C)')
      plt.ylabel('Delay (minutes)')
      plt.show()
    description: "Examines relationship between temperature and delay duration"
  - title: "Correlation Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      sns.heatmap(df.select_dtypes('number').corr(), annot=True, cmap='coolwarm', fmt='.2f')
      plt.title('Correlation Matrix')
      plt.tight_layout()
      plt.show()
    description: "Shows correlations between numerical features like temperature, delay, etc."
  - title: "Delay by Weather Box Plot"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      sns.boxplot(data=df, x='weather_condition', y='actual_departure_delay_min')
      plt.xticks(rotation=45)
      plt.title('Delay Distribution by Weather Condition')
      plt.tight_layout()
      plt.show()
    description: "Shows delay distribution across different weather conditions"
  - title: "Delay Trend Over Time"
    code: |
      import matplotlib.pyplot as plt
      df.groupby('date')['actual_departure_delay_min'].mean().plot(figsize=(10,4))
      plt.title('Average Delay Trend Over Time')
      plt.xlabel('Date')
      plt.ylabel('Average Delay (minutes)')
      plt.tight_layout()
      plt.show()
    description: "Shows how delays change over time to identify patterns"
