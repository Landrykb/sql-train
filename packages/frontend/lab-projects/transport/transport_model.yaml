id: transport_model
name: "Build Prediction Models"
domain: transport
project: "Predict Public Transport Delays"
step_number: 4
tier: 2
skills: [sklearn, random_forest, xgboost, regression, model_training]
language: python
description: "Train and compare multiple regression models to predict transport delay duration."
prereq_cases: [transport_features]
learning_objectives:
  - Split data into train/test sets
  - Train Linear Regression, Random Forest, and XGBoost models
  - Compare model performance
  - Understand overfitting vs underfitting
sections:
  - title: "Train-Test Split"
    content: "Hold out 20% of data for unbiased evaluation."
    code: |
      from sklearn.model_selection import train_test_split

      X_train, X_test, y_train, y_test = train_test_split(
          X_scaled, y, test_size=0.2, random_state=42
      )
      print(f"Train: {X_train.shape}, Test: {X_test.shape}")
    explanation: "random_state ensures reproducibility. 80/20 is a standard split. For time-series data, consider chronological splitting instead."
  - title: "Train Multiple Models"
    content: "Fit three different regressors and compare them."
    code: |
      from sklearn.linear_model import LinearRegression
      from sklearn.ensemble import RandomForestRegressor
      from xgboost import XGBRegressor
      from sklearn.metrics import mean_absolute_error, r2_score

      models = {
          'Linear Regression': LinearRegression(),
          'Random Forest': RandomForestRegressor(n_estimators=100, random_state=42),
          'XGBoost': XGBRegressor(n_estimators=100, learning_rate=0.1, random_state=42),
      }

      results = {}
      for name, model in models.items():
          model.fit(X_train, y_train)
          y_pred = model.predict(X_test)
          mae = mean_absolute_error(y_test, y_pred)
          r2 = r2_score(y_test, y_pred)
          results[name] = {'MAE': round(mae, 2), 'R²': round(r2, 4)}
          print(f"{name}: MAE={mae:.2f}, R²={r2:.4f}")
    explanation: "MAE tells you the average prediction error in minutes. R² measures how much variance the model explains (1.0 = perfect). Random Forest and XGBoost usually outperform linear models on tabular data."
  - title: "Feature Importance"
    content: "Understand which features drive the predictions."
    code: |
      best_model = models['Random Forest']
      importances = pd.Series(
          best_model.feature_importances_, index=feature_cols
      ).sort_values(ascending=True)

      importances.plot(kind='barh', figsize=(10, 6), color='teal')
      plt.title('Feature Importance (Random Forest)')
      plt.xlabel('Importance')
      plt.tight_layout()
      plt.show()
    explanation: "Feature importance reveals what matters most — is weather more predictive than time of day? This insight is valuable for operations teams to prioritize their response strategies."
