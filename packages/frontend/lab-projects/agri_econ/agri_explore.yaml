id: agri_explore
name: "Explore Agricultural Economics Data"
domain: agri_econ
project: "Agriculture Economics & Food Security"
step_number: 1
tier: 1
skills: [pandas, eda, visualization, economics]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"
description: "Load FAO and USDA agricultural datasets to understand global crop production, trade flows, and food price dynamics."
prereq_cases: []
learning_objectives:
  - Load and merge agricultural datasets from multiple sources
  - Explore global crop production and yield trends
  - Understand food price indices and their drivers
sections:
  - title: "Load Agricultural Data"
    content: "Load crop production and food price data."
    code: |
      import kagglehub
      import os
      import pandas as pd
      import matplotlib.pyplot as plt

      # Download crop yield dataset from Kaggle
      path = kagglehub.dataset_download("patelris/crop-yield-prediction-dataset")
      csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
      print("Available files:", csv_files)
      production = pd.read_csv(os.path.join(path, csv_files[0]))

      print(f"Shape: {production.shape}")
      print(f"Columns: {production.columns.tolist()}")
      print(f"\nFirst 3 rows:")
      print(production.head(3))
    r_code: |
      library(dplyr)

      production <- read.csv('crop_production.csv')
      prices <- read.csv('food_prices.csv')
      prices$date <- as.Date(prices$date)
      trade <- read.csv('trade_flows.csv')

      cat(sprintf("Production records: %s\n", format(nrow(production), big.mark = ",")))
      cat(sprintf("Countries: %d\n", n_distinct(production$country)))
      cat(paste("Crops:", paste(unique(production$crop), collapse = ", "), "\n"))
      cat("\nTop producers (wheat):\n")
      production %>%
        filter(crop == 'wheat') %>%
        group_by(country) %>%
        summarise(total = sum(production_mt)) %>%
        arrange(desc(total)) %>%
        head(5) %>%
        print()
    explanation: "FAO provides global crop production data. Understanding who produces what and how much is the foundation of agricultural economics and food security analysis."
  - title: "Production Trends"
    content: "Visualize how global crop production has changed over time."
    code: |
      fig, axes = plt.subplots(1, 2, figsize=(14, 5))

      for crop in ['wheat', 'rice', 'maize', 'soybeans']:
          yearly = production[production['crop']==crop].groupby('year')['production_mt'].sum()
          axes[0].plot(yearly.index, yearly.values / 1e6, label=crop, linewidth=2)
      axes[0].set_title('Global Crop Production')
      axes[0].set_ylabel('Million MT')
      axes[0].legend()

      for crop in ['wheat', 'rice', 'maize']:
          yearly = production[production['crop']==crop].groupby('year')['yield_per_ha'].mean()
          axes[1].plot(yearly.index, yearly.values, label=crop, linewidth=2)
      axes[1].set_title('Average Yield Per Hectare')
      axes[1].set_ylabel('MT/ha')
      axes[1].legend()

      plt.tight_layout()
      plt.show()
    r_code: |
      library(ggplot2)
      library(dplyr)
      library(gridExtra)

      prod_yearly <- production %>%
        filter(crop %in% c('wheat','rice','maize','soybeans')) %>%
        group_by(year, crop) %>%
        summarise(total = sum(production_mt) / 1e6, .groups = 'drop')

      p1 <- ggplot(prod_yearly, aes(x = year, y = total, color = crop)) +
        geom_line(linewidth = 1) +
        labs(title = 'Global Crop Production', y = 'Million MT') +
        theme_minimal()

      yield_yearly <- production %>%
        filter(crop %in% c('wheat','rice','maize')) %>%
        group_by(year, crop) %>%
        summarise(avg_yield = mean(yield_per_ha), .groups = 'drop')

      p2 <- ggplot(yield_yearly, aes(x = year, y = avg_yield, color = crop)) +
        geom_line(linewidth = 1) +
        labs(title = 'Average Yield Per Hectare', y = 'MT/ha') +
        theme_minimal()

      grid.arrange(p1, p2, ncol = 2)
    explanation: "Global production has grown through both area expansion and yield improvement. Yield growth is slowing in many regions — a key food security concern."
schema:
  - country
  - crop
  - year
  - production_mt
  - yield_per_ha
  - area_harvested
  - population
thought_process:
  - "Load production, prices, and trade datasets"
  - "Check unique countries, crops, and year range"
  - "Identify top producers for key crops (wheat, rice, maize)"
  - "Visualize production and yield trends over time"
solution_code: |
  import kagglehub
  import os
  import pandas as pd

  path = kagglehub.dataset_download("patelris/crop-yield-prediction-dataset")
  csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
  print("Available files:", csv_files)
  df = pd.read_csv(os.path.join(path, csv_files[0]))
  print(f"Shape: {df.shape}")
  print(f"Columns: {df.columns.tolist()}")
  print(f"\nFirst 3 rows:\n{df.head(3)}")
