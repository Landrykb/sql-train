id: agri_explore
name: "Explore Agricultural Economics Data"
domain: agri_econ
project: "Agriculture Economics & Food Security"
step_number: 1
tier: 1
skills: [pandas, eda, visualization, economics]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"
description: "Load the Kaggle pre-joined yield / rainfall / pesticides / temperature panel and explore yield trends across countries and crops."
prereq_cases: []
learning_objectives:
  - Load and inspect a joined agricultural panel (yield × climate × inputs)
  - Identify top yielding countries and crops
  - Visualize yield trends and climate-yield relationships
sections:
  - title: "Load Crop Yield Data"
    content: "The Kaggle `yield_df.csv` joins FAO yield with rainfall, pesticides, and temperature per country/crop/year. Each row = one (Area, Item, Year)."
    code: |
      from pyodide.http import open_url
      import pandas as pd
      import matplotlib.pyplot as plt

      df = pd.read_csv(open_url("/datasets/yield_df.csv"))
      print(f"Shape: {df.shape}")
      print(f"Columns: {df.columns.tolist()}")
      print(f"\nYears: {df['Year'].min()} → {df['Year'].max()}")
      print(f"Countries: {df['Area'].nunique()}")
      print(f"Crops: {df['Item'].nunique()}")
      df.head()
    r_code: |
      library(dplyr)

      df <- read.csv('yield_df.csv')
      cat(sprintf("Rows: %s\n", format(nrow(df), big.mark = ',')))
      cat(sprintf("Countries: %d\n", n_distinct(df$Area)))
      cat(sprintf("Crops: %d\n", n_distinct(df$Item)))
    explanation: "`hg/ha_yield` is the yield in hectograms per hectare (Kaggle keeps the awkward FAO unit). Rainfall, pesticides, and avg_temp are the joined climate / input features."
  - title: "Top Producers, Crops & Yield Distribution"
    content: "Summarise yield by country and crop, plus the distribution of the target variable."
    code: |
      fig, axes = plt.subplots(1, 3, figsize=(16, 5))

      top_crops = df.groupby('Item')['hg/ha_yield'].mean().nlargest(8)
      top_crops.plot(kind='barh', ax=axes[0], color='forestgreen')
      axes[0].set_title('Mean Yield by Crop (hg/ha)')

      top_countries = df.groupby('Area')['hg/ha_yield'].mean().nlargest(8)
      top_countries.plot(kind='barh', ax=axes[1], color='steelblue')
      axes[1].set_title('Mean Yield by Country (hg/ha)')

      axes[2].hist(df['hg/ha_yield'], bins=60, color='coral', edgecolor='black')
      axes[2].set_title('Yield Distribution')
      axes[2].set_xlabel('hg/ha_yield')

      plt.tight_layout()
      plt.show()
    r_code: |
      library(dplyr)
      library(ggplot2)

      df %>%
        group_by(Item) %>%
        summarise(yield = mean(hg.ha_yield, na.rm = TRUE)) %>%
        arrange(desc(yield)) %>%
        head(8) %>%
        ggplot(aes(x = yield, y = reorder(Item, yield))) +
          geom_col(fill = 'forestgreen') +
          labs(title = 'Mean Yield by Crop') +
          theme_minimal()
    explanation: "High-yield crops (potatoes, sweet potatoes, cassava) consistently top the list because hg/ha doesn't adjust for caloric value. A per-calorie yield would tell a different story."
  - title: "Quick Climate-Yield Correlation"
    content: "A first look at how rainfall and temperature correlate with yield across the whole panel."
    code: |
      corr = df[['hg/ha_yield', 'average_rain_fall_mm_per_year',
                 'pesticides_tonnes', 'avg_temp']].corr()
      print("Correlation with hg/ha_yield:")
      print(corr['hg/ha_yield'].round(3))
    explanation: "In a global panel these correlations are weak because optimal rainfall and temperature are crop-specific. A per-crop or per-country model will reveal stronger relationships."
schema:
  - Area
  - Item
  - Year
  - hg/ha_yield
  - average_rain_fall_mm_per_year
  - pesticides_tonnes
  - avg_temp
thought_process:
  - "Load the Kaggle pre-joined yield/climate/pesticides panel"
  - "Count unique Area and Item values"
  - "Aggregate mean yield per crop and per country"
  - "Plot distribution of the target (hg/ha_yield)"
  - "Compute correlation between yield and climate / input features"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  df = pd.read_csv(open_url("/datasets/yield_df.csv"))
  print(f"Shape: {df.shape}")
  print(f"Columns: {df.columns.tolist()}")
  print(f"\nMean yield by crop (top 3):")
  print(df.groupby('Item')['hg/ha_yield'].mean().nlargest(3).round(0))
  print(f"\nCorrelation with yield:")
  print(df[['hg/ha_yield','average_rain_fall_mm_per_year','pesticides_tonnes','avg_temp']].corr()['hg/ha_yield'].round(3))
expected_output: |
  Shape:
  Columns:
  Mean yield by crop (top 3):
hints:
  - "Plot yield vs avg_temp per crop to find each crop's sweet spot"
  - "Compute country-level trend: is yield growing, flat, or falling?"
  - "Segment by decade to see how the rainfall-yield relationship evolves"
visualizations:
  - title: "Mean Yield by Crop"
    code: |
      import matplotlib.pyplot as plt
      top_crops = df.groupby('Item')['hg/ha_yield'].mean().nlargest(8)
      top_crops.plot(kind='barh', color='forestgreen')
      plt.title('Mean Yield by Crop (hg/ha)')
      plt.xlabel('Yield (hg/ha)')
      plt.tight_layout()
      plt.show()
    description: "Shows average yield across different crop types"
  - title: "Mean Yield by Country"
    code: |
      import matplotlib.pyplot as plt
      top_countries = df.groupby('Area')['hg/ha_yield'].mean().nlargest(8)
      top_countries.plot(kind='barh', color='steelblue')
      plt.title('Mean Yield by Country (hg/ha)')
      plt.xlabel('Yield (hg/ha)')
      plt.tight_layout()
      plt.show()
    description: "Shows top yielding countries"
  - title: "Yield Distribution"
    code: |
      import matplotlib.pyplot as plt
      df['hg/ha_yield'].hist(bins=60, color='coral', edgecolor='black')
      plt.title('Yield Distribution')
      plt.xlabel('hg/ha_yield')
      plt.ylabel('Count')
      plt.show()
    description: "Shows distribution of crop yields"
  - title: "Climate-Yield Correlation Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      corr = df[['hg/ha_yield', 'average_rain_fall_mm_per_year', 'pesticides_tonnes', 'avg_temp']].corr()
      sns.heatmap(corr, annot=True, cmap='coolwarm', fmt='.2f')
      plt.title('Climate-Yield Correlation Matrix')
      plt.tight_layout()
      plt.show()
    description: "Shows correlations between yield and climate variables"
