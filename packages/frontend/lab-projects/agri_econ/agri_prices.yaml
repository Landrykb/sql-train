id: agri_prices
name: "Commodity Price Analysis"
domain: agri_econ
project: "Agriculture Economics & Food Security"
step_number: 2
tier: 2
skills: [time_series, price_analysis, volatility, correlation]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"
description: "Analyze agricultural commodity price dynamics — volatility, seasonality, and correlations with macroeconomic factors."
prereq_cases: [agri_explore]
learning_objectives:
  - Analyze price volatility and seasonality in commodity markets
  - Identify price correlations between crops and energy
  - Model price drivers with regression
sections:
  - title: "Price Trends & Volatility"
    content: "Visualize price history and measure volatility."
    code: |
      prices_monthly = prices.set_index('date').resample('M').mean()

      fig, axes = plt.subplots(2, 1, figsize=(14, 8), sharex=True)
      for crop in ['wheat', 'corn', 'soybeans']:
          axes[0].plot(prices_monthly.index, prices_monthly[crop], label=crop, linewidth=1.5)
      axes[0].set_title('Monthly Commodity Prices')
      axes[0].set_ylabel('USD/MT')
      axes[0].legend()

      rolling_vol = prices_monthly[['wheat','corn','soybeans']].pct_change().rolling(12).std() * 100
      rolling_vol.plot(ax=axes[1], linewidth=1.5)
      axes[1].set_title('12-Month Rolling Volatility (%)')
      axes[1].set_ylabel('Volatility (%)')

      plt.tight_layout()
      plt.show()
    r_code: |
      library(dplyr)
      library(ggplot2)
      library(zoo)
      library(gridExtra)

      prices$date <- as.Date(prices$date)
      prices_monthly <- prices %>%
        mutate(month = format(date, '%Y-%m')) %>%
        group_by(month) %>%
        summarise(across(c(wheat, corn, soybeans), mean, .names = "{.col}"), .groups = 'drop') %>%
        mutate(month = as.Date(paste0(month, '-01')))

      p1 <- prices_monthly %>%
        tidyr::pivot_longer(c(wheat, corn, soybeans), names_to = 'crop', values_to = 'price') %>%
        ggplot(aes(x = month, y = price, color = crop)) +
        geom_line(linewidth = 1) +
        labs(title = 'Monthly Commodity Prices', y = 'USD/MT') +
        theme_minimal()

      # Rolling volatility
      vol_data <- prices_monthly %>%
        mutate(across(c(wheat, corn, soybeans), ~rollapply(.x / lag(.x) - 1, 12, sd, fill = NA) * 100))

      p2 <- vol_data %>%
        tidyr::pivot_longer(c(wheat, corn, soybeans), names_to = 'crop', values_to = 'vol') %>%
        ggplot(aes(x = month, y = vol, color = crop)) +
        geom_line(linewidth = 1) +
        labs(title = '12-Month Rolling Volatility (%)', y = 'Volatility (%)') +
        theme_minimal()

      grid.arrange(p1, p2, nrow = 2)
    explanation: "Commodity prices spike during supply shocks (droughts, conflicts). Volatility clustering shows periods of high uncertainty — critical for food security planning and hedging."
  - title: "Cross-Commodity Correlations"
    content: "Explore how crop prices move together and with energy."
    code: |
      import seaborn as sns

      price_cols = ['wheat', 'corn', 'soybeans', 'rice', 'oil_price', 'fertilizer_index']
      corr = prices_monthly[price_cols].corr()

      plt.figure(figsize=(8, 6))
      sns.heatmap(corr, annot=True, cmap='RdYlGn', center=0, fmt='.2f')
      plt.title('Commodity Price Correlations')
      plt.tight_layout()
      plt.show()
    r_code: |
      library(corrplot)

      price_cols <- prices_monthly[, c('wheat','corn','soybeans','rice','oil_price','fertilizer_index')]
      corr_mat <- cor(price_cols, use = 'complete.obs')

      corrplot(corr_mat, method = 'color', type = 'lower',
               addCoef.col = 'black', number.cex = 0.8,
               title = 'Commodity Price Correlations',
               mar = c(0, 0, 2, 0))
    explanation: "Corn-soybean correlation is high (competing for the same land). Oil prices drive fertilizer costs which drive crop prices. These linkages create systemic food price risk."
schema:
  - date
  - wheat
  - corn
  - soybeans
  - rice
  - oil_price
  - fertilizer_index
thought_process:
  - "Resample prices to monthly frequency"
  - "Plot price trends for major commodities"
  - "Calculate 12-month rolling volatility"
  - "Build a correlation matrix including energy and fertilizer"
solution_code: |
  import kagglehub
  import os
  import pandas as pd

  path = kagglehub.dataset_download("patelris/crop-yield-prediction-dataset")
  csv_files = [f for f in os.listdir(path) if f.endswith('.csv')]
  df = pd.read_csv(os.path.join(path, csv_files[0]))
  print(f"Shape: {df.shape}")
  print(f"Columns: {df.columns.tolist()}")
  num_cols = df.select_dtypes(include='number').columns
  print(f"\nCorrelations:\n{df[num_cols].corr().round(3)}")
expected_output: |
  Shape:
  Columns:
