id: agri_prices
name: "Crop Yield Volatility & Correlation"
domain: agri_econ
project: "Agriculture Economics & Food Security"
step_number: 2
tier: 2
skills: [time_series, volatility, correlation]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"
description: "Treat the Kaggle yield panel as a time-series problem — measure year-over-year volatility per crop and cross-crop correlation structure."
prereq_cases: [agri_explore]
learning_objectives:
  - Pivot a long-format panel to a wide crop × year matrix
  - Compute year-over-year volatility per crop
  - Quantify cross-crop return correlation"
sections:
  - title: "Pivot to Crop × Year Matrix"
    content: "Pivot `hg/ha_yield` by `Item` to get a classic time-series with one column per crop."
    code: |
      from pyodide.http import open_url
      import pandas as pd
      import matplotlib.pyplot as plt

      df = pd.read_csv(open_url("/datasets/yield_df.csv"))
      wide = df.pivot_table(index='Year', columns='Item', values='hg/ha_yield', aggfunc='mean')
      focus = [c for c in ['Maize', 'Wheat', 'Rice, paddy', 'Soybeans', 'Potatoes'] if c in wide.columns][:4]
      wide = wide[focus].dropna(how='all')

      wide.plot(figsize=(14, 5), linewidth=1.5)
      plt.title('Average Yield Over Time — Selected Crops')
      plt.ylabel('hg/ha_yield')
      plt.tight_layout()
      plt.show()
      print(wide.tail())
    r_code: |
      library(dplyr)
      library(tidyr)
      library(ggplot2)

      df <- read.csv('yield_df.csv')
      wide <- df %>%
        group_by(Year, Item) %>%
        summarise(yield = mean(hg.ha_yield, na.rm = TRUE), .groups = 'drop') %>%
        pivot_wider(names_from = Item, values_from = yield)
      focus <- intersect(c('Maize','Wheat','Rice, paddy','Soybeans','Potatoes'), colnames(wide))[1:4]

      wide %>%
        select(Year, all_of(focus)) %>%
        pivot_longer(-Year, names_to = 'Item', values_to = 'yield') %>%
        ggplot(aes(x = Year, y = yield, color = Item)) +
          geom_line(linewidth = 1) +
          labs(title = 'Average Yield Over Time') +
          theme_minimal()
    explanation: "Averaging across countries smooths local shocks and reveals the secular yield-growth trend — strong for wheat and maize, much weaker for rice."
  - title: "Rolling Volatility & Correlation"
    content: "Year-over-year percent changes + a correlation matrix expose which crops move together."
    code: |
      yoy = wide.pct_change().dropna()
      vol = yoy.rolling(5).std() * 100

      fig, axes = plt.subplots(1, 2, figsize=(14, 5))
      vol.plot(ax=axes[0], linewidth=1.5)
      axes[0].set_title('5-Year Rolling YoY Yield Volatility (%)')

      corr = yoy.corr()
      im = axes[1].imshow(corr, cmap='RdYlGn', vmin=-1, vmax=1)
      axes[1].set_xticks(range(len(corr))); axes[1].set_xticklabels(corr.columns, rotation=45, ha='right')
      axes[1].set_yticks(range(len(corr))); axes[1].set_yticklabels(corr.columns)
      axes[1].set_title('Cross-Crop YoY Correlation')
      plt.colorbar(im, ax=axes[1], fraction=0.04)
      plt.tight_layout()
      plt.show()
      print(corr.round(2))
    r_code: |
      library(dplyr)

      yoy <- wide %>% arrange(Year) %>% mutate(across(-Year, ~ . / lag(.) - 1))
      corr_mat <- cor(yoy[, focus], use = 'pairwise.complete.obs')
      round(corr_mat, 2)
    explanation: "Yields co-move — good weather lifts most crops at once. The correlation matrix tells you how much of the volatility is systemic (weather, policy) versus idiosyncratic (pests, crop-specific cycles)."
schema:
  - Area
  - Item
  - Year
  - hg/ha_yield
  - average_rain_fall_mm_per_year
  - pesticides_tonnes
  - avg_temp
thought_process:
  - "Pivot long panel to a wide Year × Item yield matrix"
  - "Compute year-over-year percent changes"
  - "Rolling 5-year std shows volatility regimes"
  - "Cross-crop correlation reveals systemic vs idiosyncratic shocks"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd

  df = pd.read_csv(open_url("/datasets/yield_df.csv"))
  wide = df.pivot_table(index='Year', columns='Item', values='hg/ha_yield', aggfunc='mean')
  focus = [c for c in ['Maize','Wheat','Rice, paddy','Soybeans'] if c in wide.columns]
  yoy = wide[focus].pct_change().dropna()
  print(f"Shape: {df.shape}")
  print(f"Focus crops: {focus}")
  print(f"\nMean YoY yield volatility (%):")
  print((yoy.std() * 100).round(2))
expected_output: |
  Shape:
  Focus crops:
  Mean YoY yield volatility (%):
hints:
  - "Add Granger-causality tests between crops for lead-lag relationships"
  - "Break out by country — volatility in developing markets is much higher"
  - "Use avg_temp deviations as an exogenous regressor in the YoY model"
visualizations:
  - title: "Yield Over Time by Crop"
    code: |
      import matplotlib.pyplot as plt
      wide.plot(figsize=(14, 5), linewidth=1.5)
      plt.title('Average Yield Over Time — Selected Crops')
      plt.ylabel('hg/ha_yield')
      plt.tight_layout()
      plt.show()
    description: "Shows historical yield trends for different crops"
  - title: "Rolling Volatility"
    code: |
      import matplotlib.pyplot as plt
      vol.plot(linewidth=1.5)
      plt.title('5-Year Rolling YoY Yield Volatility (%)')
      plt.ylabel('Volatility (%)')
      plt.show()
    description: "Shows rolling 5-year volatility of year-over-year yield changes"
  - title: "Cross-Crop Correlation Heatmap"
    code: |
      import seaborn as sns
      import matplotlib.pyplot as plt
      corr = yoy.corr()
      sns.heatmap(corr, annot=True, cmap='RdYlGn', center=0, fmt='.2f')
      plt.title('Cross-Crop YoY Correlation')
      plt.tight_layout()
      plt.show()
    description: "Shows correlation between yield changes across crops"
  - title: "YoY Yield Change Distribution"
    code: |
      import matplotlib.pyplot as plt
      yoy.hist(bins=30, edgecolor='black', figsize=(10, 6))
      plt.title('Year-over-Year Yield Change Distribution')
      plt.xlabel('YoY Change')
      plt.ylabel('Count')
      plt.legend(yoy.columns)
      plt.show()
    description: "Shows distribution of year-over-year yield changes"
