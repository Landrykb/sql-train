id: agri_policy
name: "Food Security & Climate Policy Analysis"
domain: agri_econ
project: "Agriculture Economics & Food Security"
step_number: 4
tier: 3
skills: [policy_analysis, scenario_modeling, reporting]
language: "Python / R"
dataset_url: "https://www.kaggle.com/datasets/patelris/crop-yield-prediction-dataset"
description: "Use the Kaggle yield + climate panel to build country-level food-security indicators and model how higher temperatures shift yields."
prereq_cases: [agri_yield]
learning_objectives:
  - Aggregate the panel to country-level yield and climate indicators
  - Rank countries by yield level and volatility
  - Translate a warming scenario into yield deltas using an elasticity
sections:
  - title: "Country-Level Indicators"
    content: "Collapse the panel by Area (country), computing average yield, yield volatility, and average rainfall / temperature."
    code: |
      from pyodide.http import open_url
      import pandas as pd

      df = pd.read_csv(open_url("/datasets/yield_df.csv")).dropna()

      country = df.groupby('Area').agg(
          avg_yield=('hg/ha_yield', 'mean'),
          yield_std=('hg/ha_yield', 'std'),
          avg_rain =('average_rain_fall_mm_per_year', 'mean'),
          avg_temp =('avg_temp', 'mean'),
          crops    =('Item', 'nunique'),
          years    =('Year', 'nunique'),
      ).reset_index()
      country['cv'] = country['yield_std'] / country['avg_yield']

      print("Top 10 countries by yield:")
      print(country.nlargest(10, 'avg_yield')[['Area','avg_yield','avg_temp','avg_rain']].to_string(index=False))
      print("\nMost volatile (top 5 CV):")
      print(country.nlargest(5, 'cv')[['Area','avg_yield','cv']].to_string(index=False))
    r_code: |
      library(dplyr)

      df <- read.csv('yield_df.csv')
      df <- df[complete.cases(df), ]

      country <- df %>%
        group_by(Area) %>%
        summarise(
          avg_yield = mean(hg.ha_yield, na.rm = TRUE),
          yield_std = sd(hg.ha_yield,   na.rm = TRUE),
          avg_rain  = mean(average_rain_fall_mm_per_year, na.rm = TRUE),
          avg_temp  = mean(avg_temp,    na.rm = TRUE),
          cv        = yield_std / avg_yield,
        )
      country %>% arrange(desc(avg_yield)) %>% head(10) %>% print()
    explanation: "The coefficient of variation (std / mean) is unitless and comparable across countries. Low-yield countries often have HIGH CV — they're more exposed to weather shocks."
  - title: "Warming Scenarios via Temperature Elasticity"
    content: "Fit a quick elasticity of yield to temperature (log-log), then apply +1.5 / +2.0 / +3.0°C shifts."
    code: |
      import numpy as np
      from sklearn.linear_model import LinearRegression

      # Simple per-crop elasticity: log(yield) ~ log(temp)
      # We estimate it from the pooled data to keep the example self-contained.
      sub = df[(df['avg_temp'] > 0) & (df['hg/ha_yield'] > 0)]
      X = np.log(sub[['avg_temp']].values)
      y = np.log(sub['hg/ha_yield'].values)
      model = LinearRegression().fit(X, y)
      elasticity = model.coef_[0]
      print(f"Pooled yield-temperature elasticity: {elasticity:+.3f}")
      print("  (interpretation: a 1% rise in avg_temp changes yield by ~{:.2f}%)".format(elasticity))

      base_temp = country['avg_temp'].mean()
      threshold = country['avg_yield'].quantile(0.25)
      print(f"\n=== CLIMATE IMPACT ON COUNTRY-LEVEL YIELD ===")
      print(f"Baseline 25th-percentile avg yield: {threshold:,.0f} hg/ha\n")
      for delta in [1.5, 2.0, 3.0]:
          new_temp = country['avg_temp'] + delta
          pct_change = ((new_temp / country['avg_temp']) ** elasticity - 1) * 100
          adjusted = country['avg_yield'] * (1 + pct_change / 100)
          at_risk = (adjusted < threshold).sum()
          print(f"+{delta}°C: mean pct change = {pct_change.mean():+.2f}%, {at_risk} countries below threshold")
    explanation: "A pooled elasticity is a crude approximation — tropical crops have a very different temperature response than temperate ones. In a production model you'd estimate this per Item × climate zone."
schema:
  - Area
  - Item
  - Year
  - hg/ha_yield
  - average_rain_fall_mm_per_year
  - pesticides_tonnes
  - avg_temp
thought_process:
  - "Aggregate panel to country-level indicators (mean yield, volatility, climate means)"
  - "Estimate a yield-temperature elasticity from pooled log-log regression"
  - "Apply +1.5 / +2.0 / +3.0°C shifts to each country's baseline temperature"
  - "Count countries falling below a food-security threshold"
solution_code: |
  from pyodide.http import open_url
  import pandas as pd, numpy as np
  from sklearn.linear_model import LinearRegression

  df = pd.read_csv(open_url("/datasets/yield_df.csv")).dropna()
  country = df.groupby('Area').agg(avg_yield=('hg/ha_yield','mean'),
                                   avg_temp=('avg_temp','mean')).reset_index()

  sub = df[(df['avg_temp'] > 0) & (df['hg/ha_yield'] > 0)]
  elasticity = LinearRegression().fit(np.log(sub[['avg_temp']]),
                                      np.log(sub['hg/ha_yield'])).coef_[0]

  threshold = country['avg_yield'].quantile(0.25)
  print(f"Yield-temperature elasticity: {elasticity:+.3f}")
  for delta in [1.5, 2.0, 3.0]:
      pct = ((country['avg_temp'] + delta) / country['avg_temp']) ** elasticity - 1
      at_risk = (country['avg_yield'] * (1 + pct) < threshold).sum()
      print(f"+{delta}°C: {at_risk} of {len(country)} countries below threshold")
