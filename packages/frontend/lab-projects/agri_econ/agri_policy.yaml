      country.nlargest(10, 'avg_yield').plot(kind='barh', x='Area', y='avg_yield', color='forestgreen')
      plt.title('Top 10 Countries by Average Yield')
      plt.xlabel('Yield (hg/ha)')
      plt.tight_layout()
      plt.show()
    description: "Shows countries with highest average crop yields"
  - title: "Yield Volatility (Coefficient of Variation)"
    code: |
      import matplotlib.pyplot as plt
      country.nlargest(10, 'cv').plot(kind='barh', x='Area', y='cv', color='coral')
      plt.title('Top 10 Most Volatile Countries')
      plt.xlabel('Coefficient of Variation')
      plt.tight_layout()
      plt.show()
    description: "Shows countries with most variable yields"
  - title: "Temperature vs Yield Scatter"
    code: |
      import matplotlib.pyplot as plt
      plt.scatter(country['avg_temp'], country['avg_yield'], alpha=0.5)
      plt.xlabel('Average Temperature')
      plt.ylabel('Average Yield (hg/ha)')
      plt.title('Temperature vs Yield by Country')
      plt.show()
    description: "Shows relationship between temperature and yield"
  - title: "Climate Impact on Yield"
