name: Semgrep SAST

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        id: semgrep
        run: |
          set +e
          semgrep scan --config=auto --sarif --output=semgrep.sarif .
          EXIT_CODE=$?
          echo "exit=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Exit 1 means findings; other non-zero codes are real errors.
          exit 0

      - name: Upload SARIF to GitHub Security tab
        # Skip SARIF upload for PRs from forks (token lacks security-events:write).
        if: |
          hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

      - name: Fail on Semgrep runtime error
        if: steps.semgrep.outputs.exit != '0' && steps.semgrep.outputs.exit != '1'
        run: exit 1
