name: StackHawk DAST

on:
  # Trigger after Vercel/Render deploys a preview or production build.
  deployment_status:
  workflow_dispatch:
    inputs:
      host:
        description: 'Target URL to scan (e.g. https://besa-sqlverse.vercel.app)'
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  stackhawk:
    name: StackHawk scan
    runs-on: ubuntu-latest
    # Only run when the API key / app ID are configured and a target host exists.
    if: secrets.HAWK_API_KEY != '' && secrets.HAWK_APP_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success'))
    env:
      HAWK_API_KEY: ${{ secrets.HAWK_API_KEY }}
      HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
      HAWK_HOST: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.environment_url || inputs.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate target URL
        if: env.HAWK_HOST == ''
        run: |
          echo "::error::HAWK_HOST is not set. Provide a host input or ensure deployment_status.environment_url is present."
          exit 1

      - name: Run HawkScan
        uses: stackhawk/hawkscan-action@v2.2.0
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          configurationFiles: packages/frontend/stackhawk.yml
        env:
          HAWK_APP_ID: ${{ secrets.HAWK_APP_ID }}
          HAWK_HOST: ${{ env.HAWK_HOST }}
